# ---------------------------------------------------------------------------
# COMPETENCY MATRIX — all four columns required, all values constrained to the
# brief's five-level enum. `current` values are USER-SUPPLIED, not assumed,
# except where explicitly marked inferred.
# ---------------------------------------------------------------------------

competencies:
  g8_flattening_record: >-
    APPLIED AT G8, ITERATED TO CONVERGENCE. An independent traceability audit found 15 level-rises with no
    deliverable produced anywhere in the interval the rise spanned -- seven M6 jumps to Production competence
    resting on artifacts that already existed at M3 (when the same rows rated Independent implementation),
    and seven M12 claims, three of them "Can design and review others' systems", resting on nothing produced
    after M05. The structural cause is the deliverable-density curve: M01-M03 produce 59 of 81 deliverables
    and M07-M12 produce 10 between them. months_thin_note defends the thinness of the PLAN; it did not
    defend a competency matrix that kept rising against it.
    canon's own evidence_rule says a target must be "re-planned or downgraded, never silently held", so the
    unsupported targets were FLATTENED to what the evidence supports rather than new deliverables being
    invented to justify a level. Flattening m6 exposed further unsupported m12 rises, so the pass was
    iterated to convergence: 22 targets in total. NO COMPETENCY NOW CLAIMS "Can design and review others'
    systems" AT TWELVE MONTHS. The highest twelve-month claim is Production competence, on 6 of 17 rows.
    This is a real reduction in what the programme promises, and it is the honest one: a programme whose
    engineering deliverables stop at M09 should not claim a reviewing-others level at M12.
  evidence_per_column_rule: >-
    ADDED AT G8. evidence_ids was a single flat pool and the matrix rendered ONE "Evidence required" column
    for four horizons, which is exactly why the 15 gaps above were invisible to a reader and to make check.
    Rows now carry evidence_m3, evidence_m6 and evidence_m12, partitioned by the month each deliverable
    lands in. Fifteen rows have an EMPTY evidence_m12 -- that is not a defect to be filled, it is the
    deliverable-density curve made visible, and it is why the m12 targets were flattened.
  home_file: "reference/competency-matrix.md"
  level_enum: ["Awareness", "Working knowledge", "Independent implementation", "Production competence", "Can design and review others' systems"]
  level_enum_note: >-
    The brief renders the fifth level as 'Can design/review others' systems'. Canon's enum value
    is 'Can design and review others' systems' because that is the string the G2 gate checks.
    reference/competency-matrix.md renders the brief's literal slash form in its prose heading;
    canon's enum value is what every machine check compares against. Both forms are recorded here
    so the difference is a documented choice rather than a drift.
  evidence_rule: "NEVER ALLOW 'I studied it' AS EVIDENCE. Every column value must map to at least one deliverable id. A target with no evidence id at its checkpoint month is re-planned or downgraded, never silently held. SCOPED AT G8 (T7): this applies to the THREE TARGET COLUMNS only. `current` is unevidenced on all 17 rows by construction -- no deliverable predates the programme -- so the rule as written was unsatisfiable and false for 17/17. Four current levels are user-supplied and the rest inferred; the matrix prose already says so honestly."
  rows:
