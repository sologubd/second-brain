# 3. RECOMPUTED FUNNEL ARITHMETIC
# ---------------------------------------------------------------------------
#
#   SUPERSEDED:  52 x [2%, 15%] reply x 40% conversion = 0.42 - 3.12 calls,
#                "0-3 calls, planned as 2".
#   CORRECTED:   reply 1.5-8% (midpoint 4.75%), reply->call 15-35% (midpoint 25%).
#
#     replies  = 52 x [0.015, 0.08]          = [0.78, 4.16]   midpoint 2.470
#     calls    = 52 x [0.015,0.08] x [0.15,0.35] = [0.117, 1.456]  midpoint 0.6175
