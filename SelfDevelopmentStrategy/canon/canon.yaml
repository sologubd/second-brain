#   STATED AS: 0-1 calls expected, PLANNED AS 1. Two calls is unsupportable: the
#   midpoint expectation is 0.62 and even at the BAND CEILING it is 1.46.
#
#   Maturation model, stated because every threshold is sited against it: a send
#   matures ONE WEEK after it goes out (the fast end of the 1.5-3 week band).
#   Matured sends by end of week: W03 4, W04 9, W05 15, W06 24, W07 33, W08 41,
#   W09 47, W10 52. Under the conservative read every row below fires one week
#   later; that shift is recorded, not hidden.
