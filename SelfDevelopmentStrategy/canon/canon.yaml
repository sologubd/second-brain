    resolution: "MONTHS 04–12 GET THEIR OWN FILES — months/month-01.md through month-12.md, twelve files. The eight directories and their purposes are treated as load-bearing and are preserved; the file set within them is extended where the brief's own requirements demand it. Additions beyond the brief's 45: HOW-TO-EDIT.md (the retrospective loop needs a home or the mutation path is undocumented), months/ (12), reference/ (5), canon/ (2), tools/ (8), Makefile, .gitignore, resources/ecosystem-snapshot-2026-08.md, templates/week-template.md. Total 79, itemised in file_manifest — the two task fixtures projects.platform.task_file_schema defines were added when S0's and S2's shared input turned out to have no schema and no file. Every addition has a stated purpose; none exists to make the repository look large."
