# ---------------------------------------------------------------------------
# SCHEMAS — required sections, IN ORDER, for all 13 file schemas.
# file_manifest assigns one of these names to every one of the 79 files.
# tools/check-schema.py enforces `sections` in order; tools/coverage-report.py
# diffs file_manifest x schemas.
#
# WITHOUT THIS BLOCK, prose lanes had no option but to invent structure, which
# directly contradicts the governing rule at the head of this file. The week
# section list is taken from the brief's own template VERBATIM.
# ---------------------------------------------------------------------------

schemas:
  non_prose_file_classes:
    note: >-
      file_manifest assigns FOUR further labels that are NOT prose schemas and to which
      check-schema does not apply: `canon` (2 files), `tool` (8 files), `build` (2 files) and
      `task` (2 files) — 14 files in total. coverage-report must treat these as SATISFIED BY
      EXCLUSION rather than reporting 14 unmapped rows. 79 files = 65 prose files across 13
      schemas + 14 non-prose.
    classes:
      - {name: "canon", files: 2, validated_by: "YAML parse plus the seven check-hours assertions and the G2 count assertions"}
      - {name: "tool", files: 8, validated_by: "each script run against a deliberately malformed fixture"}
      - {name: "build", files: 2, validated_by: "`make check` executing end to end"}
      - {name: "task", files: 2, validated_by: "`make demo-s0 TASK=tasks/example.md` dispatching, and `tasks/ambiguous.md` being refused before any model call by EX-FAIL-01's pre-dispatch score"}
  word_band_status: >-
    All `word_band` values below are PRIOR ESTIMATES. G5b measures
    weeks/week-05.md — the median-complexity exemplar — and DERIVES the bands for all
    13 schemas from it, replacing these numbers. G5b itself fails only outside a wide
    sanity band (week files 1,200–3,000 words), so the exemplar cannot both set and
    fail its own ceiling. Ceilings are enforced as well as floors: a schema with only
    a floor invites motivational filler, which is an anti-goal.
  universal_rules:
    - "Zero placeholder tokens: no TODO, no TBD, no [[GAP:, no empty section. `[[GAP:` is a BLOCKING lint token."
    - "`<!-- user:actuals -->` regions contain ONLY the template placeholder at build time, so the runtime exemption is not an evasion hole."
    - "tools/fixtures/ is excluded from the placeholder lint — otherwise the fixture proving gen-derived preserves user entries fails the lint that proves it."
    - "Every number, id, verdict string and stage semantic must be traceable to canon. Prose expands rows and never invents."
    - "Anchor links are permitted only into G4 spine files whose heading text canon fixes."

  week:
    per_file_band_overrides:
      "weeks/week-12.md": [1700, 3100]
      "weeks/week-01.md": [1700, 2950]
    per_file_band_note_w01: >-
      ADDED with weeks['01'].quota_measurement_method. W01 is the only week file that must render a
      MEASUREMENT PROCEDURE — battery shape, the eight per-run fields, the extrapolation, the
      no-stall case, the isolation rule and the label that separates a measurement from a floor.
      That is roughly 250 words no other week owes, and it exists because AC-w01-2b asks for a
      number and the task previously said what to log without saying how to read anything. The
      alternative was to keep the criterion and delete the method, which is the failure already on
      record three times in this build. The ceiling is the anti-padding control and it still binds:
      2,950 against a measured 2,913, with the band raised by exactly the block that earned it.
    per_file_band_note: >-
      ADDED AT G6. G5b explicitly predicted "W06, W08 and W12 may all exceed week-04", and two of the
      three did. W12 is the heaviest: three tracks (D 9.0, B 2.5, P 1.0), architecture review #3, the M3
      retrospective with its ecosystem re-verification, the M3 checkpoint evidence, and Track F's verdict
      or explicit non-verdict. Ten security topics from an Awareness baseline plus a retrospective plus a
      checkpoint does not fit what a median week needs, and compressing to the median ceiling would cut
      the security arc's closing argument -- the failure already on record three times in this build.

    applies_to: "weeks/week-01.md .. week-12.md"
    title_pattern: "# Week N — Name"
    sections_in_order: ["## Outcome", "## Time budget", "## Topics", "## Tasks", "## Deliverables", "## Acceptance criteria", "## Stretch goal", "## Failure exercise", "## Reflection", "## Evidence", "## Weekly score"]
    section_count: 11
    requirement_refs: ["BR-108", "BR-109", "BR-110", "BR-111", "BR-112", "BR-113"]
    rules:
      - "`## Outcome` is ONE SENTENCE naming a capability possessed BY SUNDAY. Sourced from weeks[].outcome_sentence."
      - "`## Time budget` renders four rows with the brief's LITERAL labels: `- Theory:` `- Building:` `- Testing/evaluation:` `- Customer discovery:` — in that order. Canon's key for the fourth is `business`; the rendered label is `Customer discovery`. Values come from weeks[].hours and must sum to 15.0."
      - "`## Tasks` uses `### Task 1`, `### Task 2`, ... one per weeks[].tasks row, at least two. Each task states its hours, its primary track AND its `activity_class` — theory, building, testing or business. The bucket is rendered because actuals are logged per bucket and M1's mandated recalibration reads them bucket by bucket: a task line carrying only a track letter cannot tell the learner which of the four numbers their hour belongs in."
      - "A task whose `activity_class` is `theory` renders its `reading_ref` — the RES- id of the resource it reads. A theory hour naming no document is an hour the learner has to source themselves, which is the one thing resources/recommended-resources.md exists to prevent."
      - "`## Deliverables` lines carry THE PATH THE ARTIFACT LANDS AT, per templates/week-template.md: `- [ ] D-wNN-1 — <artifact, with the path it lands at>`. A deliverable with no path cannot be ticked by anyone but its author."
      - "`## Deliverables` and `## Acceptance criteria` are GitHub checkbox lists using `- [ ]`. Deliverables come from weeks[].deliverables (max 4); acceptance from weeks[].acceptance."
      - "EVERY `### Task N` must be referenced by at least one `## Acceptance criteria` line, via the task's id. This is the Tasks-to-Acceptance reference rule and it is enforced mechanically."
      - "`## Stretch goal` and `## Failure exercise` must be POPULATED in all twelve concrete week files, not merely present in the template."
      - "`## Failure exercise` renders the week's failure_exercise_ids with ALL FIVE named parts: detection, safe failure behaviour, recovery, logging, and a test proving the mitigation."
      - "`## Reflection` is a NUMBERED list with at least three entries, sourced from weeks[].reflection. Each must be answerable only by someone who did the work."
      - "`## Evidence` holds links and paths to commits, PRs, benchmarks, ADRs, demos and interview notes, sourced from weeks[].evidence. It carries the `<!-- user:actuals -->` region."
      - "`## Weekly score` is 0–100 according to EXPLICIT SCORING RULES, sourced from weeks[].score_rules, whose allocations must sum to 100."
      - "TOPIC PRIORITY, when a topic has no concept row (gap G5-02). Most topics resolve to a tracks[].concepts[] row carrying `priority`. A few do not: Gateway and Service Layer live only in tracks.B.pattern_triage.fowler with the verdict `earn it`, and `reviewing generated code` exists only as competency CM-17 and in apprenticeship_framing. They are NOT added as concept rows because the six track concept counts are brief-mandated literals (A 22, B 24, C 23, D 17, E 15, F 11) and adding rows would break them. Instead, render the canon-sourced string in the Priority column -- `earn it`, or `competency CM-17` -- and add a one-line note under the table. NEVER invent a P-tag for a topic canon does not prioritise. This also affects weeks[12], which lists `reviewing generated code`."
    word_band: [1700, 2700]
    sanity_band: [1200, 3000]

  month:
    fallback_deliverable_rule: >-
      ADDED AT G8. `fallback_deliverable` was a WEEK-ONLY field, so three call-gated month deliverables --
      D-m06-3, D-m07-2 and D-m08-2 -- had no declared substitute in the branch this programme rates as
      modal (53.9% chance of zero discovery calls). D-m07-2 was the sharpest: it asserted "now that a pilot
      artifact exists" and is itself a CP-M9 evidence id, so the checkpoint most exposed to the funnel drew
      on a deliverable that silently assumed the funnel had worked. Any month deliverable whose completion
      depends on an external party MUST carry a fallback naming what is produced instead and how it is
      tagged. Note D-m05-4 and D-m07-3 already carried inline fallbacks -- the discipline existed in months
      and had simply been skipped on three rows.

    applies_to: "months/month-01.md .. month-12.md"
    title_pattern: "# Month N — Name"
    sections_in_order: ["## Outcome", "## Deliverables", "## Funnel targets", "## Stages entered", "## Failure exercises", "## Retrospective", "## Mandated delta", "## Checkpoint"]
    section_count: 8
    requirement_refs: ["BR-032", "BR-114", "BR-129"]
    rules:
      - "`## Funnel targets` is GENERATED by gen-derived from the week-index mapping for months 01–03 and from the M2 delta for months 04+. Hand-editing it is a check-canon failure."
      - "`## Retrospective` reproduces ALL TEN questions from question_sets.monthly_retrospective verbatim, each with an answer slot, plus RQ-11's canon-delta output. All twelve months carry all ten."
      - "`## Mandated delta` states the month's required canon edit and its procedure."
      - "`## Checkpoint` is present in ALL TWELVE month files, because sections_in_order mandates it and the month schema is not `loose` -- check_sections fails a file that omits a listed section AND fails one that carries an unlisted section, so a conditional section could not satisfy both. CORRECTED AT G6 (G6-L5-01): the earlier rule said 'present only where checkpoint_refs is non-empty', which the eight non-checkpoint months could not honour. The section is therefore universal and its CONTENT is conditional. Where checkpoint_refs is non-empty (M03, M06, M09, M12) it reproduces the decision question verbatim with its evidence ids. Where it is empty, it names the checkpoint this month FEEDS, when that checkpoint lands, and which of this month's deliverables become its evidence. That is orientation rather than filler: a reader mid-programme should be able to open any month and see how far they are from the next gate and what they are accumulating toward it."
      - "Months 07–12 are DELIBERATELY THIN and say so; thinness is a design position, not an omission."
    word_band: [900, 1400]

  phase:
    applies_to: "phases/phase-01-foundations.md .. phase-05-productization.md"
    title_pattern: "# Phase N — Name"
    sections_in_order: ["## Arc", "## Entry conditions", "## Exit conditions", "## Checkpoints", "## Security arc", "## What this phase does not cover"]
    section_count: 6
    requirement_refs: ["BR-033", "BR-097"]
    rules:
      - "Phases own ARCS, ENTRY/EXIT AND CHECKPOINTS ONLY. They NEVER own topics, hours or tasks, and they never theme a period by subject — that would breach the brief's ban on sequential month-by-topic structure."
      - "phase-01 additionally PRE-ANNOUNCES the funnel watch thresholds WITH THEIR LIKELY OUTCOMES at week 1, and states that the M3 checkpoint passes on process executed rather than calls booked."
      - "phase-02 states that the brief's first-listed flagship pipeline arrives at month 04, and why."
      - "`## What this phase does not cover` homes the residual topics assigned to this phase's months."
    word_band: [950, 1650]

  track:
    per_file_band_overrides:
      "tracks/system-design.md": [1450, 4200]
      "tracks/ai-application-engineering.md": [1450, 2600]
    per_file_band_note: >-
      ADDED AT G6, on a measured forecast from lane L6 rather than after a failure. Track A needed
      2,238 words of a 2,300 ceiling for 22 concepts and 16 why_it_matters arguments, after four
      compression passes -- about 62 words per P0 argument once fixed overhead is paid. Track B carries
      24 concepts PLUS pattern_triage: seven kept patterns each owing a generated-code justification,
      sixteen cuts, the Fowler set and DDD at P2. That does not fit at 62 words per item, and the
      failure mode would be deleting exactly the argument BR-040 mandates -- the same failure already
      recorded against reference/low-roi-and-cuts.md. Track B is the brief's most heavily enumerated
      track and sits at a declared hard floor of 39.0h; its file should not be the place the hours get
      argued away. L6's own guidance stands: render the triage as a table with a justification column
      rather than prose per pattern.

    applies_to: "tracks/*.md (6 files)"
    title_pattern: "# Track X — Name"
    sections_in_order: ["## What these hours buy", "## Entry competency", "## Concepts", "## Priorities and what is deferred", "## How this track is proved"]
    section_count: 5
    requirement_refs: ["BR-034", "BR-035", "BR-036", "BR-040", "BR-041", "BR-043", "BR-045", "BR-052"]
    rules:
      - "ARTIFACT-FIRST, mandatory: the file OPENS with what the hours buy, and only then lists concepts. For a senior developer the concepts are largely known and the artifacts are the portfolio evidence they lack, so artifact-first is both the stronger justification for the hours and the better defense against the giant-technology-list anti-goal."
      - "`## Concepts` covers EVERY concept row for that track — 22/24/23/17/15/11 — each with its priority, home and surface."
      - "Every P0 concept carries at least one reasoning paragraph on WHY IT MATTERS IN THE AGE OF GENERATED CODE, expanded from concepts[].why_it_matters. This is the only place the brief ties its content to the AI-native thesis and it is per-concept, not per-track."
      - "tracks/system-design.md additionally renders pattern_triage with a per-PATTERN generated-code justification for every kept pattern — the same obligation, applied at pattern granularity."
      - "tracks/consulting.md renders the zero-pipeline assertion and its six checkable conditions."
      - "tracks/micro-saas.md renders the thin-by-decision statement, the six-link process chain and the non-verdict rule, and inherits the seven-part exercise shape."
    word_band: [1450, 2300]

  project:
    per_file_band_overrides:
      "projects/engineering-agent-platform.md": [1500, 2600]
    per_file_band_note: >-
      ADDED AT G6 (gap G6L7-05). The platform file carries 13 stages x 6 mandated fields, 4 verbatim
      pipelines, the 20-capability map and 5 constraint blocks -- a floor near 1,150 words before a
      word of connective prose. The other two project files carry 3 stages each and sit far lower, so
      a single band across the three is the wrong shape for the same reason it was wrong across the
      reference and exercise files.
    applies_to: "projects/*.md (3 files)"
    title_pattern: "# Project name"
    sections_in_order: ["## What it is", "## Pipeline", "## Stages", "## Capabilities gained", "## Runnable demos", "## Constraints"]
    section_count: 6
    requirement_refs: ["BR-054", "BR-055", "BR-056", "BR-057", "BR-058", "BR-061", "BR-063", "BR-065"]
    rules:
      - "THE ONLY HOME for stage definitions and runnable-demo criteria."
      - "Every stage states entry, exit, a RUNNABLE DEMO COMMAND, capabilities added, a cost ceiling and a quota ceiling. EVERY STAGE MUST BE RUNNABLE — a stage with no demo command has not shipped."
      - "`## Pipeline` reproduces the canon stage list verbatim and in order."
      - "engineering-agent-platform.md renders the S0 architectural constraint and all FOUR flagship workflows, including the multi-axis review that has no diagram in the brief."
    word_band: [1250, 2050]

  exercise:
    applies_to: "exercises/*.md (4 files)"
    title_pattern: "# Exercise set name"
    sections_in_order: ["## How to use these", "## Exercises"]
    per_exercise_sections_in_order: ["## Objective", "## Task", "## Constraints", "## Deliverable", "## Acceptance criteria", "## Metrics", "## Reflection questions"]
    per_exercise_section_count: 7
    requirement_refs: ["BR-067", "BR-071", "BR-074", "BR-075", "BR-078", "BR-079", "BR-081", "BR-082"]
    rules:
      - "EVERY exercise body carries all SEVEN parts in order. This shape applies identically to business exercises — see exercise_shape_rule."
      - "`## Deliverable` names a concrete artifact whose TYPE is drawn from exercise_deliverable_types (10)."
      - "`## Metrics` draws from exercise_metric_types (14) where meaningful, and states a denominator for every rate."
      - "`## Reflection questions` forces architectural reasoning in the shape of question_sets.exercise_reflection_examples."
      - "agent-failures.md renders all 14 failure exercises with ALL FIVE named parts each — 70 cells — plus the extended set used by months."
      - "architecture-reviews.md is the only home for the 14 defect classes and the 2 supplied deliberately bad systems, and must supply the bad systems' actual source, not a description of them."
    exercise_body_word_band: [150, 600]
    exercise_body_word_band_note: >-
      CORRECTED AT G5b. The prior floor of 300 words per body made agent-families.md arithmetically
      impossible: rules[4] requires 14 failure exercises with all five parts PLUS the 5 extended rows
      = 19 bodies, each also carrying the 7-part shape, which is a 5,700-word floor under a 2,600
      ceiling. Measured reality from the three five-part bodies written so far: 178 words for the five
      parts alone. 150 is a real floor that still excludes a stub; 600 leaves room for a genuinely
      complex exercise.
    word_band: [1700, 2700]
    per_file_band_overrides:
      "exercises/agent-failures.md": [3200, 7400]
      "exercises/architecture-reviews.md": [2200, 5200]
    double_homed_bodies:
      note: >-
        RATIFIED AT G6 (gap G6L7-10). file_manifest double-homes four bodies: EXT-01 and EXT-02 between
        distributed-systems.md and agent-failures.md, and EX-FAIL-13 and EX-FAIL-14 between ai-security.md
        and agent-failures.md. Lane L7 split them by FRAMING rather than by cutting either home -- the
        topic file renders the build-and-measure treatment, agent-failures.md renders the five-part
        defensive treatment -- with fully disjoint prose. L7 correctly flagged that the split was its
        invention rather than canon's and asked for ratification instead of letting a write-order accident
        become the rule. It is ratified: the two treatments answer different questions about the same
        failure, and a reader arriving from either direction gets the one they came for.
      rule: "EXT-01, EXT-02: build-and-measure in the topic file; five-part defensive in agent-failures.md. EX-FAIL-13, EX-FAIL-14: attack construction in ai-security.md; five-part defensive in agent-failures.md."
    per_file_band_note: >-
      A uniform band across the four exercise files is the wrong shape, for the same reason it was
      wrong across the five reference files. agent-failures.md carries 19 exercise bodies (14 canonical
      + 5 extended), each with five named parts inside the seven-part shape. architecture-reviews.md
      carries the 14 defect classes and must supply the two deliberately bad systems' ACTUAL SOURCE,
      not a description of them. distributed-systems.md and ai-security.md sit on the schema-wide band.
      These overrides are only honoured because check-schema.py was patched at G5b to read
      per_file_band_overrides at all — before that patch the identical field added for reference/ at
      G4 was read by nothing.

  business:
    per_file_band_overrides:
      "business/outreach.md": [1100, 2100]
    per_file_band_note: >-
      ADDED AT G6. outreach.md owns the whole funnel branch -- two threshold CLASSES with six rows,
      their trip probabilities, the partial-substitution rule, the evidence_source marking and the
      follow-up cadence -- against four sibling files that each own one instrument. It exceeded the
      schema-wide ceiling on its first draft. The band exists to stop padding, not to force the
      deletion of the one mechanism that decides whether the user is on track or should switch to
      simulated evidence.
    applies_to: "business/*.md (5 files)"
    title_pattern: "# Business artifact name"
    sections_in_order: ["## Purpose", "## The instrument", "## Exercises", "## Targets and thresholds", "## Evidence discipline"]
    section_count: 5
    requirement_refs: ["BR-046", "BR-048", "BR-049", "BR-087", "BR-088", "BR-089", "BR-090", "BR-092", "BR-093", "BR-150"]
    rules:
      - "THE ONLY HOME for scripts, checklists, the scorecard, kill criteria and the outreach branch."
      - "`## Exercises` uses the FULL SEVEN-PART SHAPE, identically to engineering exercises. This is stated at schema level because it is the single most commonly dropped requirement: business content drifts into narrative playbook."
      - "`## Evidence discipline` states the `evidence_source: real | simulated` rule and the prohibition on inventing evidence."
      - "Placeholder identities THROUGHOUT. No client name, no prospect PII. Real data lives in gitignored *.local.md."
      - "customer-discovery.md reproduces the brief's seven illustrative monthly targets ALONGSIDE this programme's derived ones, with the gap and its reason stated."
    word_band: [1100, 1750]

  template:
    applies_to: "templates/*.md (7 files) and HOW-TO-EDIT.md"
    title_pattern: "# Template name"
    sections_in_order: ["## When to use this", "## Template"]
    section_count: 2
    requirement_refs: ["BR-097", "BR-108", "BR-112"]
    rules:
      - "THE ONLY HOME for blank templates. A template is BLANK: it contains the structure and the placeholder, never a worked example, or check-dupes will flag it against the file it exemplifies."
      - "week-template.md reproduces the 11 mandated week sections in order with the four literal time-budget labels and the `<!-- user:actuals -->` region placeholder."
      - "HOW-TO-EDIT.md is the exception to the two-section rule: it documents the retrospective control loop and carries its own sections."
    word_band: [300, 650]

  reference:
    applies_to: "reference/*.md (5 files)"
    per_file_band_overrides:
      "reference/low-roi-and-cuts.md": [700, 2100]
    override_note: >-
      ADDED AT G4. One band across five reference files is the wrong shape. This file alone owns the
      6 brief challenges, 17 additional low-ROI verdicts, 12 cut_list rows, 22 glossary terms and 4
      framing sections; the other four sit at 900-1228 with room to spare. G4 landed it at 1494 against
      a 1500 ceiling only after four compression passes that materially shortened CANON'S OWN REASONING
      -- LR-01's GoF argument and LR-05's Kubernetes argument were the worst hit. A word ceiling exists
      to prevent padding, not to force the deletion of argument the brief specifically asked for. G5b
      re-derives all bands; this override tells it the shape, not just the number.
    title_pattern: "# Reference name"
    sections_in_order: ["## What this is", "## The table", "## How to read it", "## How it changes"]
    section_count: 4
    requirement_refs: ["BR-083", "BR-095", "BR-096", "BR-120", "BR-121", "BR-123", "BR-124", "BR-125", "BR-126", "BR-127", "BR-128", "BR-129"]
    rules:
      - "THE ONLY HOME for the portfolio, the maturity model, the competency matrix, the difficulty ladder, the low-ROI verdicts, the cut list and the glossary."
      - "`## How it changes` names which retrospective may edit this table, so no reference file reads as immutable."
      - "difficulty-ladder.md additionally carries the NINE CLOSING DESIGN QUESTIONS under their own heading with each question's `answerable_from` evidence ids. They are a different list from the nine ladder stages and must not be conflated."
      - "competency-matrix.md renders the brief's literal five level names, including its slash form for level five, alongside canon's enum value."
      - "portfolio.md carries a CREDIBILITY statement per item answering what makes it credible to a senior engineer or potential client, and the four checkpoints with their evidence ids."
    word_band: [800, 1700]

  resources:
    per_file_band_overrides:
      "resources/recommended-resources.md": [1150, 2300]
      "resources/ecosystem-snapshot-2026-08.md": [1150, 2300]
    per_file_band_note: >-
      ADDED AT G6 (gaps G6L8-01, G6L8-02), in the shape rule 30 asks for rather than after a failure.
      per_resource_fields costs 23 words of label x 15 resources = 345 words of PURE SCAFFOLDING, 19% of
      the prior ceiling before a word of content; the file landed at 1849/1850 only after four passes
      that shortened canon's own which_sections guidance -- the exact failure already on record three
      times. The snapshot carries EIGHT mandated fields per entry, because check_resources keys on
      schema name and cannot tell the two files apart, and landed at 1847/1850.

    applies_to: "resources/*.md (2 files)"
    title_pattern: "# Resource set name"
    sections_in_order: ["## How to use this list", "## Resources", "## Deliberately excluded"]
    section_count: 3
    per_resource_fields: ["What exactly to learn from it", "Which chapters or sections matter", "Which roadmap project uses the knowledge", "What exercise proves I understood it"]
    requirement_refs: ["BR-118", "BR-119", "BR-024"]
    rules:
      - "recommended-resources.md renders `resources.rows[].locator` as a `Where to find it` line on every entry, and `locator_note` beside it where the locator is a search rather than a permalink. A reading list whose entries carry no address is a list of titles, and every theory task in the twelve weeks now cites one of these ids."
      - "EVERY resource carries all FOUR mandated fields. A resource missing one is a schema failure, not a thin entry. Without this schema those four fields go unenforced and coverage-report returns zero unmapped rows BY CONSTRUCTION — the hole this schema exists to close."
      - "`## Deliberately excluded` names what was left out and why. Naming an exclusion is a stronger curation signal than a short list."
      - "ecosystem-snapshot-2026-08.md carries EVERY volatile claim with a title, a date, a verbatim supporting span and a RE-VERIFY DATE, and is the only file permitted to state a dated ecosystem fact."
    word_band: [1150, 1850]

  SETUP:
    applies_to: "SETUP.md"
    title_pattern: "# Setup — what must exist before week 01"
    sections_in_order:
      - "## What this file is"
      - "## Prerequisites"
      - "## Create the working directories"
      - "## Secrets and the public-capable rule"
      - "## Verify the repository"
      - "## What week 01 builds and this file does not"
    section_count: 6
    requirement_refs: []
    rules:
      - >-
        ADDED AT G8, after the build was already green. It closes the one question the repository
        could not answer: every week file names artifacts under `agentplat/`, `tests/`, `evals/`,
        `docs/` and `policy/`, none of those directories ships, and NO TASK PAYS FOR CREATING THE
        LAYER UNDERNEATH THEM -- interpreter, harness binaries, credential boundary. The weeks were
        precise about what to build and silent about what must exist first. This file is that floor.
      - >-
        IT MUST NOT DO WEEK-01'S WORK. The runner (T-w01-3), the versioned permission policy
        (T-w01-4), the harness adapter (T-w01-8) and its contract tests (T-w01-9) are worth 6.75h
        between them. This file creates EMPTY directories and a package marker, names the task that
        owns each artifact it stops short of, and leaves `policy/` empty on purpose. A setup file
        shipping the policy shape would spend T-w01-4 before the learner reached it.
      - >-
        It is NOT a deliverable: no id, no acceptance criterion, no hours, and it is absent from every
        week's hour arithmetic by construction. Grading the floor would make setup evidence, and the
        philosophy holds that only observable artifacts count. A precondition is not a deliverable.
      - Dependency installs defer to the week that justifies them, stated explicitly, because a stack assembled ahead of the decision behind it is the failure `low_roi` exists to prevent.
    word_band: [550, 900]

  README:
    applies_to: "README.md"
    title_pattern: "# Repository name"
    sections_in_order: ["## Objective", "## Target professional profile", "## Philosophy", "## How to use this repository", "## Time commitment", "## Tracks", "## Flagship projects", "## Progression model", "## Definition of DONE", "## Weekly review process", "## Adapting from 15h to 8h or 25h"]
    section_count: 11
    requirement_refs: ["BR-100", "BR-098", "BR-099"]
    rules:
      - "All ELEVEN sections, in this order. `## Target professional profile` and `## Philosophy` expand from the framing block."
      - "`## Flagship projects` names the flagship FIRST and explicitly, then the two secondary projects — resolving the singular/plural difference between the brief's own two statements."
      - "Links templates/, months/ and reference/ DIRECTLY, so no file is orphaned beyond two hops."
      - "`## Adapting from 15h to 8h or 25h` states the rule that hours change depth and calendar, never the P0 deliverable set — and that a missed week SLIPS THE CALENDAR rather than doubling up."
    word_band: [1350, 2200]
    per_file_band_overrides:
      "README.md": [1350, 2240]
    per_file_band_note: >-
      ADDED AT G8 with SETUP.md. README measured 2,200 against a 2,200 ceiling -- exactly at the
      limit, with no headroom for the one navigation line the new file needs. The alternative was to
      cut existing prose to pay for a pointer, which trades argued content for a link and is the
      degradation this band exists to prevent, not an instance of it. Two sentences were tightened
      anyway; the remaining rise is the step-0 line plus its address. The ceiling still binds at
      2,240 against a measured 2,215, and it is raised by exactly what earned it.

  ROADMAP:
    applies_to: "ROADMAP.md"
    title_pattern: "# Roadmap"
    sections_in_order: ["## Overview table", "## How to read this"]
    section_count: 2
    table_columns_in_order: ["Month", "Major concepts", "Projects", "Business activity", "Measurable outcomes"]
    column_count: 5
    requirement_refs: ["BR-101"]
    rules:
      - "GENERATED by gen-derived from months[]. A COMPACT TABLE is preferred, one row per month, twelve rows."
      - "`Major concepts` sources from months[].major_concepts; `Projects` from stages_entered; `Business activity` from funnel_targets; `Measurable outcomes` from deliverables."
      - "Regenerating must be a no-op diff over generated regions."
    word_band: [550, 900]

  SCOREBOARD:
    applies_to: "SCOREBOARD.md"
    title_pattern: "# Scoreboard"
    sections_in_order: ["## How to update this", "## Engineering", "## Agent harness", "## Business", "## Orphaned entries"]
    section_count: 5
    requirement_refs: ["BR-102", "BR-103", "BR-104", "BR-105", "BR-106"]
    rules:
      - "Three groups with 7 / 7 / 8 metrics = 22. Group names verbatim: Engineering, Agent harness, Business."
      - "EASY TO UPDATE WEEKLY: each metric is one row with a `<!-- user:actuals -->` region keyed by its stable metric id. Weekly logging must NEVER require touching YAML."
      - "gen-derived writes OUTSIDE those regions only and preserves their contents BYTE-FOR-BYTE, reattaching by key. `## Orphaned entries` receives regions whose key no longer exists — they are never dropped and never silently misaligned."
      - "Business rows carry `evidence_source: real | simulated`. Paid pilots and revenue are NEVER simulated."
      - "`## How to update this` renders scoreboard_metrics.weekly_row_format as a fenced block plus its render_note, so a criterion saying `the week's funnel row` points at a shape that exists."
    word_band: [700, 1150]
    word_band_note: >-
      CEILING RAISED 1100 -> 1150 with weekly_row_format. Four acceptance criteria across W01 and
      W04 say "the week's funnel row" and the format existed nowhere, so the criteria could not
      evaluate. The rendered format costs about 50 words of pure specification against a file that
      was already at 1,065 after generation. The fenced block itself is free — check-schema does
      not count fenced lines — and the ceiling still binds at 1,150 against a measured 1,104.

# ---------------------------------------------------------------------------
# FILE MANIFEST — 79 files, itemised. G2 diffs against this; it is authoritative.
# Two reviewers counted 76 against the plan's original 77, so the itemisation is published
# rather than the number asserted.
