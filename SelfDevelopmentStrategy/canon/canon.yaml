      - "Rerank latency figures p50 and p95"
      - "Path to the injection corpus and the attack-success-rate report"
      - "Path to the commit-matcher script and the 12 labelled issues"
      - "Path to the misleading-comments failure report"
      - "The scored opportunity with per-dimension evidence"
    funnel_targets: {prospects_researched: 22, sends: 9, follow_ups: 12, calls: 0, workflows_documented: 0, opportunities_scored: 1}
    fallback_deliverable: "ADDED AT G8 (T8). W06 was the only week from W05 on carrying a business deliverable with a null fallback, and its zero-call path hid inside AC-w06-4a's `or observable signal` escape on OS-8 -- the dimension canon itself calls the most tempting and most fatal to score wishfully. The send counts are unilateral and need no fallback: nobody has to reply for prospects to be researched, emails sent or follow-ups logged. What is call-gated is OS-8. With no conversation held by W06, an OBSERVABLE SIGNAL means exactly one of four things, each recorded with a link or a local file path: a published price for a competing solution; a public job posting for the role this work would displace; a paid tool already in the prospect's stack doing part of the job; or a written reply that names a budget. It does NOT mean a reply expressing interest, a booked-but-unheld call, a social reaction, inbound curiosity, or the learner's own estimate of what the work is worth. If none of the four exists, OS-8 IS SCORED NULL and the scorecard ships with its other dimensions scored and this one explicitly unscored. That is a PASSING deliverable. A scorecard that returns `no evidence for willingness to pay` is the outcome saas_validation kill criterion 1 depends on being able to observe."
    recovery: "8h subset, 8.0h: T-w06-3 (2.0), T-w06-4 (1.5), T-w06-6 (1.0), T-w06-7 (1.0 reduced to 0.8), T-w06-10 (1.15), T-w06-12 (0.45), T-w06-13 (1.1). Business holds at 2.7h, the cheapest combination of this week's four business tasks that clears the 2.5h floor. UNTICKED and carried to W07: D-w06-1 (the sweep and the chunking read are deferred, so the metrics are per single configuration), D-w06-2 (the attack suite runs at reduced depth and the category-distinction read goes with T-w06-5), D-w06-3 (the Sentry corpus entirely), D-w06-4 (22 prospects and 9 sends are logged; the follow-up batch is not). DONE-COMPRESSED, not DONE. Defer the chunking sweep to W07 and the Sentry corpus entirely to W07, where the remaining 8 labels already live. CLARIFIED AT G6 (G6L2-01): deferring the sweep removes the configurations T-w06-4 recomputes ACROSS, so in the compressed week T-w06-4 recomputes NDCG@5, MRR and precision@5 against the single existing configuration and logs rerank latency, and AC-w06-1a's per-configuration clause defers to W07 with the sweep that produces them. Stated because the subset otherwise keeps a task whose prerequisite it drops, making an acceptance criterion unreachable in exactly the week the learner is already under pressure. Note W07 is full at 15.0h and absorbs the Sentry half of this deferral via T-w07-6 but not the chunking half -- if the sweep slips, it slips into the calendar, which is what meta.calendar_model exists to absorb."
    cost_ceiling_eur: 0.0
    cost_note: "Retrieval metrics are deterministic and free. The injection runs consume quota, not euros."
    quota_ceiling: "<= 60 agent runs (3 techniques x 5 payload variants x 4 queries, plus control)"
    score_rules: {metrics_per_config: 25, reranker_lift_measured: 15, attack_suite_run: 25, sentry_corpus_12: 15, opportunity_scored: 10, failure_report_complete: 10}
    depends_on: ["W05"]

