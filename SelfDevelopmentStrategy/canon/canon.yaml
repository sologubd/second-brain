nger needs, add rows the M1 and M4 recalibrations created, and re-tag by track so the Track B rows stay visible. Bump meta.version, make regen, make check. ADDED AT G6 (gap G6-L5-05): M01-M06 each carried a procedure and M07-M12 carried only a type, so six month files had to describe an absence instead of a loop.", procedure: "Read the Stage-2 pilot's measured before/after baseline and the reply data behind it. Rewrite consulting_stages exit criteria that the pilot proved wrong, and re-price the offer against hours actually spent rather than hours quoted. Bump meta.version, make regen, make check. ADDED AT G6 (gap G6-L5-05): M01-M06 each carried a procedure and M07-M12 carried only a type, so six month files had to describe an absence instead of a loop.", procedure: "Re-cost months 05–12 against three months of logged actuals; Track E scoping, pricing and the subcontracting side-quest are homed in months 04–07 and must be given real hours or explicitly deferred."}
