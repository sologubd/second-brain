    acceptance:
      - {id: "AC-w06-1a", text: "A metrics table exists with one row per chunking configuration and one column per metric; the same labelled queries were used for every row with no re-labelling", refs: ["T-w06-2", "T-w06-4", "T-w06-1"]}
      - {id: "AC-w06-1b", text: "At least one CONCRETE example is named where a chunk boundary caused a relevant answer to be missed or truncated", refs: ["T-w06-2", "T-w06-4"]}
      - {id: "AC-w06-1c", text: "The reranking write-up states whether reranking reordered an already-correct top-5 or pulled in a relevant document from outside it, and explains why it can never do the latter", refs: ["T-w06-3", "T-w06-4"]}
      - {id: "AC-w06-2a", text: "At least three distinct injection techniques were attempted; the report documents both successes AND failures", refs: ["T-w06-6", "T-w06-7"]}
      - {id: "AC-w06-2b", text: "Attack success rate is reported as a measurement against the learner's OWN system with a stated denominator. No industry effectiveness percentage appears anywhere in the report", refs: ["T-w06-7"]}
      - {id: "AC-w06-2c", text: "The report names the architectural change that eliminates the class, and distinguishes it from a prompt-level patch", refs: ["T-w06-5", "T-w06-7"]}
      - {id: "AC-w06-3a", text: "12 issues are labelled with issue id, fixing commit sha and a difficulty note; the commit-matcher's accuracy on those 12 is stated as a number", refs: ["T-w06-8", "T-w06-9"]}
      - {id: "AC-w06-3b", text: "The misleading-comments report contains all five named sections and its proving test fails against the pre-mitigation code", refs: ["T-w06-9"]}
