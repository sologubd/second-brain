  "05":
    id: "W05"
    name: "Retrieval from zero, with authorization in the index"
    outcome_sentence: "By Sunday the Secure Knowledge Agent answers from a hybrid index that filters by permission BEFORE ranking, and I have an automated test proving the naive alternative silently drops results the user was entitled to see."
    entry_warning: "HIGHEST-RISK WEEK IN THE PROGRAM. The learner is at Awareness on retrieval — never shipped BM25, vector or hybrid search, never measured retrieval quality. 9.0h of Track C from zero in a week that also carries 3.0h of Track A. This is a rule-selected budget audit week and the auditor receives the bottom-up estimate below as a cross-check."
    budget_audit_crosscheck:
      bottom_up_total: 8.0
      allocation: 9.0
      slack: 1.0
      rows:
        - {item: "BM25 baseline with bm25s: index a real doc set, first queries", hours: 1.5, note: "Setup friction and tokenization defaults are routinely underestimated."}
        - {item: "Local embedding model: download, laptop smoke test, embed corpus, first semantic query", hours: 2.0}
        - {item: "pgvector: extension, table, HNSW index", hours: 0.5, note: "SEE pgvector_scope_decision — this is 0.5h and not 2.5h because Postgres has been running since W02."}
        - {item: "Hybrid fusion: hand-implement RRF, k fixed at 60", hours: 1.5}
        - {item: "Permission-filtered index: permission metadata schema, pre-filter query, and a test proving post-filter would have silently dropped a result", hours: 2.5, note: "Conceptually the hardest part and the one place a shortcut is tempting and wrong."}
    pgvector_scope_decision:
      question: "Is Postgres + pgvector setup inside W05's 9.0h? (R3 flagged this as the single largest unknown in its feasibility estimate and required an explicit G1 decision.)"
      decision: "YES, IN SCOPE — and nothing is cut, because the cost R3 feared has already been paid."
      reasoning: >-
        R3 estimated 2.5h for the embedding item and named FIRST-TIME POSTGRES + PGVECTOR SETUP as
        the largest single unknown inside it, capable of consuming that budget alone. That unknown
        is retired by a dependency R3 could not see: Postgres has been running since W02, where
        Track B stands it up as the task state store, and it is extended in W08 into the queue,
        the lock and the outbox. R7 makes this explicit — Postgres is the highest-leverage single
        technology in the program precisely because one deep technology serves six roles. So W05
        adds an EXTENSION, a TABLE and an INDEX to a running instance: 0.5h, not 2.5h. The revised
        bottom-up total is 8.0h against 9.0h, giving 1.0h of genuine slack in the week R3 called
        the tightest.
      residual_risk: "If W02 slips and Postgres is not running, this premise breaks and W05 reverts to R3's 8.0h-with-zero-slack read plus a first-time database setup. W05 therefore declares depends_on: [W02] explicitly, and the budget auditor is instructed to check that dependency FIRST."
      cut_order_if_it_overruns_anyway:
        - "1. Hard-code RRF's k=60 rather than hand-tuning it — tuning is naturally a W06 metrics-driven refinement, not a W05 activity."
        - "2. Do not stand up a second store for comparison. None is planned; resist any scope creep toward trying it two ways."
        - "3. Move the prove-post-filter-drops-a-result test into W06 alongside the metrics work, since it is itself a measurement task."
        - "NEVER CUT THE PERMISSION-FILTER PRE-FILTER BUILD. It is the week's one irreplaceable deliverable, the multi-tenancy and authorization surface for Track B's rehomed content, and the Secure Knowledge Agent's entire security story."
    topics: ["BM25", "embeddings", "semantic search", "vector retrieval", "hybrid retrieval", "metadata filtering", "multi-tenancy", "tenant isolation", "outreach", "discovery calls"]
    stage: "SKA-S0"
    subsystems_introduced: ["SKA-S0 — permission-filtered hybrid retrieval layer"]
    cap_exception_reason: ""
    maturity_level_target: "L3"
    failure_exercise_ids: ["EX-FAIL-07"]
    arch_review_id: null
    hours: {theory: 3.5, building: 6.0, testing: 2.5, business: 3.0}
    tasks:
      - {id: "T-w05-1", title: "Lexical versus semantic matching: why BM25 survives the arrival of vectors, and the exact query classes on which embeddings fail silently — error codes, SKUs, names, acronyms, negation", primary_track: "C", reinforces: [], activity_class: "theory", hours: 1.0, deliverable_ids: ["D-w05-1"], reading_ref: "RES-07"}
      - {id: "T-w05-2", title: "Pre-filter versus post-filter authorization: why post-filtering is simultaneously a correctness bug and a disclosure vulnerability, and what observable — count, latency, error — leaks the existence of a document the user cannot see", primary_track: "C", reinforces: ["D"], activity_class: "theory", hours: 1.0, deliverable_ids: ["D-w05-2"], reading_ref: "RES-06"}
      - {id: "T-w05-3", title: "Reciprocal Rank Fusion: why rank fusion needs no score normalisation, and what an off-by-one in rank indexing or a corpus-independent k would do", primary_track: "C", reinforces: [], activity_class: "theory", hours: 0.5, deliverable_ids: ["D-w05-1"], reading_ref: "RES-07"}
      - {id: "T-w05-4", title: "Build the BM25 baseline over a real ~30–40 document corpus with bm25s, and hand-label 15–20 (query, relevant-doc-id) pairs BEFORE any tuning", primary_track: "C", reinforces: [], activity_class: "building", hours: 1.5, deliverable_ids: ["D-w05-1"]}
      - {id: "T-w05-5", title: "Smoke-test Qwen3-Embedding-0.6B on the actual laptop, embed the corpus, then add the pgvector extension, table and HNSW index to the Postgres instance running since W02", primary_track: "C", reinforces: [], activity_class: "building", hours: 1.5, deliverable_ids: ["D-w05-1"]}
      - {id: "T-w05-6", title: "Hand-implement RRF in about twenty lines with k fixed at 60, and run the three-way bake-off: BM25-only, embedding-only, hybrid", primary_track: "C", reinforces: [], activity_class: "building", hours: 1.5, deliverable_ids: ["D-w05-1"]}
      - {id: "T-w05-7", title: "Build the permission pre-filter and prove the leak: construct a two-tenant index and a query whose raw top-k contains more of tenant B's documents than tenant A's, so post-filter provably returns fewer than k authorized results", primary_track: "C", reinforces: ["D"], activity_class: "testing", hours: 2.0, deliverable_ids: ["D-w05-2"]}
      - {id: "T-w05-8", title: "Stale retrieved context as an agent failure mode: how an out-of-date document misleads an agent that has no way to know it is stale", primary_track: "A", reinforces: ["C"], activity_class: "theory", hours: 1.0, deliverable_ids: ["D-w05-4"], reading_ref: "RES-03"}
