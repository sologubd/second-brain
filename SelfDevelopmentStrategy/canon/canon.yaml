# ---------------------------------------------------------------------------
# COST AND QUOTA
# THE BINDING CONSTRAINT IS QUOTA, NOT EUR. This inversion is recorded explicitly
# because it reverses the plan's framing and drives eval_set_size_formula.
# ---------------------------------------------------------------------------

cost_budget:
  annual_cap_eur: 200.0
  monthly_cap_eur: 12.0
  monthly_cap_scope: "Months 01–03, judge-only spend. Residual ~164 EUR for months 04–12, where the cross-harness comparison and S9 live."
  binding_constraint: "QUOTA"
  binding_constraint_statement: >-
    THE BINDING CONSTRAINT ON EVALUATION SIZE IS QUOTA, NOT EUROS, AND THIS INVERTS THE PLAN'S
    FRAMING. Judge inference costs $0.0004–$0.0075 per item across cheap-tier judges, so the full
    80-item load — 20 queries x 3 configs, plus 20 agent tasks — is $0.08–$0.60 PER PASS against a
    EUR 12 monthly cap. That is 20 to 140 full re-runs per month. Judge cost is nearly free and
    CANNOT be what sizes an eval set. What is scarce is AGENT RE-EXECUTION: agent_regression at 20
    tasks x N=5 reruns is 100 agent executions per gate pass, each consuming subscription quota
    that money cannot immediately buy back. eval_set_size_formula is therefore driven by
    quota_model. Sizing eval sets to fit a euro budget would shrink them for no reason and destroy
    their statistical usefulness.
  judge_model_policy:
    recommended: "A cheap-tier 'mini' judge with a long expected runway. Avoid a tier already inside a published deprecation cycle."
    cost_per_item_range_usd: [0.0004, 0.0075]
    token_estimate: "1,500–3,000 input tokens for a retrieval-answer judgement; 3,000–8,000 for a full agent-trace judgement; roughly 150–350 output tokens either way."
    fallback_required: "Pin one judge with a DOCUMENTED FALLBACK. Provider pricing and availability will shift mid-programme; one cheap tier already has a published retirement date inside the programme's horizon."
    reliability_caveat: "Do not use a judge as the sole check where a deterministic ground truth exists. Reproducibility is not validity."
    volatile: true
  embedding_policy: "local, EUR 0"
  per_task_execution_lane: "Subscription CLI subprocess (the literal binary, non-bare print mode). Metered API is the FALLBACK LANE ONLY, kept live behind the same adapter interface so it is exercised by construction whenever quota runs out."
  quota_model:
    plan_tier: "Pro-tier subscription plus a second-harness subscription"
    weekly_session_ceiling: "MEASURED_FROM_WEEK_01"
    weekly_agent_runs_max: "MEASURED_FROM_WEEK_01"
    five_hour_window_prompts: "MEASURED_FROM_WEEK_01"
    measured_from: "week_01"
    measurement_rule: >-
      ALL QUOTA FIGURES ARE `measured_from: week_01`, NEVER CONSTANTS. Published figures are
      partly temporary and partly unpublished: one vendor's weekly-limit boost ran with an
      announced expiry inside this programme's first month, the other's five-hour cap was
      temporarily lifted with no announced end date and its weekly cap is not published at all.
      It is also UNDOCUMENTED whether one agent turn — a tool call plus a model round-trip inside
      an autonomous loop — consumes quota the same way one human-typed prompt does. That is a
      genuine unknown, not an invented number, and W01's 0.25h task exists to answer it.
    shared_bucket_warning: "The quota bucket is SHARED across the coding CLI, the chat interface and other surfaces on the same account. Any interactive human use eats into the automation budget, so the W01 measurement must be taken with other interactive use isolated or it measures the wrong thing."
    ordinary_use_caveat: "Advertised limits are stated to assume 'ordinary, individual usage'. Do not schedule so many concurrent unattended runs that the account's behaviour stops resembling one human developer's session pattern — both to stay under quota and to stay inside that undefined term."
    shortfall_rule: "A W01 measurement below 2x the planned weekly run count AUTHORISES AN IMMEDIATE OUT-OF-CYCLE CANON DELTA rather than waiting three weeks for M1, whose mandated slot is taken by the hour recalibration."
    volatile: true
  eval_set_size_formula:
    driven_by: "quota_model"
    not_driven_by: "monthly_cap_eur"
    formula: "max_tasks = floor(weekly_agent_runs_max / (N_reruns * gate_passes_per_week))"
    derivation_worked:
      - "Target: 1 agent_regression gate pass per week at N=5 reruns (R4's floor is N>=3; 5 gives a usable pass-rate distribution)."
      - "max_tasks = floor(weekly_agent_runs_max / (5 * 1)). For the planned 20-task suite this requires weekly_agent_runs_max >= 100."
      - "W01 measures weekly_agent_runs_max. If it returns >= 100, the planned sizes stand."
      - "If it returns 60–99: reduce N from 5 to 3 (requires >= 60). Widen the pass-rate bound and STATE the widening."
      - "If it returns 36–59: reduce the suite from 20 tasks to 12 at N=3 (requires >= 36). Draw the difference from cut_list CUT-08."
      - "If it returns < 36: take the metered fallback for the gate. 100 metered agent executions is roughly EUR 15–60, comfortably inside the ~164 EUR residual."
    retrieval_sweep_sizing:
      size: "20 queries x 3 configurations = 60 evaluated items"
      driver: "NEITHER quota NOR euros. Retrieval metrics (NDCG, MRR, precision@k) are DETERMINISTIC — computed from a labelled set with no model call. The binding constraint is HUMAN LABELLING TIME: 15–20 query/document pairs at roughly 3 minutes each is about 1.0h, which fits inside W05's build tasks and W06's 1.5h of Track C testing."
      conclusion: "The plan's provisional sizes stand, but they now stand on a DERIVATION rather than an assertion. The formula was run; this is its output."
    judge_cost_check: "80 judged items per pass x $0.0004–$0.0075 = $0.03–$0.60. Against EUR 12/month that is 20–400 passes. NOT BINDING. Confirms the inversion."
  metered_fallback:
    trigger: "Quota exhaustion, or a W01 headroom measurement below the thresholds in eval_set_size_formula, or a compliance signal on the subscription lane."
    cross_harness_comparison_eur: [6, 25]
    cross_harness_basis: "A 40-run comparison at metered cheap-to-mid-tier pricing. A moderate agentic task-run plausibly spans 50k–200k total tokens counting context reads, giving roughly $0.15–$0.60 per run at the mid tier and $0.05–$0.20 at the cheap tier. THIS IS AN ORDER-OF-MAGNITUDE ESTIMATE, NOT A MEASURED FIGURE, and W01 calibrates it against real runs."
    agent_regression_pass_eur: [15, 60]
    agent_regression_basis: "100 executions (20 tasks x N=5) at the same per-run range."
    good_news_note: "THE METERED FALLBACK IS CHEAP AND THIS IS GOOD NEWS. An earlier estimate feared $120–360 per quarter and was wrong. Against a EUR 200 TWELVE-MONTH budget, the fallback is affordable and THE EVAL WORK IS FUNDED EITHER WAY. The consequence for the plan is that quota exhaustion degrades the programme's cadence, not its scope."
    degraded_sizes: "Cross-harness comparison drops to 10 tasks x 2 harnesses; the retrieval sweep drops to 12 queries x 2 configurations. The difference is drawn from cut_list CUT-09."
  run_metadata_required: ["harness_name", "harness_version", "pinned_model_id", "convention_version", "started_at", "ended_at", "tokens_in", "tokens_out", "quota_stall_seconds", "exit_reason"]
  run_metadata_reason: "Suites must be CHUNKABLE AND RESUMABLE, and quota-distorted samples must be EXCLUDABLE, or three of the seven mandated harness metrics — average task duration, retry rate and cost/task — lose meaning under this programme's own architecture. Recording harness and model version per run is also what makes a two-run comparison a comparison rather than a coincidence."

regression_gates:
  tiers: 3
  tier_note: "THREE TIERS, not two. R4 adds a third BELOW the judge tier: deterministic no-LLM scaffold assertions. The cheapest and most reliable check is the one that does not call a model at all, and it should be used wherever a ground truth exists."
  rows:
    - id: "RG-1"
      name: "deterministic_regression"
      kind: "deterministic"
      what_it_exercises: "The non-generative scaffold: parsing, routing, tool-argument construction, retry classification, state transitions, side effects in a mock system."
      cost: "EUR 0, no quota"
      catches: "A malformed tool argument, a wrong tool selected, an illegal state transition, a missing dedup key."
      cannot_catch: "Anything about the quality or faithfulness of generated text."
      declared_by: "S6 (W10)"
    - id: "RG-2"
      name: "judge_regression"
      kind: "judge"
      what_it_exercises: "Re-scores a CACHED corpus of (input, output) pairs against a frozen or updated rubric."
      cost: "EUR 0 in generation; $0.03–$0.60 per pass in judge inference. Adds ZERO new generation cost by construction."
      catches: "Rubric drift and scorer drift — a change to how you judge."
      cannot_catch: "BY CONSTRUCTION, any change in actual agent behaviour: a new model version, a tool timeout, a changed retrieval index. Those need re-execution."
      declared_by: "S6 (W10)"
    - id: "RG-3"
      name: "agent_regression"
      kind: "agent"
      what_it_exercises: "Full re-execution of the harness, prompt, tool layer and retrieval as deployed. The only gate that exercises the system you actually ship."
      cost: "100 agent executions per pass. THE BINDING QUOTA CONSUMER IN THE PROGRAMME."
      catches: "Behavioural regressions from a model change, a prompt change, a tool timeout or an index change."
      cannot_catch: "A regression whose trigger is absent from the 20-task suite. Suite coverage is the limit, and the gate's write-up must say so."
      declared_by: "S6 (W10)"
      non_determinism_policy:
        reruns_n: 5
        reruns_floor: 3
        environment_reset: "per trial, mandatory"
        threshold_form: "A STATISTICAL BOUND: pass-rate must not drop below X% of last-known-good over a stated minimum sample size. NEVER '100% must pass'."
        threshold_rationale: "Trajectories are stochastic even at temperature zero — tool latency, index drift and provider-side nondeterminism all vary. A binary gate over a nondeterministic system is a coin flip with a CI badge."
        rebaseline_rule: "Re-baseline DELIBERATELY when the task set or the judge changes, and record the re-baseline as an event. A silently moving baseline is not a baseline."
        deterministic_first: "Grade side effects and structure deterministically WHEREVER a ground truth exists. Reserve model judgement for genuinely open-ended output quality."
  adoption_note: "Only about half of surveyed teams run offline evals pre-deployment at all, and agent-level regression in the wild is usually manual rather than an automated gate. There is no mature off-the-shelf pattern to copy, which is why the threshold choice has to be UNDERSTOOD and defended rather than adopted."

# ---------------------------------------------------------------------------
# BRIEF REQUIREMENT RESOLUTIONS
# R8's four resolution demands plus the ambiguities it recorded without resolving.
# Each is resolved EXPLICITLY, with the decision recorded and mapped to a
# brief_requirements row, rather than resolved silently.
# ---------------------------------------------------------------------------

brief_requirement_resolutions:
  BR-046:
    requirement: "'I currently do NOT have a reliable pipeline of consulting clients. Build practical exercises teaching me how to obtain them.'"
    risk: "R8's highest-risk prose requirement. Two prose sentences between the Track E heading and its bullet list. A plan can satisfy all fifteen Track E bullets while still assuming a pipeline exists — that output would be bullet-complete and brief-failing."
    resolution: "Made an EXPLICIT, CHECKABLE TRACK E PROPERTY, not an inference. See tracks.E.zero_pipeline_assertion."
    mechanism: "Six named conditions ZP-1 through ZP-6, each with a `satisfied_by` list of concept and deliverable ids. A checker can verify each condition mechanically rather than reading Track E and forming an impression."
    key_conditions_summary: "Acquisition work starts in W01–W04 before any delivery work; a prospect list must be built from PUBLIC SOURCES ONLY with no warm introduction permitted; cold messages must go to strangers with the outcome recorded per touch and a stated expectation that most produce nothing; the no-case-study objection is answered by a NAMED ARTIFACT (W03's public-company Stage-1 rehearsal) rather than assumed away; the funnel band carries the no-case-study penalty; and agency subcontracting is demoted to a post-case-study channel because its entry runs through the same bottleneck, not around it."
    mapped_to: ["BR-046", "BR-045", "BR-047", "BR-048", "BR-049"]
  BR-148:
    requirement: "Objective goal 7 names FOUR workflows. Only THREE have flagship pipeline diagrams. The fourth — 'PR -> automated multi-axis review' — has none."
    trap: "A checker reading the flagship section finds three pipelines, matches three, and wrongly concludes goal 7 is covered."
    question_posed: "Does S2's 'automated review' satisfy the brief's MULTI-AXIS review, or is a distinct capability owed?"
    decision: "A DISTINCT CAPABILITY IS OWED. S2's automated review does NOT satisfy multi-axis review."
    reasoning: >-
      S2's review as specified produces ONE aggregate verdict on a diff: does it pass. That is
      single-axis by construction — the axis being 'acceptable or not'. The brief's word is
      MULTI-AXIS, which requires several independent judgements that can disagree with each other,
      because a diff can be correct and insecure, or safe and badly bounded, and an aggregate
      verdict hides exactly that disagreement. Treating S2 as satisfying it would be the coverage
      trap firing.
    capability_owed: "S2b — five-axis automated review, at month 04."
    axes:
      - {id: "AX-1", name: "correctness-under-repetition", question: "What happens on the second call?", derived_from: "the generated-code review checklist, question 1"}
      - {id: "AX-2", name: "crash-window durability", question: "What happens if the process dies between these two statements?", derived_from: "checklist question 2"}
      - {id: "AX-3", name: "concurrency", question: "What happens if two of these run at once?", derived_from: "checklist question 3"}
      - {id: "AX-4", name: "contract and boundary assumptions", question: "What does this assume about the external system that is stated nowhere?", derived_from: "checklist question 4"}
      - {id: "AX-5", name: "security", question: "What trust boundary, privilege or injection surface does this touch?", derived_from: "Track D"}
    axis_provenance_note: >-
      The five axes are not invented for this resolution. Four of them ARE the versioned
      generated-code review checklist authored in W04 — R7's 'currently homeless' twelfth durable
      concept, which it calls the highest-leverage half-hour in Track B and which was not in the
      week table. Homing that checklist in W04 (T-w04-6, 1.0h from existing Track B hours) and
      automating it as S2b at month 04 resolves BR-148 and R7's open question 1 with one decision.
    checkable_requirement: "S2b's acceptance is that a PR receives FIVE INDEPENDENTLY SCORED, SEPARATELY CITED outputs — not one aggregate verdict. A run producing a single score fails the gate."
    mapped_to: ["BR-148", "BR-009", "BR-021"]
    enumerated_in: "projects.platform.pipelines.multi_axis_review — recorded as a fourth pipeline so a pipeline-counting checker cannot find three and stop."
  BR-008:
    requirement: "Goal 6 names SEVEN systems to connect agents to: GitHub, Notion, Sentry, CI/CD, documentation, observability, issue trackers."
    gap_found_at_g2: "Canon's gateways covered five — GitHub, Notion, Sentry, CI/CD, observability — and DOCUMENTATION and ISSUE TRACKERS had no home and no resolution row. 5/7 with the gap left implicit."
    decision: "7/7. No new capability is owed; two of the seven are SUBSUMED, and the subsumption is recorded here rather than left to be inferred."
    mapping:
      GitHub: "S2 (PRs, CI status) and S4 (branch and worktree lifecycle), via GitHubGateway at month 04."
      Notion: "S8 at month 04, the full 12-stage ingestion pipeline, via NotionGateway."
      Sentry: "S3 at W07, on real historical issues, via SentryGateway."
      CI/CD: "S2's CI integration, reporting back INTO the task record rather than only to a badge."
      observability: "S5 at W09 — the platform both EMITS to and READS FROM its own telemetry, which is what makes it a connected system rather than an instrumented one."
      documentation: "SUBSUMED BY NOTION. The Notion workspace IS the documentation system: S8's requirement-extraction and codebase-research stages read documentation pages, and ambiguity detection fires when the documentation is insufficient to specify the task. A separate documentation integration would be a second connector to the same store."
      issue trackers: "SUBSUMED BY GITHUB ISSUES AND SENTRY. GitHub Issues is the issue tracker: W09's adversarial exercise reads an issue body as untrusted input, and S2 closes issues from PRs. Sentry is the incident tracker feeding S3. The brief names 'issue trackers' plural alongside GitHub and Sentry separately, which reads as a category label for what those two provide rather than as a demand for a third product."
    honest_caveat: "This is a SUBSUMPTION ARGUMENT, not a build. A reviewer who reads 'documentation' as demanding a distinct docs-site connector should reject it. The position is recorded so that disagreement is possible; leaving it implicit would have made 5/7 look like 7/7 without anyone deciding."
    mapped_to: ["BR-008", "BR-008a"]

  BR-013:
    requirement: "'Strong in system design INDEPENDENTLY OF AI' — a qualifier on the architecture goal, stated in prose."
    risk: "All 24 Track B `surface` values point at the agent platform or the Secure Knowledge Agent. A competence demonstrated only on AI systems has not been demonstrated to be independent of them, and the qualifier would be satisfied in name only."
    decision: "THE COMPETENCE IS AI-INDEPENDENT BY CONSTRUCTION, AND ONE ARTIFACT PROVES IT RATHER THAN ASSERTING IT."
    argument_1_the_concepts: >-
      Every P0 concept in Track B is a property of DISTRIBUTED SYSTEMS, not of agents: idempotency,
      crash windows, leases, orphan reclaim, transaction boundaries, partitioning, dead-lettering,
      fencing. None of them mentions a model. The agent platform is the SURFACE on which they are
      exercised, chosen because the learner will actually build it — not the source of the concepts.
      Swap the LLM call for any slow, unreliable, non-idempotent remote operation and every
      exercise in Track B stands unchanged. That substitution is the test of the claim.
    argument_2_the_evidence: >-
      Argument 1 is a claim about the curriculum. The EVIDENCE is SUP-01, the supplied deliberately
      bad system for architecture review #2: a roughly 400-line Python task-processing service that
      reads jobs from a table, calls two external APIs and writes results back. IT CONTAINS NO LLM
      CALL AT ALL. Its six planted defects are the same six defect classes the platform work
      teaches — non-idempotent create, commit-then-call crash window, read-modify-write race,
      compounding retries, a decision duplicated three times, a shallow repository. AR-02 is
      therefore the programme's AI-INDEPENDENT COMPETENCE CHECK: the learner finds those defects in
      an ordinary backend service, with no agent anywhere, or they have not demonstrated the
      qualifier. SUP-02 is deliberately AI-flavoured for contrast; SUP-01 is deliberately not.
    checkable_form: "SUP-01 MUST contain no LLM or agent call. A supplied bad system that quietly acquires one destroys the only AI-independent evidence in the programme. exercises/architecture-reviews.md states this constraint alongside the source."
    supporting: "The month-08 migrations and API-evolution ADR is a second AI-free surface, and the three books in resources[] are general engineering texts rather than AI material."
    mapped_to: ["BR-013", "BR-078", "BR-079"]

  BR-088:
    requirement: "Create scripts/checklists for SIX activities: researching a company; identifying likely operational pain; conducting a discovery interview; documenting the workflow; estimating ROI; deciding whether to prototype."
    gap_found_at_g2: "Only 4/6 had a named artifact. 'Researching a company' and 'deciding whether to prototype' were performed by tasks but had no CHECKLIST — and the brief asks for the checklist, not the activity."
    decision: "All six get a named artifact. The two missing ones are added below; neither costs new hours, because both activities were already happening without a written instrument."
    checklists:
      - {id: "CL-1", activity: "researching a company", artifact: "business/customer-discovery.md#company-research-checklist", first_used: "W01 (T-w01-11, 10 manual prospects)", note: "ADDED. It was implicit in the manual research task and needed to be explicit for a second reason beyond the brief: BOA-S0 automates this checklist in W03, and you cannot automate a procedure you never wrote down. The checklist is the specification the extractor is built against."}
      - {id: "CL-2", activity: "identifying likely operational pain", artifact: "templates/automation-audit.md", first_used: "W03 (Stage-1 rehearsal)"}
      - {id: "CL-3", activity: "conducting a discovery interview", artifact: "templates/discovery-interview.md", first_used: "W04 call slot", note: "Written in W03 BEFORE the first call, because a first-timer improvising will pitch."}
      - {id: "CL-4", activity: "documenting the workflow", artifact: "templates/automation-audit.md", first_used: "W07 (workflow documentation #1)"}
      - {id: "CL-5", activity: "estimating ROI", artifact: "business/consulting-offer.md#roi-method", first_used: "W08 (T-w08-14)", note: "Time saved x fully-loaded hourly cost x 52, minus platform and maintenance, expressed as a payback period in months."}
      - {id: "CL-6", activity: "deciding whether to prototype", artifact: "business/saas-validation.md#prototype-decision-gate", first_used: "W10 (T-w10-11) and W12 (T-w12-13)", note: "ADDED. The gate is: the opportunity scores above the shortlist threshold on all nine dimensions with EVIDENCE cited per dimension; no kill criterion fires; and the buyer-access and willingness-to-pay scores rest on an actual conversation or an observable signal rather than an assumption. It also has an explicit NO branch — 'prototype opportunities' is the one funnel row where the honest answer through phase 1 is usually zero, and a gate with no no-branch is a formality."}
    mapped_to: ["BR-088", "BR-087", "BR-092"]

  ambiguity_08_exercise_scope:
    resolution_location: "exercise_scope_resolution"
    summary: "Resolved by EXPLICIT P0–P3 TRIAGE with the arithmetic shown (112 topics at 1.5h each is 168h against a 180h programme), applied to both concepts and technologies, producing 42 exercise-bearing deliverables rather than 142 (the earlier 'roughly 45–55' figure was unsourced and is WITHDRAWN; see exercise_scope_resolution, which is authoritative). Every P0 and P1 concept carries a mastery_check_ref that resolves to a deliverable id, which makes the coverage checkable. The reinterpretation of 'every substantial concept' as 'every P0 and P1 concept' is STATED, so a reviewer can disagree with the reading rather than having to discover it."
    mapped_to: ["BR-067", "BR-135", "BR-136", "BR-139", "BR-140"]
  ambiguity_06_phases_vs_tracks:
    ambiguity: "The brief's own tree names five sequential phase files, which sits uneasily against its explicit ban on sequential month-by-topic theming plus its mandate for six PARALLEL tracks."
    resolution: >-
      phases/*.md contain ARCS, ENTRY AND EXIT CONDITIONS AND CHECKPOINTS ONLY. They never own
      topics, hours or tasks, and they never theme a period by subject. A phase is a statement
      about what capability the system has entering and leaving it — not about what the learner is
      studying during it. Every week inside every phase carries at least three tracks, which is
      what makes the parallelism real rather than declared: no week in the programme is a
      'security week' or an 'architecture month'.
    evidence: "Inspect any week's `hours` block: W04 carries A, B, D, P and E; W06 carries A, C, D and E; W12 carries D, B, P, E and F. The ban on sequential theming is satisfied at the WEEK level, which is the level at which the learner experiences it."
    ownership_rule: "The ownership map in the build plan already implements this. It is stated here so the phases lane cannot reintroduce theming by accident."
