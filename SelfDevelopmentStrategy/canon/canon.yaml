#   ELEVEN OF TWELVE STRENGTHENS THE FITTED-NUMBER SIGNAL RATHER THAN SOFTENING
#   IT, and the honest reading is uncomfortable: `deliverables <= 4` was derived
#   as the observed ceiling across three counted weeks, and when the other nine
