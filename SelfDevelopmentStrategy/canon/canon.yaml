  "03":
    id: "W03"
    name: "Effectively-once under adversarial restarts"
    outcome_sentence: "By Sunday I can replay one task event 100 times with process kills injected at random points and prove that exactly one domain state transition, one recorded PR-intent and one dedup row resulted."
    framing_correction:
      supersedes: "\"prove exactly-once under 100 replays\""
      reason: >-
        The original phrasing states something false and this learner is exactly the profile
        who will notice. Exactly-once DELIVERY over an unreliable network is impossible: a
        sender receiving no ack cannot distinguish a lost message from a lost ack, so it must
        resend (at-least-once, risking duplicates) or not (at-most-once, risking loss). Exactly-once
        EXECUTION of a side effect is likewise unachievable in general, because the effect and
        the record-that-it-happened are not atomic unless they share a transaction. The
        achievable property is the OUTCOME: at-least-once delivery plus idempotent processing
        equals EFFECTIVELY-ONCE OUTCOMES. State after N deliveries equals state after one.
        Duplicates are ABSORBED, not prevented — and that distinction is the whole lesson.
      assessed: "The learner must explain in one written sentence why the week's original headline claim was false. Converting a wording error into an assessed teaching moment models the review posture the program is building."
      mechanisms:
        - "Shared-transaction dedup — when the effect lives in the same database as the dedup record, insert the key and perform the effect in one transaction under a unique constraint. THIS IS THE ONLY PLACE A STRONG ONCE-ONLY CLAIM IS HONEST, and saying so plainly is the most useful sentence in the week."
        - "Remote effect with a supplied idempotency key — you inherit the remote system's guarantee, not a stronger one."
        - "Remote effect with a natural key or conditional create — one PR per branch name, one Notion page per task id, one git ref per branch. PREFER NATURAL KEYS AND CONDITIONAL CREATES OVER IDEMPOTENCY BOOKKEEPING; this is the operational lesson the learner is missing."
      irreducible_window: "You call GitHub, it creates the PR, the response is lost, you crash before recording it. On retry you must DISCOVER that the effect happened; query-then-act is racy. The durable answer is mechanism 3 plus reconciliation for the residue. Teaching that the window CANNOT be closed — and that the engineering answer is to make the operation naturally idempotent rather than to close it — is worth more than any amount of correct implementation."
      require_failure_first: "Build the NON-idempotent version, replay it, watch the duplicates accumulate, then fix it. For a concept-strong / operation-weak learner, SEEING the duplicates is the entire value; being told about them is what they already have."
    topics: ["idempotency", "retries", "resumability", "consistency", "failure recovery", "transactions", "structured outputs", "outreach", "discovering repetitive workflows"]
    stage: "S1b (extends S1a) + BOA-S0"
    subsystems_introduced: ["BOA-S0 — structured extraction over company sites"]
    cap_exception_reason: ""
    subsystem_count_note: "S1b EXTENDS S1a and is therefore not counted, per the counting unit in caps_definitions. BOA-S0 is the single new subsystem. Plan v3 reported 2 here and priced a cap exception, contradicting its own definition three lines above; v4 withdrew it by APPLYING the definition rather than carving an exception around it. Canon keeps the withdrawal."
    maturity_level_target: "L2"
    failure_exercise_ids: ["EX-FAIL-03", "EX-FAIL-04"]
    arch_review_id: null
    hours: {theory: 2.5, building: 6.0, testing: 3.0, business: 3.5}
    tasks:
