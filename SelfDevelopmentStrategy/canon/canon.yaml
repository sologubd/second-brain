    - {id: "BR-008", satisfied_by: ["brief_requirement_resolutions.BR-008"], note: "5/7 direct plus 2 subsumed, with the subsumption argued explicitly rather than left implicit."}
    - {id: "BR-009", satisfied_by: ["projects.platform.pipelines", "brief_requirement_resolutions.BR-148"], note: "All FOUR workflows, including the one with no diagram in the brief."}
    - {id: "BR-010", satisfied_by: ["tracks.C", "projects.secure_knowledge_agent"]}
    - {id: "BR-011", satisfied_by: ["C-047..C-069", "C-060", "C-058", "C-062", "C-065"], note: "Six sub-topics packed into one prose bullet; each is a separate Track C concept row."}
    - id: "BR-012"
      satisfied_by: ["C-070", "C-071", "C-074", "C-076", "C-075", "C-072", "C-073", "C-079", "C-081", "C-082", "C-078", "C-080"]
      note: >
        REPOINTED. This row previously cited tracks.D.asi_categories, which is the OWASP Agentic Top 10
        (ASI01..ASI10). The brief's goal 10 also names TEN items, but a DIFFERENT ten. A checker validating
        "literal_count is 10, the cited block has 10 rows, PASS" would have passed on the wrong list. This is
        the concrete instance of the residual named in verification_extended: a citation that RESOLVES is not
        a citation that resolves to the RIGHT thing. The row now cites concept ids directly, and brief_terms
        below records the correspondence for the four terms canon carries under a different name.
      brief_terms:
        - {brief_term: "prompt injection",          concept_ids: ["C-070"], renamed: false}
        - {brief_term: "indirect prompt injection", concept_ids: ["C-071"], renamed: false}
        - {brief_term: "tool abuse",                concept_ids: ["C-074", "C-076"], renamed: true,
           rename_note: "Canon splits the brief's single term into the two distinct surfaces it conflates: C-074 malicious tool OUTPUT (the tool lies to the agent) and C-076 insecure tool PERMISSIONS (the agent may call what it should not). Attacking these needs different exercises, so the split is deliberate."}
        - {brief_term: "excessive permissions",     concept_ids: ["C-076", "C-078", "C-080"], renamed: true,
           rename_note: "Carried as C-076 insecure tool permissions, C-078 excessive agency and C-080 least privilege. The brief's phrase names the symptom; canon names the mechanism, the capability excess and the corrective principle."}
        - {brief_term: "data exfiltration",         concept_ids: ["C-075"], renamed: false}
        - {brief_term: "RAG poisoning",             concept_ids: ["C-072"], renamed: false}
        - {brief_term: "memory poisoning",          concept_ids: ["C-073"], renamed: false}
        - {brief_term: "trust boundaries",          concept_ids: ["C-079"], renamed: true,
           rename_note: "Carried as C-079 privilege boundaries. Same concept; canon uses the term that names what the boundary is FOR."}
        - {brief_term: "sandboxing",                concept_ids: ["C-081"], renamed: false}
        - {brief_term: "human approval",            concept_ids: ["C-082"], renamed: true,
           rename_note: "Carried as C-082 approval gates. Same concept; canon uses the architectural-control term rather than the activity term."}
      coverage_check: >
        All ten brief terms map to at least one Track D concept id, and every cited id exists. Four are
        renamed and the correspondence is recorded here rather than left to a reader to infer. tracks.D.asi_categories
        remains in canon as the OWASP taxonomy for the attack work, but is no longer offered as evidence for BR-012.
