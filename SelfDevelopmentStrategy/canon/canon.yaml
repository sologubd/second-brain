    - {id: "SM-17", group: "Business", name: "replies", unit: "count", source_artifact: "the outreach send log", cadence: "weekly", evidence_source: "real", expected_total: "0.78 – 4.16 (midpoint 2.47)", note: "Log DECLINES SEPARATELY. A reply that is a polite no is not progress, and counting it as one is how a stalled funnel looks like a slow-but-working one."}
    - {id: "SM-18", group: "Business", name: "discovery calls", unit: "count", source_artifact: "discovery notes (PF-09)", cadence: "weekly", evidence_source: "real | simulated", expected_total: "0.12 – 1.46 (midpoint 0.62)", note: "P(zero across the whole programme) is 53.9% at the band midpoint. Zero is the modal outcome and reads as the plan working."}
    - {id: "SM-19", group: "Business", name: "qualified pains", unit: "count", source_artifact: "the pain register (D-w10-4)", cadence: "monthly", evidence_source: "real | simulated"}
