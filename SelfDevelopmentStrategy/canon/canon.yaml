# ---------------------------------------------------------------------------
# PORTFOLIO — 10 items, each with a `credibility` statement answering:
# what makes this credible to a senior engineer or a potential client?
# ---------------------------------------------------------------------------

portfolio:
  count: 10
  home_file: "reference/portfolio.md"
  rule: "Every item points at a RUNNABLE artifact or a measured number, never at a description. 'I studied it' is never evidence."
  items:
    - id: "PF-01"
      name: "Engineering Agent Platform"
      evidence_ids: ["D-w01-1", "D-w02-1", "D-w03-1", "D-w04-1", "D-w08-1", "D-w09-1", "D-m04-1"]
      complete_by: "M04"
      credibility: "It survives `kill -9` at any step boundary and proves it: 100 replays with injected kills produce exactly one state transition, one PR, one dedup row per key. A senior engineer does not need to read the code — they need to run `make demo-s1b-replay N=100` and watch it hold. Almost no side project has a fault-injection suite, and the ones that do are the ones written by people who have operated something."
    - id: "PF-02"
      name: "Secure Knowledge/RAG Agent"
      evidence_ids: ["D-w05-1", "D-w05-2", "D-w06-1", "D-w11-3"]
      complete_by: "M03"
      credibility: "It ships a test that FAILS on the obvious implementation. The permission pre-filter comes with a reproducible case where the naive post-filter silently returns fewer authorized results than exist — which is the defect a reviewer expects to find and instead finds already named, demonstrated and fixed. Plus NDCG@5 and MRR per configuration against a label set that was frozen before any tuning -- provable from `evals/ska-labels.frozen.sha256`, a digest-plus-ISO-date record written the moment the set was frozen and re-verified against `evals/ska-labels.frozen.jsonl` when the metrics are read. NOT from commit history: meta.no_git_commits means this repo has none, and a reviewer handed a claim of freezing that rests on a history that does not exist is being asked to take the most tuning-sensitive number in the portfolio on trust."
    - id: "PF-03"
      name: "Business Operations Automation"
      evidence_ids: ["D-w03-2", "D-w04-2", "D-m05-1", "D-m05-3"]
      complete_by: "M05"
      credibility: "It cannot send. Every outbound action requires an approval record, an attempt to bypass it is refused AND logged, and the approval payload shows the literal proposed call rather than the agent's summary of it. For a buyer, that is the difference between an automation they would let near their CRM and one they would not."
    - id: "PF-04"
      name: "Architecture ADR collection"
      evidence_ids: ["D-w04-3", "D-w08-2", "D-w12-3", "D-m08-1"]
      complete_by: "M08"
      credibility: "The ADRs name ACCEPTED DEFECTS with remediation months, not just decisions taken. Review #2 is conducted on a deliberately bad system supplied to the reviewer, so it demonstrates the ability to find defects rather than the ability to describe one's own choices favourably. A clean bill of health would be the least credible possible output."
    - id: "PF-05"
      name: "AI security attack/evaluation report"
      evidence_ids: ["D-w11-2", "D-w12-2", "D-m05-2"]
      complete_by: "M05"
      begins: "W11"
      credibility: "Every number in it is a measurement of the author's own system with a stated denominator — attack success rate before and after a named structural mitigation — and there is not one industry effectiveness percentage anywhere, because none met a citable standard. The memory-poisoning chapter maps onto a worked example published by the standards body itself, so it is recognisably a real threat class rather than an invented one."
    - id: "PF-06"
      name: "Agent evaluation suite"
      evidence_ids: ["D-w10-1", "D-w10-2"]
      complete_by: "M03"
      credibility: "It gates a merge, with three tiers and a threshold that is a stated statistical bound over N=5 reruns rather than a binary pass. The report also states what each tier CANNOT catch. Most published eval work asserts a score; this one asserts a decision rule and its blind spots, which is what an engineer who has run a flaky suite is looking for."
    - id: "PF-07"
      name: "At least one real external automation case study if possible"
      evidence_ids: ["D-m07-1"]
      complete_by: "M07 (contingent)"
      credibility: "A MEASURED before/after baseline from someone else's business, with the measurement method documented well enough to survive 'how did you measure that?'. If the funnel does not produce one, the honest substitute is the Stage-1 documented workflows tagged evidence_source: simulated — and that tag is itself credibility, because it shows the author distinguishes evidence from demonstration. Partial substitution exists so that THIS item is the last thing to become simulated."
      contingency: "Under the corrected funnel this item is genuinely at risk. It is the reason substitution is partial and one deliverable at a time."
    - id: "PF-08"
      name: "Consulting offer page"
      evidence_ids: ["D-w11-4", "D-m06-3"]
      complete_by: "M06"
      credibility: "Fixed scope, fixed price, and a payback period computed from a measured baseline using fully-loaded cost — not an industry-average ROI percentage. A buyer recognises the difference immediately: one is a claim about them, the other is a claim about a survey."
      contingency: >-
        ADDED AT G8. This item requires a payback period computed from a MEASURED baseline. Under the
        modal zero-call branch -- 53.9% at the band midpoint -- no real baseline exists, so the offer is
        built on W08's simulated one and the item carries evidence_source: simulated. PF-07 already had a
        contingency of this shape and this one did not, which made PF-08 the only portfolio item that was
        structurally unreachable in the modal case with no declared alternative. An offer priced from a
        STATED simulated baseline is credible; one that does not say which baseline it used is not.
    - id: "PF-09"
      name: "Customer discovery notes"
      evidence_ids: ["D-w03-3", "D-w07-4", "D-w09-3", "D-w10-4"]
      complete_by: "M03"
      credibility: "Every note carries evidence_source: real or simulated, and the funnel numbers next to them are the ACTUAL sends and replies, not targets. A reader can see a first-timer's real conversion rate and the plan's own prediction side by side. Placeholder identities throughout, with real data in gitignored files — which is itself the discipline a client checks for."
    - id: "PF-10"
      name: "Micro-SaaS opportunity scorecard"
      evidence_ids: ["D-w10-4", "D-w12-4", "D-m09-2"]
      complete_by: "M09"
      credibility: "It has produced a NO, or an explicit 'insufficient evidence, deferred', with the missing threshold named and dated. A scorecard that has only ever produced yeses is a rationalisation engine. This one is scored against seven thresholds with concrete numbers and five kill criteria with stated detection rules."

# ---------------------------------------------------------------------------
# DIFFICULTY LADDER — the brief's 9 stages, verbatim, with what each means here.
# ---------------------------------------------------------------------------

difficulty_ladder:
  count: 9
  home_file: "reference/difficulty-ladder.md"
  progression: ["understand", "implement", "break", "debug", "measure", "secure", "operate", "explain", "sell"]
  stages:
    - {id: "DL-1", stage: "understand", meaning: "State the mechanism and the failure it prevents, without code. For this learner most concepts start here already — which is why almost nothing in this program stops here.", exemplar_week: "W01", exemplar_ref: "D-w01-4"}
    - {id: "DL-2", stage: "implement", meaning: "Build the thing so it works on the happy path.", exemplar_week: "W02", exemplar_ref: "D-w02-1"}
    - {id: "DL-3", stage: "break", meaning: "Build the WRONG version first and watch it fail. For a concept-strong / operation-weak learner, SEEING the duplicates accumulate is the entire value; being told about them is what they already have.", exemplar_week: "W03", exemplar_ref: "D-w03-1"}
    - {id: "DL-4", stage: "debug", meaning: "Find the cause when the evidence lies — a stack trace pointing away from the fault, a comment describing code that no longer exists.", exemplar_week: "W07", exemplar_ref: "D-w07-3"}
    - {id: "DL-5", stage: "measure", meaning: "Attach a number to a change and prove it moved. A change with no frozen baseline is unfalsifiable.", exemplar_week: "W06", exemplar_ref: "D-w06-1"}
    - {id: "DL-6", stage: "secure", meaning: "Attack it yourself and report the success rate against your own system before and after a structural mitigation.", exemplar_week: "W11", exemplar_ref: "D-w11-2"}
    - {id: "DL-7", stage: "operate", meaning: "Run it under contention and failure and know what it did from telemetry rather than memory. THE STAGE THIS LEARNER'S BASELINE MOST NEEDS, and the one most curricula skip.", exemplar_week: "W09", exemplar_ref: "D-w09-1"}
    - {id: "DL-8", stage: "explain", meaning: "Write the ADR, name the accepted defects, and defend the threshold you chose to someone who will push back.", exemplar_week: "W12", exemplar_ref: "D-w12-3"}
    - {id: "DL-9", stage: "sell", meaning: "Convert the capability into a payback period a buyer accepts, or into an honest non-verdict. The ladder ends here deliberately: a capability nobody will pay for is a hobby, and a program that stops at 'operate' cannot tell the difference.", exemplar_week: "W08", exemplar_ref: "D-w08-4"}
  application_rule: "Not every exercise climbs all nine rungs. An exercise names the rungs it covers, and every P0 concept must be covered to at least `implement` — with the concepts in tracks A, B and D whose failures are invisible to a generate-and-test loop covered to at least `break`."

# ---------------------------------------------------------------------------
# FAILURE EXERCISES — the 14 named exercises, each with ALL FIVE mandated parts.
# 14 x 5 = 70 cells, all non-empty. Each id appears in EXACTLY ONE week row.
# ---------------------------------------------------------------------------

failure_exercises:
  count: 14
  cells: 70
  home_file: "exercises/agent-failures.md"
  five_parts: ["detection", "safe_behavior", "recovery", "logging", "proving_test"]
  distribution_rule: "12 weeks cannot host 14 exercises one-per-week. Resolution: 1–2 per week, W03 and W04 carrying two each, with the distribution recorded here. Months draw from failure_exercises_extended[] instead, so the invariant 'every id in failure_exercises[] appears in exactly one week row' stays clean."
  rows:
    - id: "EX-FAIL-01"
      name: "ambiguous ticket"
      week: "W01"
      detection: "The task file lacks an acceptance predicate a machine can evaluate. The runner computes a specificity check before dispatch — is there a named file or module, a stated done-condition, and at least one verifiable assertion — and fails the check rather than the task."
      safe_behavior: "Refuse to dispatch. Do not let the agent guess and produce a plausible diff against an unstated requirement, which is the expensive failure because it looks like success."
      recovery: "Emit EVERY missing element by name — one, two or all three, not the first one found — and re-queue the task in a `needs_clarification` state that a human resolves. Never auto-fill a missing acceptance criterion."
      logging: "Record the task id, which specificity element was missing, and the raw task text, so ambiguity patterns can be counted across weeks rather than handled one at a time."
      proving_test: "A fixture task with no acceptance criterion is refused before any model call; a fixture with one dispatches. The refusal test FAILS against the pre-mitigation runner, which dispatched both."
    - id: "EX-FAIL-02"
      name: "agent context loss after restart"
      week: "W02"
      detection: "On resume, the recorded step pointer disagrees with the observable world state — a step is marked incomplete but its effect exists, or the reverse."
      safe_behavior: "Resume from the LAST DURABLY RECORDED step, never from an in-memory assumption about progress. If the pointer and the world disagree, halt rather than proceed on either."
      recovery: "Re-execute from the recorded step. Because each step's completion committed in the same transaction as its effect, re-execution is safe by construction rather than by care."
      logging: "Record the step pointer at kill time and at resume, plus the wall-clock gap, so orphan detection latency is measurable rather than felt."
      proving_test: "Kill the process at each step boundary in turn; assert the resumed run reaches the same terminal state as an uninterrupted run, and that no effect occurs twice. Fails against a version that holds progress in memory."
    - id: "EX-FAIL-03"
      name: "partial tool failure"
      week: "W03"
      detection: "One external write in a multi-write step succeeds and another fails, leaving state and effects divergent. Detected by comparing the recorded effect set against the observed effect set at step exit."
      safe_behavior: "The step is not marked complete unless ALL its recorded effects are confirmed. A partially applied step stays in-flight rather than being reported as done."
      recovery: "Retry the step; already-applied effects are absorbed by their natural keys or dedup rows rather than repeated. Where no natural key exists, reconcile by querying for the effect before re-attempting."
      logging: "Record which effects were confirmed, which were not, and the classification of each failure — retryable, permanent, or already-applied."
      proving_test: "Inject a failure into the second of three writes; assert exactly one of each effect exists after retry, and that the step's terminal state is correct. Fails against a version that marks the step complete after the first success."
    - id: "EX-FAIL-04"
      name: "model timeout"
      week: "W03"
      detection: "The harness subprocess exceeds its wall-clock budget with no terminal event. Distinguished from a slow-but-alive run by the absence of streamed events, not by elapsed time alone."
      safe_behavior: "Kill the subprocess and treat the attempt as failed-retryable, NOT as a task failure. A timeout is a statement about the harness, not about the task."
      recovery: "Start a NEW ATTEMPT carrying prior state — not a replay, because the work unit is nondeterministic and the retry will do something different. The retry budget is aggregate across layers so three retries at three levels cannot become twenty-seven calls."
      logging: "Record the timeout, the elapsed time, the last event received, and whether the aggregate retry budget was consumed. Tag the sample so it is excludable from average-task-duration."
      proving_test: "A stubbed harness that hangs triggers a kill inside the budget and exactly one retry; a third timeout dead-letters rather than looping. Fails against a version with a per-layer retry count and no aggregate budget."
    - id: "EX-FAIL-05"
      name: "failing flaky test"
      week: "W04"
      detection: "A test fails and then passes on an unchanged tree. The verification gate re-runs a failing test N times on the same commit before classifying it."
      safe_behavior: "Do NOT auto-approve past a flaky failure and do NOT let the agent 'fix' it by weakening the assertion — the second is the characteristic generated-code response and it is worse than the failure."
      recovery: "Classify as flaky, quarantine the test with a recorded reason, and escalate to human review. The PR proceeds only with the quarantine explicitly visible in the approval payload."
      logging: "Record the test id, the pass/fail sequence across re-runs, and the commit sha, so flakiness is a tracked property of the test rather than an anecdote."
      proving_test: "A deliberately flaky fixture test is classified as flaky rather than as a failure, and an agent attempt to modify its assertion is rejected by the gate. Fails against a version that treats one failure as a verdict."
    - id: "EX-FAIL-06"
      name: "CI failure unrelated to the change"
      week: "W04"
      detection: "CI fails on a job whose inputs the diff does not touch. Detected by intersecting the changed file set with each job's declared input paths."
      safe_behavior: "Do not attribute an unrelated failure to the change and do not let the agent widen the diff trying to fix it — scope creep in response to a red build is how a two-file change becomes a twenty-file one."
      recovery: "Mark the job as unrelated-failing, surface it separately in the approval payload, and continue the task's own verification independently."
      logging: "Record the job name, the changed file set, the job's declared inputs, and the intersection result, so misattribution can be audited later."
      proving_test: "A fixture PR touching one module with a deliberately broken unrelated job is classified unrelated and the task's own verification still reports independently. Fails against a version that treats any red CI as the task's failure."
    - id: "EX-FAIL-07"
      name: "stale documentation"
      week: "W05"
      detection: "A retrieved document's last-modified date is materially older than the code it describes, or its claims contradict the current source. Detected at retrieval time by comparing chunk provenance timestamps against the referenced file's mtime."
      safe_behavior: "Surface the staleness to the answer layer as a first-class signal rather than silently ranking the document normally. An agent that cannot tell fresh from stale will confidently assert the stale version."
      recovery: "Down-weight stale chunks by trust tier, and where the answer depends on one, cite it WITH its age so a human can judge."
      logging: "Record chunk id, chunk age, referenced-artifact age, and whether the answer relied on it."
      proving_test: "A corpus containing one deliberately outdated document produces an answer that either avoids it or cites it with its age. Fails against a version that ranks purely on relevance."
    - id: "EX-FAIL-08"
      name: "misleading code comments"
      week: "W06"
      detection: "A comment asserts behaviour the code does not have. Detected by having the agent state the function's behaviour from the comment alone, then from the body alone, and comparing."
      safe_behavior: "Treat the CODE as ground truth and the comment as a claim. Generated code inherits the comment's error faithfully because a comment is the highest-signal text in context."
      recovery: "Flag the divergence as a finding rather than silently preferring one; a wrong comment is a defect worth its own fix."
      logging: "Record file, line, the comment's claim, the code's actual behaviour, and whether the agent's first answer followed the comment."
      proving_test: "At least two Sentry corpus issues carry a misdescribing comment; assert the agent flags the divergence rather than reproducing the comment's claim. Fails against a version given the comment as authoritative."
    - id: "EX-FAIL-09"
      name: "Sentry event with misleading stack trace"
      week: "W07"
      detection: "The top frame is not the fault site — a wrapper, a serialiser, or a framework boundary. Detected when a reproduction built from the top frame does not reproduce."
      safe_behavior: "Require a REPRODUCTION before a hypothesis is accepted. A fix proposed from a trace alone is a guess with a diff attached."
      recovery: "Widen from the trace to the correlated commit and the retrieval layer's view of the surrounding module; re-derive the hypothesis from the reproduction rather than from the trace."
      logging: "Record the top frame, the frame the reproduction implicated, and the correlation precision of the retrieval step for that issue."
      proving_test: "A real historical issue from the labelled corpus whose trace points away from the fixing commit is diagnosed correctly; the run that skips reproduction is shown to produce the wrong fix. Fails against a version that accepts the top frame."
    - id: "EX-FAIL-10"
      name: "two agents modifying overlapping files"
      week: "W08"
      detection: "Two claimed tasks declare overlapping file scopes, or two worktrees produce diffs touching the same path."
      safe_behavior: "PARTITION rather than lock: tasks with overlapping declared scope are not claimed concurrently. Contention that cannot arise needs no coordination."
      recovery: "Where partitioning is unavailable, serialise on a version column (optimistic offline lock) and make the loser re-derive its diff against the new base rather than merging blindly."
      logging: "Record both task ids, both file scopes, the overlap set, and whether resolution was by partition or by version conflict."
      proving_test: "Two tasks with a deliberate overlap are never claimed concurrently; forced concurrently, the second is rejected by the version check rather than silently overwriting. Fails against a version with no scope declaration."
    - id: "EX-FAIL-11"
      name: "malicious GitHub issue"
      week: "W09"
      detection: "An issue body drives unbounded work — a huge input, a recursive instruction, or a request that fans out. Detected by the aggregate retry and token budget tripping before the task completes."
      safe_behavior: "The budget is enforced BEFORE the spend, not observed after it. A task that would exceed its budget is refused rather than throttled silently, because a silent throttle under a flat-rate plan is indistinguishable from slowness."
      recovery: "Dead-letter the task with the budget breach recorded, and treat issue bodies as untrusted content for the purposes of the trust boundary built in W11."
      logging: "Record tokens consumed, retries attempted at each layer, quota_stall_seconds, and the budget that tripped."
      proving_test: "An adversarial fixture issue trips the aggregate budget and is refused; measured spend before the defense is recorded as a number for comparison. Fails against a version with per-layer retry counts."
    - id: "EX-FAIL-12"
      name: "conflicting requirements"
      week: "W10"
      detection: "Two acceptance criteria in one task cannot both hold. Detected by requiring the agent to restate the criteria as assertions before implementing, at which point the contradiction is mechanical."
      safe_behavior: "FLAG THE CONFLICT rather than silently picking one. The metric is the flag rate, NOT the quality of what was produced — a beautiful implementation of one arbitrarily chosen requirement is the failure."
      recovery: "Return the task to `needs_clarification` naming both criteria and why they conflict."
      logging: "Record both criteria, whether the agent flagged or picked, and which it picked when it picked."
      proving_test: "Across the 20-task suite, deliberately conflicting fixtures are flagged at a rate above the declared threshold; a silent pick counts as a failure even when the output is correct against one criterion. Fails against a version with no restate-as-assertions step."
    - id: "EX-FAIL-13"
      name: "indirect prompt injection inside retrieved document"
      week: "W11"
      detection: "Compare behaviour against a control run on an unpoisoned corpus. Detected as DEVIATION FROM CONTROL, not as recognition of the payload — a detector that only catches payloads it was shown is not a detector."
      safe_behavior: "Retrieved content is structurally untrusted: marked with provenance at ingest, separated from operator instructions by a hard boundary the model cannot be talked across, and unable to authorise a tool call on its own."
      recovery: "Strip the external-send capability from any turn that touched untrusted input in that cycle — a structural leg-removal from the trifecta, not a filter."
      logging: "Record payload style, query, control output, poisoned output, and whether an external-send tool was attempted."
      proving_test: "At least three payload styles across a fixed query set; attack success rate reported against control before and after the mitigation, with a stated denominator and NO industry percentage anywhere. Fails against a version that concatenates retrieved text into the instruction context."
    - id: "EX-FAIL-14"
      name: "malicious tool output"
      week: "W12"
      detection: "Tool output containing instruction-shaped content, or output that fails its declared schema. Detected at the tool boundary by schema validation, before the output enters context."
      safe_behavior: "Tool output is untrusted input, not internal data. A schema with no field for an instruction cannot carry one — validation is the control, and the model's cooperation is not required for it to hold."
      recovery: "Reject the output, record the rejection, and re-invoke with a constrained variant; after N rejections dead-letter rather than accepting a degraded parse."
      logging: "Record tool name, the raw output, the validation error, and what the agent did next."
      proving_test: "A stubbed tool returning instruction-laden and schema-violating output is rejected at the boundary and never reaches the model's instruction context. Fails against a version that passes tool output through as text."

failure_exercises_extended:
  purpose: "Months 04–12 draw from HERE, not from the canonical 14, so the invariant that each of the 14 appears in exactly one week row stays clean."
  home_file: "exercises/agent-failures.md"
  rows:
    - id: "EXT-01"
      name: "crash between commit and external effect"
      month: "M04"
      detection: "A fault injector kills the process at EVERY boundary between the local commit and the last external call — not a sample — and records the resulting inconsistency at each."
      safe_behavior: "The outbox row is written in the SAME transaction as the state transition, so a rolled-back transaction leaves no pending effect."
      recovery: "A separate relay process delivers pending effects at-least-once; handlers stay correct when the relay delivers twice."
      logging: "Record the kill point, the observed inconsistency, and commit-to-effect latency p50 and p99."
      proving_test: "Post-outbox, no kill point produces a lost effect or state/effect divergence; asserting no outbox row exists after a rolled-back transaction proves the shared transaction. Fails against the naive commit-then-call version."
    - id: "EXT-02"
      name: "compensation that fails"
      month: "M04"
      detection: "A compensation in the task-lifecycle teardown saga itself fails — permanently."
      safe_behavior: "Every compensation is independently idempotent and is invoked twice in the suite to prove it. Compensations run in a defined order with the lease released LAST, and the ordering is justified in writing."
      recovery: "A permanently failing compensation yields a DEFINED TERMINAL STATE plus an operator-visible alert — never a hang and never a silent swallow. At least one effect must be identified that CANNOT be compensated, with a written statement of what is done instead."
      logging: "Record compensations that were non-idempotent on first implementation (honestly), the states reachable after a compensation failure, and the non-compensable effects identified."
      proving_test: "Double-invoked compensations produce no additional effect; a permanently failing compensation reaches a defined terminal state. The classification of each platform surface as saga-shaped or outbox-shaped is defended in writing."
    - id: "EXT-03"
      name: "memory poisoning of durable per-account memory"
      month: "M05"
      detection: "A durable memory entry's provenance shows an untrusted origin and a suspicious update frequency. Detected by requiring source attribution on every write and monitoring repeated reinforcement of the same claim."
      safe_behavior: "Repetition is NOT corroboration. A high-impact memory entry requires two factors to surface — a provenance score plus a human-verified tag — and unverified memory expires."
      recovery: "Expire or quarantine the poisoned entry, re-derive the affected decision, and prevent automatic re-ingestion of the agent's own generated output into trusted memory."
      logging: "Record the write's origin channel, trust tier, reinforcement count, the later decision that read it, and the outcome."
      proving_test: "The poisoning message and the exploiting decision MUST be separated by at least one full pipeline cycle, not one context window. Poisoning succeeds pre-patch; the patch measurably blocks or flags it on re-run; the false-positive rate on legitimate writes is reported as a cost check. Without the session separation the exercise is ordinary prompt injection, not memory poisoning."
      validation_note: "This exercise is VALIDATED BY THE STANDARDS BODY'S OWN WORKED EXAMPLE — an attacker repeatedly reinforcing a fake price, the assistant storing it as truth, then approving transactions at that price and bypassing checks. The BOA exercise is structurally identical and is therefore well-formed rather than contrived."
    - id: "EXT-04"
      name: "malformed input to the operations agent"
      month: "M05"
      detection: "An inbound document fails schema extraction, or extracts to a valid-but-implausible instance."
      safe_behavior: "A validation failure is a retry signal with a recorded reason, never a silent default. An implausible-but-valid extraction is escalated rather than acted on."
      recovery: "Re-extract with a constrained schema; after N failures route to human review rather than accepting a degraded parse."
      logging: "Record the raw input, the schema violation, the retry count and the final disposition."
      proving_test: "A corpus of deliberately malformed documents produces zero silent defaults and zero acted-on implausible extractions."
    - id: "EXT-05"
      name: "authorization bypass through a policy gap"
      month: "M06"
      detection: "A request reaches a resource no role grants it, because the check function has a gap rather than a deny-by-default."
      safe_behavior: "DENY BY DEFAULT. An action with no matching policy is refused, not permitted."
      recovery: "Add the missing rule, and add a test asserting the deny-by-default path rather than only the newly added allow."
      logging: "Record the principal, the action, the matched rule or its absence, and the decision."
      proving_test: "A fuzz over action/role pairs finds zero permitted actions without an explicit allow rule."

# ---------------------------------------------------------------------------
# EXERCISE VOCABULARY — the enums that make an exercise's Deliverable and
# Metrics sections CHECKABLE rather than free text. Referenced by the `exercise`
# and `business` schemas.
# ---------------------------------------------------------------------------

exercise_deliverable_types:
  count: 10
  requirement_ref: "BR-071"
  rule: "Every exercise's `## Deliverable` names a CONCRETE ARTIFACT whose type is one of these ten. A deliverable that is not one of these types is a description, not an artifact, and fails check-schema."
  types:
    - {id: "DT-01", name: "repository", note: "A runnable codebase or package, not a snippet."}
    - {id: "DT-02", name: "PR", note: "A real pull request against a real repository."}
    - {id: "DT-03", name: "benchmark", note: "A comparison with a stated denominator and a frozen baseline."}
    - {id: "DT-04", name: "ADR", note: "A decision record naming alternatives considered and consequences accepted."}
    - {id: "DT-05", name: "diagram", note: "Used sparingly; a diagram that restates prose is filler."}
    - {id: "DT-06", name: "test suite", note: "Must FAIL against the pre-mitigation code, or it proves nothing."}
    - {id: "DT-07", name: "attack report", note: "Success rate against the learner's OWN system, per technique, before and after."}
    - {id: "DT-08", name: "case study", note: "Requires a MEASURED before/after baseline. Carries evidence_source."}
    - {id: "DT-09", name: "demo", note: "Must have a runnable command in the project file."}
    - {id: "DT-10", name: "metrics report", note: "Numbers against a frozen evaluation set, with the set identified."}

exercise_metric_types:
  count: 14
  requirement_ref: "BR-074"
  rule: "WHERE MEANINGFUL, an exercise's `## Metrics` draws from these fourteen. Every rate states a DENOMINATOR. A metric with no denominator is a claim."
  types:
    - {id: "MT-01", name: "success rate", used_by: ["D-w10-1", "D-w08-1"]}
    - {id: "MT-02", name: "latency", used_by: ["D-w06-1", "D-w09-1"]}
    - {id: "MT-03", name: "token usage", used_by: ["D-w01-2", "D-w09-1"]}
    - {id: "MT-04", name: "cost", used_by: ["D-w09-1", "D-w10-1"]}
    - {id: "MT-05", name: "test coverage", used_by: ["D-w02-1"]}
    - {id: "MT-06", name: "retrieval precision", used_by: ["D-w05-1", "D-w06-1", "D-w07-1"]}
    - {id: "MT-07", name: "recall", used_by: ["D-w05-1", "D-w06-1"]}
    - {id: "MT-08", name: "MRR/NDCG", used_by: ["D-w05-1", "D-w06-1"]}
    - {id: "MT-09", name: "failure rate", used_by: ["D-w08-1", "D-w10-1"]}
    - {id: "MT-10", name: "attack success rate", used_by: ["D-w06-2", "D-w11-2", "D-w12-2", "D-m05-2"], note: "ALWAYS measured against the learner's own system. Never an industry figure."}
    - {id: "MT-11", name: "number of interviews", used_by: ["D-w05-3", "D-w07-4"], group: "business"}
    - {id: "MT-12", name: "response rate", used_by: ["D-w02-3", "D-w09-3"], group: "business"}
    - {id: "MT-13", name: "number of qualified pains", used_by: ["D-w10-4", "D-w11-4"], group: "business"}
    - {id: "MT-14", name: "number of paid pilots", used_by: ["D-m07-1", "D-m09-1"], group: "business"}
  business_metric_note: "FOUR of the fourteen are business metrics. Their presence in the brief's own metric list is part of the evidence that business topics were always meant to carry the same exercise shape as engineering topics — see exercise_shape_rule."

exercise_shape_rule:
  # HOISTED TO TOP LEVEL. It previously sat under tracks.E and said "every business/*.md lane",
  # which left Track F outside its scope — and tracks/micro-saas.md is a `track` schema, not a
  # `business` one. Track F's kill criteria and pain scoring are EXACTLY the content that drifts
  # into narrative playbook, so the scoping gap pointed at the highest-risk file.
  requirement_ref: "BR-150"
  applies_to: ["business/*.md", "tracks/consulting.md", "tracks/micro-saas.md", "exercises/*.md", "weeks/*.md", "months/*.md"]
  statement: >-
    THE BUSINESS HALF OF THIS PROGRAMME IS EXERCISE-SHAPED, IDENTICALLY TO THE ENGINEERING HALF.
    Every business topic inherits the full seven-part shape — Objective, Task, Constraints,
    Deliverable, Acceptance criteria, Metrics, Reflection questions. Track E asks for "practical
    exercises"; BR-067 applies the shape to every substantial concept without excepting business
    ones; and four of the brief's own fourteen metric types are business metrics.
  why_it_is_stated_at_top_level: >-
    This requirement is DERIVED rather than bulleted, and it is routinely dropped, because
    business content has a strong genre pull toward narrative playbook. Naming the two track files
    explicitly closes the gap: `tracks/micro-saas.md` carries the kill criteria and the pain
    scoring, which are the single most playbook-prone content in the repository, and it is not a
    `business` schema file.
  checkable_form: "Any file matching applies_to that contains a topic with a Deliverable but no Acceptance criteria, Metrics or Reflection questions section fails check-schema. Absence of a Metrics section is permitted ONLY where the exercise states why no metric is meaningful."

exercise_scope_resolution:
  # RESOLUTION OF R8 AMBIGUITY #8 — the largest sizing ambiguity in the brief.
  ambiguity: >-
    "Every substantial concept needs an exercise" (the 7-part shape) versus 112 track topics plus
    30 triage technologies, versus a 15 h/week budget the brief separately insists must be real.
  step_1_the_literal_reading_does_not_fit:
    arithmetic: "112 track topics x the 7-part shape at even 1.5h each = 168h — 93% of the entire 180h programme, leaving 12h to build anything. Adding the 30 technologies gives 213h, more than the programme has."
    conclusion: "The literal reading is arithmetically impossible against BR-139/BR-140, which forbid a fantasy schedule. Both mandates cannot hold literally."
  step_2_p0_alone_still_does_not_fit:
    arithmetic: "87 of 116 concept rows are P0. 87 x 1.5h = 130.5h = 72.5% of the programme. STILL DOES NOT FIT."
    conclusion: >-
      THIS IS THE STEP THE FIRST DRAFT OMITTED, and omitting it made the resolution look
      unjustified: the stated arithmetic proved the PROBLEM and never proved the SOLUTION.
      Triage alone is not the lever. Restricting to P0 removes only 29 of 116 rows, because this
      programme deliberately treats all six brief-named topic lists as mandatory (see
      ambiguity_02_03_may_vs_must) and most named topics genuinely are essential.
  step_3_the_actual_lever_is_compositing:
    principle: >-
      ONE EXERCISE PROVES SEVERAL CONCEPTS. This is not a budgeting trick — it is how the concepts
      actually occur. Idempotency, retries, resumability, consistency, transactions and failure
      recovery are not six separable lessons; they are six views of one artifact, and separating
      them would teach them as trivia. W03's replay-and-kill exercise proves all six in 3.5h.
    measured_ratio:
      p0_concepts: 87
      p0_distinct_deliverables: 38
      p0_ratio: 2.29
      p0_plus_p1_concepts: 111
      p0_plus_p1_distinct_deliverables: 42
      p0_plus_p1_ratio: 2.64
      method: "Computed from the file: the set of distinct values of `mastery_check_ref` across all P0 (then P0+P1) concept rows. Reproducible by any checker."
    resulting_load: "42 exercise-bearing deliverables covering 111 P0 and P1 concepts, against 142 under the literal reading. That is the reduction, and compositing rather than triage supplies roughly two thirds of it (triage removes 31 of the 100-unit reduction, compositing 69)."
    supersedes: >-
      An earlier draft claimed "roughly 45–55 exercises". THAT FIGURE WAS UNSOURCED and reconciled
      with neither the 81 deliverable ids in this file nor the 42 that actually carry P0/P1
      coverage. It is withdrawn and replaced by the computed figure. NOTHING IS DROPPED FROM THE
      CURRICULUM by this correction — it is a presentation fix to the justification for canon's
      largest resolution, and that justification should be checkable rather than asserted.
    distribution_of_the_38: "w01 4, w02 3, w03 2, w04 4, w05 2, w06 3, w08 2, w09 1, w10 2, w11 3, w12 3, m01 1, m02 1, m03 1, m04 2, m05 2, m07 1, m09 1. No single deliverable carries more than six P0 concepts; the densest is D-w03-1."
  bands:
    - band: "P0 — essential"
      concept_rows: 87
      rule: "MUST be exercised. Every P0 concept carries a non-empty `mastery_check_ref` resolving to a deliverable id, which makes coverage CHECKABLE rather than asserted. Exercises are COMPOSITE by design."
    - band: "P1 — high value"
      concept_rows: 24
      rule: "Exercised WHERE IT SHARES A SURFACE with a P0 exercise, folded in as an additional acceptance criterion rather than as a separate exercise. All 24 carry a mastery_check_ref; they add only 4 distinct deliverables beyond P0's 38."
    - band: "P2 — optional / context dependent"
      concept_rows: 5
      members: ["C-042 migrations", "C-043 API evolution", "C-101 agency subcontracting", "C-109 landing page tests", "C-111 pre-sales"]
      rule: "NO exercise. One ADR, note or glossary entry, each carrying a `p2_reason` — which the brief mandates for major P2/P3 decisions."
    - band: "P3 — deliberately defer"
      concept_rows: 0
      zero_is_structural_not_an_oversight: >-
        NO TRACK CONCEPT CAN BE P3 BY CONSTRUCTION. ambiguity_02_03_may_vs_must resolves all six
        brief-named topic lists as MANDATORY AND COVERED IN FULL, so a row that exists in this
        file is a row the brief named and canon committed to covering. Deferring one would be
        exactly the quiet dropping that resolution exists to prevent. The first draft named P3
        members — "the sixteen non-revised GoF patterns, consensus internals, CRDTs" — that ARE
        NOT CONCEPT ROWS AT ALL, which left the band empty in the set it claimed to triage. The
        band is real; it simply operates over a DIFFERENT SET.
      operates_over: "Patterns, technologies and glossary terms — not track concepts."
      members:
        patterns: {count: 15, detail: "8 recognition-only GoF plus 7 named actively harmful to cargo-cult."}
        technologies: {count: 2, detail: "The two SKIP FOR NOW rows: Redis, policy engines."}
        glossary_recognition_only: {count: 3, detail: "Consensus internals; CRDTs / vector clocks / quorum / CAP; event sourcing and CQRS."}
        low_roi_rows: {count: 23, detail: "6 answering the brief's obsolete-learning challenges verbatim, plus 17 additional, each with a stated verdict and reasoning."}
        total: 43
  technology_rule:
    LEARN DEEPLY: {count: 4, rule: "Full 7-part exercise.", members: ["coding agent harness design", "Postgres", "BM25", "distributed systems fundamentals"]}
    LEARN ENOUGH TO USE: {count: 15, rule: "Folded into an existing exercise as an acceptance criterion. No standalone exercise."}
    UNDERSTAND CONCEPT ONLY: {count: 9, rule: "Glossary or ADR line. No exercise."}
    SKIP FOR NOW: {count: 2, rule: "Glossary line plus a low_roi[] row where the deferral is contestable. No exercise."}
  honesty_note: >-
    This resolution REINTERPRETS "every substantial concept" as "every P0 and P1 concept, proved
    by a composite exercise". Two things are stated rather than performed silently, so a reviewer
    can disagree with the reading rather than having to discover it: the reinterpretation itself,
    and the fact that compositing — not triage — is what makes the budget close. A resolution
    whose arithmetic only demonstrates the problem is not a resolution.

# ---------------------------------------------------------------------------
# ARCHITECTURE REVIEWS — 14 defect classes, 2 supplied bad systems, both brief modes.
# exercises/architecture-reviews.md is the ONLY home for the defect classes and
# the supplied systems.
# ---------------------------------------------------------------------------

arch_reviews:
  home_file: "exercises/architecture-reviews.md"
  modes: ["self-inspection", "supplied deliberately bad system"]
  reviews:
    - {id: "AR-01", week: "W04", mode: "self-inspection", target: "The platform through S2", output: "D-w04-3", note: "Conducted WITH the versioned generated-code review checklist authored the same week; the checklist is the instrument and the ADR is the result."}
    - {id: "AR-02", week: "W08", mode: "supplied deliberately bad system", target: "SUP-01", output: "D-w08-2", note: "The brief asks for deliberately bad systems, not only self-inspection. This is the review that demonstrates the ability to FIND defects rather than to describe one's own choices favourably."}
    - {id: "AR-03", week: "W12", mode: "self-inspection", target: "The full platform through S7b", output: "D-w12-3", note: "Conducted with the five-axis multi-axis review rubric. Must name at least two ACCEPTED defects with a remediation month — a clean bill of health is the least credible possible output."}
  defect_classes:
    count: 14
    rows:
      - {id: "DC-01", name: "unnecessary abstractions", detection_question: "Does this interface have exactly one implementation and no second one in prospect? Speculative generality was justified by 'changing it later is expensive'; later is now cheap, so the rule of three got STRONGER, not weaker."}
      - {id: "DC-02", name: "accidental coupling", detection_question: "If I deleted this module and regenerated it from its contract alone, what would the regeneration get wrong? Every answer names a coupling the type system does not show."}
      - {id: "DC-03", name: "shallow modules", detection_question: "What is the ratio of public symbols to implementation size? A module whose interface is as large as its body has hidden nothing and buys nothing."}
      - {id: "DC-04", name: "wrong boundaries", detection_question: "Does a single behaviour change require edits in two modules? Then the boundary is in the wrong place regardless of how clean each side looks."}
      - {id: "DC-05", name: "primitive obsession", detection_question: "Is a domain concept carried as a bare str or int? Under generated code this costs more than it used to: a frozen newtype carries semantics to the agent AT THE CALL SITE, and a bare str carries none."}
      - {id: "DC-06", name: "duplicated logic", detection_question: "Is the duplicated thing an IMPLEMENTATION or a DECISION? Duplicated implementations are now cheap and often preferable. Duplicated DECISIONS — a business rule, a key format, a transition table, a retry classification — are as dangerous as ever and MORE so, because three copies get regenerated separately and drift silently."}
      - {id: "DC-07", name: "incorrect state modeling", detection_question: "Is there a state the code can reach that the transition table does not list? Is there a listed transition no code performs? Both are defects and only the first is usually looked for."}
      - {id: "DC-08", name: "non-idempotent operations", detection_question: "What happens on the second call? Ask it of every side-effecting function, because the test suite asked it of none."}
      - {id: "DC-09", name: "hidden distributed transactions", detection_question: "Does any code path commit locally and then call an external system? That is a crash window, and no test that does not kill the process between those two statements will ever find it."}
      - {id: "DC-10", name: "race conditions", detection_question: "What happens if two of these run at once? Specifically: is there a read-modify-write with no conditional update, version column or row lock? An agent writes read-modify-write by default because it is the readable form."}
      - {id: "DC-11", name: "failure recovery problems", detection_question: "If the process holding this work dies, who notices and how? If the answer is a timeout, what distinguishes slow from dead — and what happens if the answer is wrong?"}
      - {id: "DC-12", name: "unbounded retries", detection_question: "Is there an AGGREGATE budget, or only per-layer counts? Three layers retrying three times each is twenty-seven calls to a service already failing. And under a flat-rate plan the failure mode is a silent stall, not an error."}
      - {id: "DC-13", name: "authorization leaks", detection_question: "Is the permission check applied BEFORE or AFTER ranking, filtering or counting? Post-filtering leaks existence through result count, latency and ranking even when the content is withheld — and a test asserting 'no unauthorized content returned' passes anyway."}
      - {id: "DC-14", name: "excessive agent permissions", detection_question: "Does this agent hold the UNION of every permission any of its steps ever needed? Can a low-privilege step cause a high-privilege step to act without re-checking the original human request?"}
  supplied_systems:
    count: 2
    rows:
      - id: "SUP-01"
        name: "The optimistic task runner"
        used_in: "AR-02 (W08)"
        description: "A small Python task-processing service, roughly 400 lines, that reads jobs from a table, calls two external APIs and writes results back. It is idiomatic, well-named, fully type-annotated, has 90% test coverage and passes every linter — and it is broken in at least six of the fourteen ways."
        planted_defects: ["DC-08 — the external create has no idempotency key and no natural key", "DC-09 — commit then HTTP call, in that order, with a comment claiming atomicity", "DC-10 — a read-modify-write on a counter with no version column", "DC-12 — a retry decorator on a function that itself calls a retrying client", "DC-06 — the same status-transition rule encoded in three places", "DC-03 — a 'repository' that re-exports twelve ORM methods unchanged"]
        design_note: "The defects are planted so that READING THE CODE does not find them. Every one requires asking one of the four questions — second call, crash window, concurrency, unstated external assumption. That is the point: the review skill this exercise builds is exactly the one generated code makes necessary."
      - id: "SUP-02"
        name: "The helpful knowledge assistant"
        used_in: "Reserve — month 06, or as an AR-02 substitute if SUP-01 is exhausted"
        description: "A retrieval-backed question-answering service, roughly 300 lines, serving two tenants from one index. Clean, readable, tested."
        planted_defects: ["DC-13 — post-filtering by permission after a top-k vector search", "DC-14 — one broad API token shared by the ingestion path and the answering path", "DC-05 — tenant ids as bare strings, interchangeable at every call site", "DC-01 — a pluggable 'RetrieverStrategy' interface with one implementation"]
        design_note: "Deliberately the SAME defect shape as the learner's own SKA, seen from the outside. Recognising in someone else's code the mistake you were shown in your own is a different and harder skill than avoiding it once."

checkpoints:
  home_file: "reference/portfolio.md"
  rule: "Every checkpoint carries a decision_question and evidence_ids. Evidence is deliverable ids, never a self-assessment. 'I studied it' is never evidence."
  rows:
    - id: "CP-M3"
      month: "M03"
      decision_question: "Can I operate coding agents materially better than an ordinary senior developer?"
      evidence_ids: ["D-w01-1", "D-w03-1", "D-w04-1", "D-w07-1", "D-w08-1", "D-w09-1", "D-w10-1", "D-w12-1"]
      measurable_evidence: "An unattended pipeline that takes a real Sentry issue to a reviewed PR; a durable state machine proved effectively-once under 100 killed replays; N concurrent agents proved not to strand or duplicate under a 30% kill rate; a regression gate that blocks a merge on a justified statistical threshold. An ordinary senior developer using a coding agent interactively has none of these."
      passes_on: "PROCESS EXECUTED, not calls booked. The business column at M3 is expected to show roughly 2.5 replies and probably zero calls; that is the plan working as predicted, not the checkpoint failing. Stated in phases/phase-01-foundations.md at week 1."
    - id: "CP-M6"
      month: "M06"
      decision_question: "Can I build production-grade AI workflows with evals, security and observability?"
      evidence_ids: ["D-m02-1", "D-w10-1", "D-w11-2", "D-m03-1", "D-m04-1", "D-m05-2", "D-m06-1"]
      measurable_evidence: "A retrieval system with measured NDCG@5 against a frozen label set and a pre-filter authorization proof; an attack report with measured success rates before and after structural mitigations, including memory poisoning against a real memory surface; OTel traces with cost and quota attribution; a three-tier regression gate."
    - id: "CP-M9"
      month: "M09"
      decision_question: "Can I solve a real company's automation problem end-to-end?"
      evidence_ids: ["D-m07-1", "D-m07-2", "D-m09-1", "D-m09-2"]
      measurable_evidence: "A completed pilot with a MEASURED before/after baseline at a real external party, written up as a case study. If the funnel did not produce one, the honest answer at this checkpoint is 'not yet, and here is the measured reason' — with the actual reply rate and its denominator — rather than a simulated substitute presented as an answer."
      contingency_note: "This is the checkpoint most exposed to the corrected funnel. Its evidence requirement is deliberately not satisfiable by simulated work."
    - id: "CP-M12"
      month: "M12"
      decision_question: "Do I have enough repeated customer evidence to: pursue consulting, productize an offer, build a micro-SaaS, or stay primarily on the Staff/AI Engineer path?"
      decision_options: ["pursue consulting", "productize an offer", "build a micro-SaaS", "stay primarily on the Staff/AI Engineer path"]
      evidence_ids: ["D-m07-1", "D-m07-3", "D-m08-2", "D-m09-1", "D-m09-2", "D-m11-1"]
      evidence_note: >-
        REWRITTEN AT G8. The earlier list was ["D-m09-2", "D-m11-1", "D-m12-1"] and had two defects.
        First, D-m12-1 IS "M12 checkpoint decision with its evidence pack" -- the checkpoint cited its own
        output as its own input, against checkpoints.rule ("Evidence is deliverable ids, never a
        self-assessment"). Second, of the four decision options TWO had no cited evidence at all: pursue
        consulting needs D-m07-3 and D-m09-1, productize needs D-m08-2, and all three existed in canon
        while being absent from the list. Read literally, half the four-way decision was unanswerable from
        its own evidence pack.
      reachability_note: >-
        STATED PLAINLY BECAUSE THE EVIDENCE LIST SHOULD ENCODE IT RATHER THAN CONTRADICT IT. Under this
        programme's own arithmetic -- P(zero calls across all 52 sends) = 53.9% at the band midpoint,
        23.3% even at the ceiling -- three of the four options are structurally unreachable without a
        discovery call: consulting needs money to have changed hands, productize needs the same work
        delivered twice, and micro-SaaS needs eight interviews plus three pilot-willing users plus a
        payment. THE STAFF / AI-ENGINEER PATH IS THE ONLY BRANCH WHOSE EVIDENCE THIS PROGRAMME CAN PRODUCE
        ENTIRELY ON ITS OWN, and it is a first-class outcome rather than a consolation. In the modal case
        the M12 decision is therefore substantially determined before month one -- which is a disclosed
        design position, not an accident, and the four-way framing should not imply otherwise.
      measurable_evidence: "Per option: consulting requires at least one Stage-3 paid engagement; productizing requires the same shape of work delivered at least twice; micro-SaaS requires all seven evidence thresholds met; the Staff path requires the portfolio's ten items complete with their credibility statements satisfied. THE STAFF PATH IS A FIRST-CLASS OUTCOME, not a consolation — it is the only one of the four whose evidence the programme can produce entirely on its own."

# ---------------------------------------------------------------------------
# RESOURCES — 15. Every row carries the brief's four mandated fields.
# "Recommend a small number of high-value resources; avoid giant lists."
# ---------------------------------------------------------------------------

resources:
  count: 15
  home_file: "resources/recommended-resources.md"
  mandated_fields: ["what_to_learn", "which_sections", "which_project", "which_exercise_proves_it"]
  locator_rule: >-
    EVERY ROW ALSO CARRIES A `locator` — a URL, or a URL and an ISBN for a book. The four fields
    above are the brief's; the locator is not, and it was added because the list without one was
    unreachable: every theory task in all twelve weeks now cites a RES- id, and an id that resolves
    to a title and no address makes the learner do the finding. Where the identifier could not be
    verified against a primary source, the locator is a SEARCH rather than a fabricated permalink,
    and `locator_note` says so — the same discipline tracks.D.identifier_policy applies to the
    OWASP numbering and projects.platform.architectural_constraint_s0.unresolved applies to the
    second harness's terms page.
  selection_principle: "Prefer PRIMARY documentation and classic engineering material. Catalogues (enterprise-pattern books, integration-pattern books) are REFERENCE, not reading: correct usage is targeted lookup of named patterns, perhaps 45 minutes total, and reading either cover to cover inside a 39h track would displace a book that repays itself."
  rows:
    - id: "RES-01"
      locator: "https://docs.claude.com/en/docs/claude-code/cli-reference and https://github.com/openai/codex"
      title: "Harness invocation primary documentation — both harnesses"
      kind: "primary docs"
      what_to_learn: "The exact non-interactive invocation semantics, permission-mode flags, and the OAuth-versus-API-key authentication boundary that the entire cost architecture rests on; and the counterpart harness's non-interactive mode with its approval-triggers-failure semantics."
      which_sections: "Basic usage; bare mode; the authentication and credential-use section of the legal and compliance page. For the second harness: usage, authentication, and the non-interactive limitation section."
      which_project: "The harness adapter (S0, W01) and the cross-harness comparison (S8, M04)."
      which_exercise_proves_it: "D-w01-1 — a working unattended OAuth-backed run with a captured transcript; plus the W01 stretch, which runs the same task through the second harness and records where its approval failure surfaces."
      volatile: true
    - id: "RES-02"
      locator: "Google Scholar, exact title: https://scholar.google.com/scholar?q=%22Stop+Comparing+LLM+Agents+Without+Disclosing+the+Harness%22"
      locator_note: "A search rather than a permalink: the arXiv identifier was never checked against a primary source, and this repository does not print an identifier it has not verified."
      title: "Stop Comparing LLM Agents Without Disclosing the Harness"
      kind: "paper"
      what_to_learn: "That the loop around a model changes outcomes more than the model does — the paper reports identical code quality at a 32x cost spread purely from harness differences — and the methodology for isolating harness effects from model effects."
      which_sections: "The empirical comparison showing cost and quality spread under a fixed model with varied harness."
      which_project: "Designing the month-04 cross-harness comparison so it measures harness effect rather than accidentally re-measuring model choice."
      which_exercise_proves_it: "D-m04-1 — a pinned-model, varied-harness comparison whose run metadata proves the model id was fixed."
    - id: "RES-03"
      locator: "https://www.anthropic.com/engineering/building-effective-agents"
      title: "Building Effective Agents (the workflows-versus-agents framing)"
      kind: "essay"
      what_to_learn: "The control-flow ownership distinction: workflows orchestrate the model through predefined code paths so the engineer owns every branch; agents let the model direct its own process so the engineer owns the goal and the guardrails. Short, and the single highest-leverage read in week 1."
      which_sections: "Read in full — it is short."
      which_project: "The W01 pipeline architecture decision, which determines which stages get durable-state-machine treatment at all."
      which_exercise_proves_it: "D-w01-4 — a stage-by-stage classification from which a reviewer can predict, for any stage, what happens on its failure: replay or re-prompt."
      freshness_note: "A design-philosophy piece rather than an API reference, so drift risk is low despite its age."
    - id: "RES-04"
      locator: "https://docs.temporal.io/activities"
      title: "Temporal documentation — Activities and Activity Definition"
      kind: "primary docs"
      what_to_learn: "How a mature system states the guarantee: an activity may physically execute more than once while still being OBSERVED AS COMPLETED EXACTLY ONCE, because the guarantee lives in the durable log and not the function body. Read for CALIBRATION, not for concepts already held."
      which_sections: "Retry policies and idempotency only. Skip all SDK-specific chapters."
      which_project: "Validating the hand-built S1a/S1b state machine against a reference implementation."
      which_exercise_proves_it: "D-w03-1, plus a mapping table stating what the reference system solves that the hand-built one does not — cross-process worker fleets, versioning running workflows — and whether that gap matters at this scale."
    - id: "RES-05"
      locator: "https://modelcontextprotocol.io/specification"
      title: "Model Context Protocol specification, revision 2026-07-28"
      kind: "primary spec"
      what_to_learn: "The stateless-core discipline: the initialize handshake and session-id header are retired, requests are self-contained with per-request capability negotiation, and application state persists via explicit handles in tool arguments. Read AFTER building the state machine, so the pattern is recognised rather than learned cold."
      which_sections: "The stateless-request change; the multi-round-trip request pattern; the feature-lifecycle policy. Skip the extension wire formats."
      which_project: "The hand-built queue's task-state design, and any later tool-server integration."
      which_exercise_proves_it: "D-w02-1 — a state machine that carries task state explicitly rather than relying on a sticky session, which is the same discipline the spec adopted."
      volatile: true
    - id: "RES-06"
      locator: "https://qdrant.tech/articles/vector-search-filtering/"
      title: "Vector-search filtering: pre-filter versus post-filter"
      kind: "vendor engineering articles"
      what_to_learn: "Why post-filtering is simultaneously a correctness bug and a disclosure vulnerability, and how filtered ANN traversal is done correctly — payload indexes extending the graph so traversal stays inside the permitted subset, with a planner choosing by filter cardinality."
      which_sections: "The complete filtering guide and the pre-versus-post-filtering article."
      which_project: "SKA-S0 (W05) and SKA-S1 (W06)."
      which_exercise_proves_it: "D-w05-2 — a reproducible failing post-filter case plus a test asserting pre-filter always returns exactly k authorized results when k exist."
    - id: "RES-07"
      locator: "https://www.pinecone.io/learn/offline-evaluation/"
      title: "Retrieval evaluation metrics"
      kind: "vendor learning material"
      what_to_learn: "Precision@k, recall@k, MRR and NDCG@k, and specifically why rank-blind metrics let a system pass while its reranker puts the best answer at position five. Plus the eval-set-before-tuning discipline, which is the highest-leverage concept in the track for a from-zero baseline."
      which_sections: "Offline evaluation measures in information retrieval; evaluation metrics for search and recommendation."
      which_project: "SKA-S0 and SKA-S1."
      which_exercise_proves_it: "D-w06-1 — metrics per configuration against a label set provably frozen before the first tuning change."
    - id: "RES-08"
      locator: "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B and https://huggingface.co/BAAI/bge-reranker-v2-m3"
      title: "Local embedding and reranker model cards"
      kind: "primary model documentation"
      what_to_learn: "How to select, run and evaluate pretrained retrieval models as black boxes with known contracts, published scores AND LICENCES — under a zero-euro constraint and on a laptop."
      which_sections: "The recommended embedding model's card (parameters, disk size, benchmark mean); the recommended reranker's card and its Apache licence; the cross-encoder efficiency documentation."
      which_project: "SKA-S0 embeddings, SKA-S1 reranking."
      which_exercise_proves_it: "D-w06-1 — measured reranking lift and p50/p95 latency from a local CPU run."
      hard_constraint: "One widely-recommended multilingual reranker is CC-BY-NC-4.0 — NON-COMMERCIAL — and must not be recommended in a public-capable repository or used for client work. Licence is a selection criterion here, not a footnote."
      volatile: true
    - id: "RES-09"
      locator: "https://opentelemetry.io/docs/specs/semconv/gen-ai/"
      title: "OpenTelemetry GenAI semantic conventions"
      kind: "primary spec"
      what_to_learn: "The current operation-name vocabulary and the agent, tool and model span shapes — and the discipline of PINNING A VERSION rather than memorising attribute names."
      which_sections: "The operation-name values, the agent and tool span structure, and the token-usage attributes. Check the stability badge on every attribute you use."
      which_project: "S5 instrumentation (W09) and S6 trace evaluation (W10)."
      which_exercise_proves_it: "D-w09-1 — one connected trace per run with correct parent-child nesting and token counts matching provider-reported usage, exported against a pinned convention version recorded in run metadata."
      volatile: true
      volatility_note: "ENTIRELY Development status; nothing Stable. Moved to a dedicated repository in mid-2026 with no tagged stable release. This belongs in the ecosystem snapshot with a re-verify date, not stated flatly as settled."
    - id: "RES-10"
      locator: "Google Scholar, by topic: https://scholar.google.com/scholar?q=llm-as-a-judge+position+bias+chance-corrected+agreement"
      locator_note: "A topic search, deliberately. The reliability literature here is several papers rather than one, and naming a single identifier would misrepresent a body of work as a citation."
      title: "LLM-as-judge reliability research"
      kind: "paper"
      what_to_learn: "That reproducibility is not validity: a judge can have very high test-retest reliability and substantial position bias simultaneously. Also that raw exact-match agreement substantially overstates chance-corrected agreement, and that position bias spans orders of magnitude across judges and is not reliably reduced by longer-thinking architectures."
      which_sections: "The minimum viable validation protocol."
      which_project: "The W10 judge prompt and threshold design."
      which_exercise_proves_it: "D-w10-1 — a threshold that is a stated statistical bound with a written justification and a stated re-baselining condition, rather than 'everything must pass'."
    - id: "RES-11"
      locator: "https://genai.owasp.org/ — download the PDF, not a vendor summary of it"
      title: "OWASP Top 10 for Agentic Applications 2026 (the PDF itself, not a vendor summary)"
      kind: "primary standard"
      what_to_learn: "The agentic threat categories relevant to this build — goal hijack, tool misuse, identity and privilege abuse, memory and context poisoning — with their own mitigations, so an attack report can cite named mitigations rather than assert improvements. Also the least-agency framing: deploying agentic behaviour where it is not needed expands the attack surface without adding value."
      which_sections: "ASI01, ASI02, ASI03 and ASI06, plus the leads' letter for the least-agency framing."
      which_project: "S7a/S7b and BOA-S2."
      which_exercise_proves_it: "D-w11-2, D-w12-2 and D-m05-2 — each mapping its mitigation to a named category mitigation."
      hard_constraint: "CITE THE PDF, NOT A VENDOR SUMMARY. The ASI identifiers are verified and may be stated. LLM0x identifiers MUST NOT be stated — see tracks.D.identifier_policy."
      volatile: true
    - id: "RES-12"
      locator: "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/"
      title: "The lethal trifecta for AI agents"
      kind: "practitioner essay"
      what_to_learn: "Private data plus untrusted content plus an outbound channel equals exfiltration risk regardless of prompt care — and therefore that the fix is to remove a leg structurally, not to filter."
      which_sections: "The whole post; it is short."
      which_project: "The BOA and the SKA answering path."
      which_exercise_proves_it: "D-w11-2 — an exfiltration attempt whose report states explicitly whether the fix broke a leg or merely filtered."
      attribution_note: "An independent framing widely adopted in practice, NOT an OWASP identifier. Attribute it as such."
    - id: "RES-13"
      locator: "https://dataintensive.net — ISBN 978-1-4493-7332-0"
      title: "Designing Data-Intensive Applications"
      kind: "book"
      what_to_learn: "The operational reality of partial failure and the precise vocabulary for delivery-versus-processing guarantees. Read for CALIBRATION against concepts already held, not to acquire them."
      which_sections: "Chapter 8 'The Trouble with Distributed Systems' FIRST — unreliable networks and clocks, timeouts as the only failure detector, process pauses, fencing tokens; it is the direct antidote to the concept-strong / operation-weak gap. Then chapter 7 'Transactions' — isolation levels, lost update, write skew — the most immediately usable, Postgres-facing chapter. Then chapter 9's two-phase-commit section ONLY, to understand why distributed transactions are unavailable and therefore why the outbox exists. Then chapter 11's fault-tolerance section for the honest treatment of exactly-once. SKIP chapters 5, 6, 10 and 12 entirely."
      which_project: "S1a/S1b (W02–W03) and the month-04 outbox."
      which_exercise_proves_it: "D-w03-1 and the month-04 crash-window exercise (EXT-01)."
    - id: "RES-14"
      locator: "https://web.stanford.edu/~ouster/cgi-bin/book.php"
      title: "A Philosophy of Software Design"
      kind: "book"
      what_to_learn: "The deep-module thesis and information hiding — which become MORE load-bearing under generated code, not less. A roughly two-hour read with an unusually high usable-ideas-per-page ratio."
      which_sections: "Chapter 4 'Modules Should Be Deep'; chapter 5 'Information Hiding (and Leakage)'; chapter 8 'Pull Complexity Downwards'; chapter 11 'Design it Twice' — read with the observation that designing twice is nearly free when generation is cheap; chapter 13 on comments as design records."
      which_project: "The harness adapter boundary and the platform's module structure."
      which_exercise_proves_it: "D-w02-2 — the boundary regeneration test, which is a DIRECT EMPIRICAL TEST of the book's central claim. Running it against the interface-versus-implementation framing is the highest-value hour in Track B."
    - id: "RES-15"
      locator: "https://pragprog.com/titles/mnee2/release-it-second-edition/"
      title: "Release It!"
      kind: "book"
      what_to_learn: "How systems actually fail in production. This is the OPERATE half of the competency gap and the half no concept reading fixes."
      which_sections: "Part I's stability antipatterns — integration points, cascading failures, blocked threads, slow responses, unbounded result sets — and the stability patterns: timeouts, circuit breaker, bulkheads, fail fast, steady state, handshaking, back pressure. Nothing else required."
      which_project: "The three gateways (month 04) and W09's rate limiting and unbounded-retry defenses."
      which_exercise_proves_it: "D-w08-1 (the chaos run) and D-w09-2 (the cost-exhaustion exercise)."
  deliberately_excluded:
    - {title: "Enterprise application architecture and integration pattern catalogues", reason: "Catalogues are REFERENCE, not reading. Correct usage is targeted lookup — idempotent receiver, guaranteed delivery, competing consumers, dead letter channel, correlation identifier; gateway, service layer, repository, transaction script, optimistic offline lock — perhaps 45 minutes total. Reading either cover to cover inside 39 hours would displace one of the three books above and would not repay it. A reference-shelf entry with named lookups is the correct treatment and is what resources/recommended-resources.md provides."}

# ---------------------------------------------------------------------------
# ANTI-GOALS — 12. TWO ARE CONDITIONAL and a flat ban-check misreads them.
# ---------------------------------------------------------------------------

anti_goals:
  count: 12
  conditional_handling:
    rule: "check-antigoals MUST NOT hard-ban the strings 'LeetCode' or 'Kubernetes'. Both anti-goals are CONDITIONAL bans on a REASON, not on a word."
    leetcode: "Barred UNLESS justified for the objective. The repository may name it, and does — in low_roi[] LR-07 with the reasoning that nobody in a cold-outreach funnel for AI engineering capability runs a whiteboard algorithm screen. A flat ban would make canon's own honest treatment of the question a lint failure."
    kubernetes: "Barred ONLY when the reason is 'industry standard'. The brief separately asks 'Do I need Kubernetes?' as an open question that must be ANSWERED, which requires naming it. low_roi[] LR-05 answers it: no surface now, roughly two weeks to learn later WITH a real surface if a client requires it. The checker must match the JUSTIFICATION pattern, not the token."
    implementation: "check-antigoals flags an occurrence of either token only when it appears without an adjacent justification or deferral statement within the same section. The two low_roi[] rows are registered as permitted occurrences."
  rows:
    - {id: "AG-01", anti_goal: "a generic roadmap", conditional: false, positive_form: "Every week names a runnable demo command and a measured number. A week that could be pasted into another person's plan unchanged has failed."}
    - {id: "AG-02", anti_goal: "a giant list of technologies", conditional: false, positive_form: "30 technologies, each with one of four verdicts and a sequencing note. tracks/*.md open ARTIFACT-FIRST — what the hours buy — and only then list concepts. For a senior developer the concepts are largely known and the artifacts are the portfolio evidence they lack, which makes artifact-first both the stronger justification for the hours and the better defense against this anti-goal."}
    - {id: "AG-03", anti_goal: "vague \"learn X\" recommendations", conditional: false, positive_form: "Every P0 concept carries a mastery_check_ref pointing at a deliverable id. A concept with no exercise and no ADR is a P2 or P3 with a stated reason."}
    - {id: "AG-04", anti_goal: "50 books", conditional: false, positive_form: "15 resources, three of them books, each with what to learn, which sections, which project and which exercise proves it — plus an explicit exclusion note for the two catalogues that are reference rather than reading."}
    - {id: "AG-05", anti_goal: "tutorial projects like basic chatbots", conditional: false, positive_form: "Three production-like projects with real integrations: a real GitHub repository, a real Notion workspace, and real historical Sentry issues from the user's own project."}
    - {id: "AG-06", anti_goal: "motivational filler", conditional: false, positive_form: "Word CEILINGS as well as floors on every schema. A paragraph that would survive being deleted should be deleted."}
    - {id: "AG-07", anti_goal: "arbitrary certifications", conditional: false, positive_form: "Evidence is a runnable artifact or a measured number. No certification appears anywhere in the portfolio or the competency matrix."}
    - {id: "AG-08", anti_goal: "LeetCode unless you can justify it for the objective", conditional: true, condition: "Permitted IF justified for the objective.", positive_form: "Answered in low_roi[] LR-07 with the funnel reasoning, and left open as a conditional should the month-12 decision turn toward a role with an algorithmic screen."}
    - {id: "AG-09", anti_goal: "Kubernetes merely because it is \"industry standard\"", conditional: true, condition: "Barred only when the reason is 'industry standard'.", positive_form: "Answered in low_roi[] LR-05: zero surface on one node with one Postgres and git worktrees; roughly two weeks to learn later with a real surface if a client requires it. Docker IS taught, narrowly, for Postgres and for the W12 sandbox — which is the actual operational need."}
    - {id: "AG-10", anti_goal: "ML theory unrelated to building production AI systems", conditional: false, positive_form: "Answered in low_roi[] LR-03. The rigorous quantitative content in this programme is EXPERIMENTAL DESIGN — frozen eval sets, chance-corrected agreement, pass-rate thresholds over N reruns — not model mathematics."}
    - {id: "AG-11", anti_goal: "\"build a todo app with AI\"", conditional: false, positive_form: "The flagship consumes real tasks and real incidents and produces reviewed pull requests against a real repository. Every stage has a runnable demo command and a stated exit criterion."}
    - {id: "AG-12", anti_goal: "passive learning without deliverables", conditional: false, positive_form: "Theory is capped at 3.5h per week and 19.4% overall against a 25–30% ceiling; active work is 80.6% against a 70% floor. Every week's deliverables are checkboxes and every acceptance criterion is a binary predicate, a number or an artifact path. 'I watched/read/studied X' is never completion, and 'I studied it' is never evidence."}

# ---------------------------------------------------------------------------
# SCOREBOARD — 22 metrics: 7 engineering / 7 agent harness / 8 business.
# `unit` MAY BE COMPOSITE. G2 derives its assertion from len(), never a literal.
# ---------------------------------------------------------------------------

scoreboard_metrics:
  count: 22
  home_file: "SCOREBOARD.md"
  groups: ["Engineering", "Agent harness", "Business"]
  weekly_row_format:
    format: "<week id> | <ISO date> | <reading> | evidence_source: real|simulated"
    example: "W01 | 2026-09-06 | 10 prospects researched, 0 sends | evidence_source: real"
    rule: >-
      ONE LINE PER WEEK, appended inside that metric's user:actuals region, newest last. The four
      fields are positional and pipe-separated so a month-end pull can read them without a parser
      and without a convention held only in the author's head. The week id is the anchor — the
      programme runs on week-files, not on calendar weeks, so a date alone cannot say which week a
      reading belongs to. `evidence_source` is mandatory on every Business row and permitted
      nowhere else to be omitted.
    render_note: >-
      One line per week, newest last, four positional fields, so a month-end pull needs no parser.
      The week id is the anchor: this programme runs on week-files, not calendar weeks. "The week's
      funnel row" in a criterion means SM-15, SM-16, SM-17 or SM-18 in this shape.
    funnel_rows: ["SM-15", "SM-16", "SM-17", "SM-18"]
    funnel_rows_note: >-
      "The week's funnel row" in an acceptance criterion means these rows, in this format. Before
      this block the phrase named a shape that existed nowhere, and a criterion pointing at an
      undefined shape cannot evaluate.
  update_rule: "Weekly logging must NEVER require touching YAML. The user writes into <!-- user:actuals --> regions in SCOREBOARD.md; gen-derived writes outside those regions only and preserves their contents BYTE-FOR-BYTE, reattaching them by stable metric id. A region whose key no longer exists is emitted to an `## Orphaned entries` section rather than dropped or silently misaligned."
  rows:
    - {id: "SM-01", group: "Engineering", name: "production-like projects completed", unit: "count", source_artifact: "projects/*.md stage exit criteria", cadence: "monthly", evidence_source: "real"}
    - {id: "SM-02", group: "Engineering", name: "ADRs written", unit: "count", source_artifact: "the ADR collection (PF-04)", cadence: "monthly", evidence_source: "real"}
    - {id: "SM-03", group: "Engineering", name: "agent workflows built", unit: "count", source_artifact: "projects.platform.pipelines", cadence: "monthly", evidence_source: "real"}
    - {id: "SM-04", group: "Engineering", name: "automated evals", unit: "count of suites", source_artifact: "S6 harness", cadence: "monthly", evidence_source: "real"}
    - {id: "SM-05", group: "Engineering", name: "failure scenarios handled", unit: "count", source_artifact: "exercises/agent-failures.md — a scenario counts only when all five parts are written AND its proving test fails against the pre-mitigation code", cadence: "weekly", evidence_source: "real"}
    - {id: "SM-06", group: "Engineering", name: "architectural reviews", unit: "count", source_artifact: "arch_reviews.reviews", cadence: "monthly", evidence_source: "real"}
    - {id: "SM-07", group: "Engineering", name: "security attacks tested", unit: "count of distinct techniques", source_artifact: "the attack reports (PF-05)", cadence: "monthly", evidence_source: "real"}
    - {id: "SM-08", group: "Agent harness", name: "autonomous task success rate", unit: "%", source_artifact: "S6 suite results", cadence: "weekly", evidence_source: "real", note: "Reported over N=5 reruns as a pass-rate distribution, never as a single-run figure."}
    - {id: "SM-09", group: "Agent harness", name: "human interventions/task", unit: "count/task", source_artifact: "S2 approval records and needs_clarification transitions", cadence: "weekly", evidence_source: "real", note: "An approval is NOT an intervention — it is the design. An intervention is a human editing the agent's output or unblocking a stall."}
    - {id: "SM-10", group: "Agent harness", name: "average task duration", unit: "minutes", source_artifact: "S5 spans", cadence: "weekly", evidence_source: "real", note: "Quota-stalled samples are EXCLUDABLE via quota_stall_seconds, without which this metric measures the billing plan rather than the system."}
    - {id: "SM-11", group: "Agent harness", name: "retry rate", unit: "retries/task", source_artifact: "S5 spans and the state machine's attempt records", cadence: "weekly", evidence_source: "real", note: "Same exclusion. A retry caused by a quota stall is not a retry caused by the system."}
    - {id: "SM-12", group: "Agent harness", name: "cost/task", unit: "composite: {tokens_per_task: count, imputed_eur_per_task: EUR at meta.imputation_rate, metered_eur_per_task: EUR}", source_artifact: "S5 cost accounting", cadence: "weekly", evidence_source: "real", note: "COMPOSITE BY DESIGN. Under flat-rate subscription execution the realised marginal cost is EUR 0 and a single-number metric is degenerate. Three components: tokens (always real), an imputed EUR figure at a declared rate (so the number means something), and the metered figure (real only when the fallback path runs). This stays ONE metric so len(scoreboard_metrics) == 22 holds rather than silently becoming 24."}
    - {id: "SM-13", group: "Agent harness", name: "PR acceptance rate", unit: "%", source_artifact: "GitHub PR outcomes from S2 and S3", cadence: "weekly", evidence_source: "real"}
    - {id: "SM-14", group: "Agent harness", name: "test failure recovery rate", unit: "%", source_artifact: "S2 verification gate outcomes", cadence: "weekly", evidence_source: "real", note: "Recovery means the agent fixed the code. An agent weakening the assertion counts as a FAILURE, not a recovery — that distinction is the whole value of the metric."}
    - {id: "SM-15", group: "Business", name: "prospects researched", unit: "count", source_artifact: "the outreach send log", cadence: "weekly", evidence_source: "real", target_total: 56}
