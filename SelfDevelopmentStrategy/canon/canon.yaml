# ---------------------------------------------------------------------------
# BRIEF REQUIREMENT COVERAGE — one row per BR id, mapping it to the canon
# structure that satisfies it.
#
# WHY THIS IS A SEPARATE BLOCK RATHER THAN A FIELD ON brief_requirements[]:
# R8 authored those 150 rows from the brief alone, and their value comes from
# canon's author NOT having touched them. Adding a field would edit them. This
# mapping is therefore kept as a parallel structure, keyed by the same ids, so
# coverage becomes mechanically checkable while the verbatim block stays
# byte-identical to R8's output.
#
# CHECK: coverage-report asserts that every id in brief_requirements[] has a row
# here, and that every path named in satisfied_by resolves in this document.
# ---------------------------------------------------------------------------

brief_requirement_coverage:
  count: 150
  build_process_requirements: ["BR-141", "BR-142"]
  build_process_note: "Two of the 150 are instructions to the BUILD, not content requirements on the repository. They carry an empty satisfied_by and a stated reason. Marking them satisfied by content would be false; leaving them unlisted would make the count 148."
  rows:
    - {id: "BR-001", satisfied_by: ["framing.what_this_is", "framing.target_profile"], note: "The eight roles are the AUTHORING stance, not repository content. Satisfied by the breadth of canon itself: engineering tracks, curriculum structure, security, founder/consulting tracks all present in one artifact."}
    - {id: "BR-002", satisfied_by: ["framing.what_this_is"]}
    - {id: "BR-003", satisfied_by: ["tracks.E", "tracks.F", "projects.business_operations_agent", "D-w08-4"]}
