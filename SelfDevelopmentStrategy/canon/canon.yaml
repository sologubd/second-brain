  home_file: "reference/low-roi-and-cuts.md"
  rows:
    - {row_id: "CUT-01", week: "W06", hours_reclaimed: 0.45, track: "E", what: "Reduce W06's 22 assisted prospects to 14", downstream_dependencies_broken: ["funnel.volumes.prospects_researched drops 56 -> 48"], first_draw: true}
