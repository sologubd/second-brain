    the shape existed nowhere; EX-FAIL-01's proving test needs a valid one AND an underspecified
    one, so the pair is the smallest set that makes either stage executable. They carry the
    non-prose `task` class: a task file is machine input, not prose, and a word band over it would
    be meaningless.
