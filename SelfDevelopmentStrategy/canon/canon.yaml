# ---------------------------------------------------------------------------
# GLOSSARY — one home for terms the repository uses precisely, including the
# recognition-only concepts that are deliberately not exercised anywhere.
# ---------------------------------------------------------------------------

glossary:
  home_file: "reference/low-roi-and-cuts.md#glossary"
  terms:
    - {term: "effectively-once processing", definition: "At-least-once delivery plus idempotent processing, such that state after N deliveries equals state after one. Duplicates are ABSORBED, not prevented. The achievable property; distinguish carefully from the next two entries."}
    - {term: "exactly-once delivery", definition: "IMPOSSIBLE over an unreliable network. A sender receiving no acknowledgement cannot distinguish a lost message from a lost acknowledgement, so it must resend or not. There is no third option and no engineering produces one."}
    - {term: "exactly-once execution", definition: "Unachievable in general, because the effect and the record that it happened are not atomic unless they share a transaction. Achievable ONLY where the effect lives in the same database as the dedup record."}
    - {term: "crash window", definition: "The interval between a local commit and an external effect, during which a process death leaves state and effects divergent. THE DEFINITIONAL CLASS OF BUG THAT GENERATED CODE NEVER SURFACES, because no agent injects a kill between two statements unprompted."}
    - {term: "natural key", definition: "A property of the domain that makes a remote create idempotent BY CONSTRUCTION — one PR per branch name, one Notion page per task id. Preferred over idempotency bookkeeping wherever available."}
    - {term: "fencing token", definition: "A monotonically increasing value handed out with a lease, which the protected resource checks, so a worker whose lease expired while it was still running cannot complete a write. The alternative is making the protected operation idempotent; state which you chose and why."}
    - {term: "lease", definition: "A time-bounded claim on a work item. The worker must complete or renew before expiry or another worker may claim it. The primitive underneath every queue's visibility timeout."}
    - {term: "orphan reclaim", definition: "Recovering work held by a worker that died. Requires distinguishing slow from dead, which is impossible in general, which is why the mechanism is a timeout plus a fencing token rather than a detector."}
    - {term: "deep module", definition: "A module whose interface is small relative to its implementation. Under generated code this becomes a CAPABILITY GATE, not a preference: a module whose contract fits in context while its implementation need not is the unit an agent can regenerate reliably."}
    - {term: "pre-filter", definition: "Constraining the candidate set to permitted documents BEFORE or DURING ANN traversal, preserving recall on the permitted subset."}
    - {term: "post-filter", definition: "Running the search first and discarding unauthorized hits from the result. Simultaneously a correctness bug (fewer than k results from a set containing k good ones) and a disclosure vulnerability (count, latency and ranking leak existence)."}
    - {term: "Reciprocal Rank Fusion", definition: "Scoring each document 1/(k + rank) per ranked list and summing across lists, commonly with k = 60. Needs no score normalisation because it uses rank position only."}
    - {term: "agent memory", definition: "Persistent, cross-session state THE AGENT ITSELF WRITES and later treats as trusted fact it reasons from. NOT conversation history (ephemeral transcript), NOT task state (deterministic process bookkeeping), NOT a bare RAG corpus (written by a separate ingestion process)."}
    - {term: "lethal trifecta", definition: "Access to private data, plus exposure to untrusted content, plus the ability to communicate externally. An independent practitioner framing, not an OWASP identifier; attribute it as such."}
    - {term: "confused deputy", definition: "A program with more privilege than its caller, tricked into misusing that privilege on the caller's behalf. Named in the OWASP identity-and-privilege-abuse category, which cites the classic reading directly."}
    - {term: "provenance", definition: "A durable record of where data or memory came from AND AT WHAT TRUST LEVEL, attached AT WRITE TIME. Without it, no read-time policy can be expressed."}
    - {term: "quota_stall_seconds", definition: "Time a run spent blocked on a rate or quota limit rather than doing work. Recorded per run so quota-distorted samples are excludable from duration and retry metrics."}
    - {term: "judge_regression vs agent_regression", definition: "The first rescores a cached corpus and catches rubric drift; the second re-executes the system and is the only gate that exercises what you ship. Neither substitutes for the other, and a third deterministic tier sits below both."}
    - {term: "consensus (Raft, Paxos)", definition: "RECOGNITION ONLY. You consume consensus through Postgres; you never implement it. Studying the internals is a multi-week tax with no surface in this programme."}
    - {term: "CRDTs, vector clocks, quorum replication, CAP taxonomy", definition: "RECOGNITION ONLY, for the same reason. Named here so their absence from the week table is a decision rather than an oversight."}
    - {term: "event sourcing / CQRS", definition: "RECOGNITION ONLY. High commitment, real operational cost, no surface here, hard to reverse — and unusually seductive to a concept-strong learner, which is why it is named explicitly."}
    - {term: "non-verdict", definition: "'Insufficient evidence, deferred to <month>', naming the missing threshold and when it could be met. A PASSING deliverable. A framework that always produces a score cannot kill an idea."}

check_dupes:
  threshold: "12-gram overlap"
  exemptions:
    - {id: "DX-01", fact: "The 15h/week budget and its 8h / 25h scaling rule", appears_in: ["README.md", "phases/*.md", "HOW-TO-EDIT.md"], reason: "The scaling rule must be findable from the entry point AND from wherever the reader is when a week goes wrong."}
    - {id: "DX-02", fact: "Never double up after a missed week — slip the calendar", appears_in: ["README.md", "phases/*.md", "HOW-TO-EDIT.md"], reason: "The single most likely destructive response to falling behind. Stated wherever a falling-behind reader might be."}
    - {id: "DX-03", fact: "The four exercise verdict strings", appears_in: ["resources/recommended-resources.md", "tracks/*.md", "reference/low-roi-and-cuts.md"], reason: "Brief-mandated verbatim strings; paraphrasing them to avoid duplication would break the mandate."}
    - {id: "DX-04", fact: "The five competency level names", appears_in: ["reference/competency-matrix.md", "README.md"], reason: "Same."}
    - {id: "DX-05", fact: "The nine-stage difficulty ladder", appears_in: ["reference/difficulty-ladder.md", "README.md", "exercises/*.md"], reason: "Same. The ladder is a vocabulary that exercises reference by name."}
    - {id: "DX-06", fact: "The effectively-once framing correction", appears_in: ["weeks/week-03.md", "reference/low-roi-and-cuts.md#glossary", "tracks/system-design.md", "projects/engineering-agent-platform.md"], reason: "A PARTIAL correction is worse than none: it leaves two contradictory claims in the repository with no signal about which is canon. Every place that would otherwise repeat the exactly-once phrasing must carry the correction."}
    - {id: "DX-07", fact: "The corrected funnel band and expected-call figures", appears_in: ["business/customer-discovery.md", "business/outreach.md", "phases/phase-01-foundations.md", "SCOREBOARD.md"], reason: "The watch thresholds are pre-announced at week 1 with their likely outcomes, which requires restating the band where the reader meets it."}
    - {id: "DX-08", fact: "evidence_source: real | simulated", appears_in: ["SCOREBOARD.md", "business/*.md", "templates/case-study.md", "templates/discovery-interview.md", "months/*.md"], reason: "The tag is the mechanism preventing simulated work from inflating the funnel. It must appear at every point where an artifact is produced."}
    - {id: "DX-09", fact: "The 14 defect classes", appears_in: ["exercises/architecture-reviews.md", "templates/adr-template.md"], reason: "The ADR template exists to be filled in against the classes; listing them once and linking would make the template unusable offline."}
    - {id: "DX-10", fact: "'I studied it' is never evidence", appears_in: ["README.md", "reference/competency-matrix.md", "reference/portfolio.md", "templates/weekly-review.md"], reason: "The programme's central evidentiary rule. Stated at every point where a reader might be tempted."}
    - {id: "DX-11", fact: "The subscription-CLI subprocess architectural constraint", appears_in: ["projects/engineering-agent-platform.md", "tracks/agentic-engineering.md", "resources/ecosystem-snapshot-2026-08.md"], reason: "A hard architectural constraint whose violation silently moves the programme onto metered billing. It must be visible to anyone touching the adapter."}
    - id: "DX-12"
      fact: "The brief's first-listed flagship pipeline (Notion task -> PR) arrives at month 04, and why."
      appears_in: ["phases/phase-01-foundations.md", "phases/phase-02-agent-harness.md"]
      reason: >-
        DOUBLE-HOMED BY CANON ITSELF, and the exemption records it rather than resolving it silently.
        projects.platform.pipelines.notion.arrival_note says phase-01 states it; schemas.phase.rules
        says phase-02 states it. Both are correct for their own reader: phase-01 must explain why the
        headline workflow is absent from the twelve detailed weeks, and phase-02 must explain why it
        opens with it. The two statements are phrased differently today; this exemption means a future
        edit that converges the wording does not fail the dupe gate.
    - id: "DX-13"
      fact: "A career checkpoint's decision question, quoted verbatim from the brief."
      whole_pair: true
      anchor: "reference/portfolio.md"
      appears_in: ["months/month-01.md", "months/month-02.md", "months/month-03.md", "months/month-04.md", "months/month-05.md", "months/month-06.md", "months/month-07.md", "months/month-08.md", "months/month-09.md", "months/month-10.md", "months/month-11.md", "months/month-12.md", "reference/portfolio.md", "phases/phase-01-foundations.md", "phases/phase-03-production-ai.md", "phases/phase-04-consulting.md", "phases/phase-05-productization.md"]
      reason: >-
        checkpoints.home_file is reference/portfolio.md, which owns the verbatim questions and their
        evidence lists. But a phase file whose whole purpose is a gate should be readable without a
        second file open, and the questions are brief-verbatim so any faithful quotation collides at
        zero tolerance. G4 resolved this by link-only phase files; this exemption PERMITS a phase file
        to quote its own gate question inline. Ownership is unchanged -- portfolio.md remains the home
        for the evidence lists.
        WIDENED AT G6 (gap G6-L5-03). DX-13 MISSED TWICE and, as lane L5 established, HAD NEVER FIRED
        FOR ANYTHING -- all four phase files link rather than quote, so the defect only surfaced when a
        month file tried to obey schemas.month.rules[3] and reproduce its checkpoint question verbatim.
        It missed because month files were not in appears_in AND because its fact shares ZERO content
        words with any of the three question spans, so adding the paths alone would not have made it
        fire. whole_pair is therefore required, not merely convenient. The questions tokenise to 12, 12
        and 26 words and are brief-mandated strings; the evidence-id LISTS collide too (CP-M6's seven
        ids are 21 tokens, CP-M9's four are exactly 12), so a bare comma list in canon order duplicates
        the portfolio row.

    - id: "DX-14"
      fact: "A week outcome_sentence rendered verbatim in its week file and quoted in a phase file exit condition. Week 04: the platform opens a real pull request that a verification gate, an automated review and a human approval gate all had to pass, and nothing reaches a human inbox without an audit record."
      appears_in: ["weeks/week-01.md", "weeks/week-02.md", "weeks/week-03.md", "weeks/week-04.md", "weeks/week-05.md", "weeks/week-06.md", "weeks/week-07.md", "weeks/week-08.md", "weeks/week-09.md", "weeks/week-10.md", "weeks/week-11.md", "weeks/week-12.md", "phases/phase-01-foundations.md"]
      reason: >-
        FOUND AT G5. Rendering weeks['04'].outcome_sentence verbatim collides on a 16-gram with
        phases/phase-01-foundations.md, which quotes it as an exit condition. G5 worked around it by
        REORDERING the sentence. Every canon word survived, but the exemplar then differed from canon, and
        eleven weeks would have inherited "paraphrase the outcome to dodge the dupe gate" as the rule. That
        is the wrong precedent: a week file is the HOME of its outcome and should render canon byte-for-byte.
        This exemption makes verbatim rendering legal in both directions, and the exemplar was restored.
    - id: "DX-15"
      fact: "The per-bucket actuals logging shape in every week file: Theory plan slash actual, Building plan slash actual, Testing evaluation plan slash actual, Customer discovery plan slash actual, logged inside the user actuals region."
      appears_in: ["weeks/week-01.md", "weeks/week-02.md", "weeks/week-03.md", "weeks/week-04.md", "weeks/week-05.md", "weeks/week-06.md", "weeks/week-07.md", "weeks/week-08.md", "weeks/week-09.md", "weeks/week-10.md", "weeks/week-11.md", "weeks/week-12.md", "templates/weekly-review.md"]
      reason: >-
        FOUND AT G6 by lane L9, already colliding between week-04 and week-06 on 14 shared words.
        House rule 17 MANDATES an identical actuals shape in all twelve week files so the M1 hour
        recalibration parses twelve identically-shaped regions instead of twelve freeform ones -- and
        check-dupes runs at zero tolerance. The mandate and the gate were in direct opposition, and
        without this exemption every week file after the second would fail. The identical wording is
        the POINT here, not an accident: a parser reading logged hours needs one shape.
    - id: "DX-16"
      fact: "The exactly-once framing: exactly-once delivery over an unreliable network is impossible, and effectively-once processing via idempotency is what is actually proved under one hundred replays."
      appears_in: ["projects/engineering-agent-platform.md", "tracks/system-design.md", "weeks/week-03.md", "exercises/distributed-systems.md"]
      reason: >-
        WIDENED AT G6 (gap G6L7-03). DX-06 already named these files but its `fact` text shared no
        content words with the sentence that actually collides, so the exemption never fired -- the
        same "shares two content words with fact" trap house rule 25 records for DX-14. This is a
        property of EVERY exemption, not of one. The framing is deliberately repeated because stating
        it once and linking would leave three of four readers with the wrong model of what was proved.
    - id: "DX-17"
      fact: "The approval payload must render the literal proposed call and the literal diff before a human approves it."
      appears_in: ["projects/engineering-agent-platform.md", "weeks/week-04.md"]
      reason: >-
        FOUND AT G6 (gap G6L7-02). Canon states this in BOTH projects.platform.stages.S2.exit AND
        weeks['04'].tasks[T-w04-2].title, so both files are entitled to render canon verbatim and
        collide on a 12-gram with no exemption. L7 broke the gram by reordering on its side, which is
        exactly the paraphrase-to-dodge-the-gate precedent DX-14 was created to prevent. The exemption
        makes both verbatim renders legal; the reorder may stand or be reverted.
    - id: "DX-18"
      fact: "The failure-exercise acceptance clause: the report contains all five named sections and its proving test fails against the pre-mitigation code."
      appears_in: ["weeks/week-01.md", "weeks/week-02.md", "weeks/week-03.md", "weeks/week-04.md", "weeks/week-05.md", "weeks/week-06.md", "weeks/week-07.md", "weeks/week-08.md", "weeks/week-09.md", "weeks/week-10.md", "weeks/week-11.md", "weeks/week-12.md"]
      reason: >-
        FOUND AT G6 by lane L1. Canon carries this clause near-verbatim in the AC-*-4a/4b rows of at
        least six weeks -- it was ADDED to five of them at G5 precisely so no week could satisfy a
        failure exercise by writing prose about a test that was never run. Rendering canon verbatim
        therefore collided at zero tolerance, and lanes began inventing a different paraphrase per
        week. That is the paraphrase-to-dodge-the-gate precedent DX-14 exists to forbid, and here it
        is worse: twelve weeks would state the SAME REQUIREMENT twelve different ways, and a reader
        comparing two weeks could not tell whether the difference was meaningful. The clause is
        semantic, mandatory and identical by design. Render canon verbatim.
    - id: "DX-19"
      fact: "The five named parts of a failure exercise: detection, safe failure behaviour, recovery, logging, and a test proving the mitigation."
      appears_in: ["README.md", "weeks/week-01.md", "weeks/week-02.md", "weeks/week-03.md", "weeks/week-04.md", "weeks/week-05.md", "weeks/week-06.md", "weeks/week-07.md", "weeks/week-08.md", "weeks/week-09.md", "weeks/week-10.md", "weeks/week-11.md", "weeks/week-12.md", "exercises/agent-failures.md", "months/month-05.md", "months/month-06.md", "tracks/ai-security.md", "reference/portfolio.md"]
      reason: >-
        The five part names are a brief-mandated enumeration and every file that renders a failure
        exercise must name them identically -- a checker asserts 70 non-empty cells against exactly
        these five. Varying the wording to satisfy the dupe gate would break the one thing the
        enumeration is for.
    - id: "DX-20"
      fact: "The topics-table note that every row resolves to a canon concept carrying a priority, so no row needs the earn-it or competency fallback."
      appears_in: ["weeks/week-01.md", "weeks/week-02.md", "weeks/week-03.md", "weeks/week-04.md", "weeks/week-05.md", "weeks/week-06.md", "weeks/week-07.md", "weeks/week-08.md", "weeks/week-09.md", "weeks/week-10.md", "weeks/week-11.md", "weeks/week-12.md"]
      reason: >-
        Schema rule 11 requires this note wherever every topic resolves cleanly, which is ten of the
        twelve weeks. It is a statement about canon's shape, not about the week, so it is the same
        sentence by nature. Week-11 was failing on it against week-05 at the time this was filed.
    - id: "DX-21"
      fact: "The SCOREBOARD funnel-logging clause: prospects researched, sends, follow-ups and calls booked recorded with evidence_source marked."
      appears_in: ["weeks/week-01.md", "weeks/week-02.md", "weeks/week-03.md", "weeks/week-04.md", "weeks/week-05.md", "weeks/week-06.md", "weeks/week-07.md", "weeks/week-08.md", "weeks/week-09.md", "weeks/week-10.md", "weeks/week-11.md", "weeks/week-12.md", "SCOREBOARD.md", "business/outreach.md"]
      reason: >-
        House rule 2 requires every business task to be covered by a predicate that tests its output as
        logged counts with evidence_source marked -- the M2 funnel recalibration reads exactly those
        counts. The clause is a data contract with a parser, so it is identical by necessity.
    - id: "DX-22"
      fact: "The three injection technique categories: instruction override, persona or role-play override, and delimiter or format confusion."
      appears_in: ["weeks/week-06.md", "weeks/week-11.md", "tracks/ai-security.md", "exercises/ai-security.md", "projects/secure-knowledge-agent.md"]
      reason: >-
        FOUND AT G6 by lane L2. Canon renders this list in T-w06-6's title and again as C-071's S7a
        surface, so W06 and W11 both legitimately state it and collide. L2 cleared it by REORDERING
        canon's terms, which works but leaves the ordering to whoever writes second -- and an attack
        taxonomy read in two different orders in two weeks is harder to hold, not easier. These are
        canon's category names and every file that teaches or tests them should use one order.
    - id: "DX-23"
      fact: "The ten mandated monthly retrospective questions, rendered verbatim in every month file: what can I now build that I could not build thirty days ago, which concept remains theoretical, what broke in real usage, what did agents repeatedly fail at, what should become a reusable skill, what should become a deterministic tool instead of an LLM decision, where did human approval prove necessary, what business problems appeared repeatedly, what should I stop learning, and what should I double down on. Plus RQ-10's operationalised follow-up: which of the last four weeks' deliverables taught you something you did not already know, with any track scoring zero of four triggering a canon delta re-pitching that track."
