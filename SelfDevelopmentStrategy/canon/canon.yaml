# ---------------------------------------------------------------------------
# PHASES
# phases/*.md owns ARC, ENTRY/EXIT and CHECKPOINTS ONLY. Never topics, hours or tasks.
# ADDED AT G4 in response to gap G4-01. schemas.phase mandated five files whose Arc,
# Entry, Exit and "does not cover" sections all presuppose a phase->month partition,
# and file_manifest fixed the five filenames -- but no partition existed anywhere in
# canon. G4 wrote the five files against the partition below, marked the four
# unsupported span sentences with [[GAP:G4-01]] and correctly DECLINED to assert the
# partition itself. This block asserts it, with the evidence that determined it.
# ---------------------------------------------------------------------------
phases:
  count: 5
  partition_note: >-
    Phase 1 was the only phase canon defined, and it defined it implicitly but consistently
    (tracks.F.thin_by_decision "5.0h in phase 1 -- W10 1.5, W11 1.5, W12 2.0";
    meta.scaling_modes "phase 1 compresses to ~8 weeks"; tracks.P.funding, three phase-1
    retrospectives at W04/W09/W12). Phases 02-05 had no span at all. The partition below is
    the only assignment consistent with all five file_manifest purpose strings AND
    projects.platform.pipelines.notion.arrives M04, months.05.mandated_delta
    security_arc_recalibration, months.09.residual_topics_homed (exactly the Track F set),
    and consulting_stages[].first_reached.
  rows:
    - id: "P1"
      file: "phases/phase-01-foundations.md"
      name: "Foundations"
      spans_weeks: ["W01", "W12"]
      spans_months: ["M01", "M03"]
      calendar_note: "12 week-files over roughly 18 calendar weeks — about 16 of work plus two floating catch-up weeks, per meta.calendar_weeks and meta.calendar_model. CORRECTED AT G6 (G6-L4-02): this row still carried the superseded 14."
      checkpoint: "CP-M3"
      evidence: ["tracks.F.thin_by_decision", "meta.scaling_modes", "tracks.P.funding"]
    - id: "P2"
      file: "phases/phase-02-agent-harness.md"
      name: "Agent harness"
      spans_months: ["M04", "M04"]
      evidence: ["projects.platform.pipelines.notion.arrives = M04", "file_manifest purpose: states why the first-listed flagship pipeline arrives at month 04"]
    - id: "P3"
      file: "phases/phase-03-production-ai.md"
      name: "Production AI"
      spans_months: ["M05", "M06"]
      checkpoint: "CP-M6"
      evidence: ["months.05.mandated_delta = security_arc_recalibration", "file_manifest purpose: security-arc continuation", "BOA-S2 and memory poisoning land M05-M06"]
    - id: "P4"
      file: "phases/phase-04-consulting.md"
      name: "Consulting"
      spans_months: ["M07", "M08"]
      checkpoint: "CP-M9"
      evidence: ["file_manifest purpose: homes the residual Track E topics", "Track E residuals (scoping, pricing, subcontracting) homed M04-M07"]
    - id: "P5"
