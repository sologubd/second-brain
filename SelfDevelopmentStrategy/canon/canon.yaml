    acceptance:
      - {id: "AC-w03-1a", text: "After 100 killed replays: exactly one domain state transition, one recorded PR-intent, one recorded Notion-intent, one dedup row per key, and a terminal-correct final state", refs: ["T-w03-2", "T-w03-4"]}
      - {id: "AC-w03-1b", text: "The naive version's duplicate count is recorded and greater than zero; the post-fix duplicate count is zero", refs: ["T-w03-4", "T-w03-5"]}
      - {id: "AC-w03-1c", text: "The dedup record and the state transition commit in the SAME transaction — no application-level check-then-act; no sleep or retry is used anywhere to mask a race", refs: ["T-w03-2"]}
      - {id: "AC-w03-1d", text: "The write-up names, for at least one external effect, a NATURAL KEY that made the create idempotent by construction rather than by bookkeeping", refs: ["T-w03-5"]}
      - {id: "AC-w03-2a", text: "BOA-S0 extracts a valid schema instance from at least 8 of 10 real company sites, and every rejection records a reason rather than failing silently", refs: ["T-w03-7", "T-w03-6"]}
      - {id: "AC-w03-3a", text: "The rehearsal document describes a workflow with named steps, an estimated frequency and an estimated time cost, and could be shown to a stranger as evidence of the documentation skill", refs: ["T-w03-11"]}
      - {id: "AC-w03-4a", text: "Both failure reports contain all five named sections; each proving test fails against the pre-mitigation code", refs: ["T-w03-1", "T-w03-3", "T-w03-8", "T-w03-9", "T-w03-10"]}
