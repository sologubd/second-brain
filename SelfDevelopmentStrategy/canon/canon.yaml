      - {id: "T-w05-12", title: "Send 10 follow-ups", primary_track: "E", reinforces: [], activity_class: "business", hours: 0.45, deliverable_ids: ["D-w05-3"]}
      - {id: "T-w05-13", title: "Discovery call slot at the full 1.75h all-in rate — 30 minutes prep, 45 minutes call, 30 minutes notes", primary_track: "E", reinforces: ["F"], activity_class: "business", hours: 1.75, deliverable_ids: ["D-w05-3"]}
    deliverables:
      - {id: "D-w05-1", text: "SKA-S0 at `agentplat/ska/`: a permission-aware hybrid index over a real corpus — bm25s lexical, local Qwen3 embeddings in pgvector, hand-implemented RRF — with a 15–20 pair labelled query set frozen before any tuning at `evals/ska-labels.frozen.jsonl`, its digest and ISO freeze date at `evals/ska-labels.frozen.sha256`"}
      - {id: "D-w05-2", text: "Permission-filter correctness and leak report at `docs/w05/permission-filter-report.md`: a reproducible failing post-filter case, the pre-filter fix, an automated test at `tests/test_prefilter_k.py` asserting pre-filter always returns exactly k authorized results when k exist, and a latency comparison"}
      - {id: "D-w05-3", text: "9 assisted sends and 10 follow-ups logged in `send-log.local.md`, plus the call slot outcome recorded with evidence_source in `discovery-notes.local.md`"}
      - {id: "D-w05-4", text: "Combined failure report at `docs/w05/stale-documentation-report.md` — stale documentation misleads the agent — with all five parts"}
    acceptance:
      - {id: "AC-w05-1a", text: "All three retrieval strategies run against the SAME labelled query set; precision@5, recall@5, MRR and NDCG@5 are computed per strategy", refs: ["T-w05-4", "T-w05-6"]}
      - {id: "AC-w05-1b", text: "Hybrid beats at least one single signal on at least one metric, OR the write-up explains why not and what that says about the chosen k", refs: ["T-w05-6", "T-w05-1", "T-w05-3", "T-w05-5", "T-w05-9"]}
      - {id: "AC-w05-1c", text: "The labelled set was frozen before the first tuning change — proved by `evals/ska-labels.frozen.sha256` holding the digest and the ISO date of the freeze, and by that digest still matching `evals/ska-labels.frozen.jsonl` when the metrics are read; NOT by commit history, which this repo does not have", refs: ["T-w05-4"]}
      - {id: "AC-w05-2a", text: "A failing 'before' case exists in which post-filter returns fewer than k authorized results for a query where k authorized documents demonstrably exist", refs: ["T-w05-7"]}
      - {id: "AC-w05-2b", text: "An automated test asserts pre-filter always returns exactly k authorized results when k exist, and it fails against the post-filter implementation", refs: ["T-w05-7"]}
      - {id: "AC-w05-2c", text: "The report names at least one OBSERVABLE — result count, latency or error shape — that leaks the existence of a document the user cannot see, and states why a test checking only 'no unauthorized content returned' would not have caught it", refs: ["T-w05-2", "T-w05-7"]}
