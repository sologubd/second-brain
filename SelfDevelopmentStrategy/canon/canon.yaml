      - {id: "BOA-S1", name: "draft-only outreach with approval and audit trail (EXTENDS BOA-S0)", week_or_month: "W04", entry: "BOA-S0 exits.", exit: "Nothing sends without an approval record; an attempt to bypass is refused and logged.", runnable_demo_command: "make demo-boa-s1 PROSPECT=<id>", capabilities_added: ["proposed action", "human approval"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 25 runs"}
      - {id: "BOA-S2", name: "durable per-account agent memory", week_or_month: "M05", entry: "BOA-S1 exits.", exit: "Facts accumulated about an account persist ACROSS sessions and are read by LATER, SEPARATE decision cycles as trusted input — with provenance and a trust tier on every write.", runnable_demo_command: "make demo-boa-s2-memory ACCOUNT=<id>", capabilities_added: ["memory"], cost_ceiling_eur: 5.0, quota_ceiling: "<= 40 runs", why_it_exists: "The brief mandates agent memory three times — objective goal 9, Track C topics, Track D topics — and the program had NOWHERE to put it: task state (S1a/S1b) is machine bookkeeping about where a pipeline is, not a belief the agent holds, and corpus poisoning (W06) is not memory poisoning. BOA-S2 creates the surface, which is what makes the month-05 memory-poisoning exercise a real exercise rather than a contrived one.", exercise_precondition: "The poisoning message and the exploiting decision MUST be separated by at least one full pipeline cycle, not one context window. Without that separation a reviewer can reasonably reclassify the exercise as ordinary prompt injection, which is exactly the boundary OWASP itself draws between the two categories."}

# ---------------------------------------------------------------------------
# MATURITY MODEL — the brief's 6 levels, each with objective requirements and
# at least one milestone linking it to the week or month that claims it.
# ---------------------------------------------------------------------------

maturity_model:
  - id: "L0"
    name: "Level 0 — Human codes, AI autocompletes."
    objective_requirements: ["The human writes the code. The model completes lines or blocks. No task is delegated end-to-end."]
    milestones: [{ref: "pre-W01", claimed_at: "before W01", evidence: null, note: "FIXED AT G8 (T10). Every other level cites a deliverable id in `evidence`; L0 and L1 carried prose there under a `baseline` ref, which made the model read as if two levels had evidence of a different kind rather than no evidence at all. They have none by construction: this level is stated as the floor, not a target. The learner is already past it — competency baseline places coding-agent usage at Independent implementation."}]
  - id: "L1"
    name: "Level 1 — Agent performs individual coding tasks."
    objective_requirements: ["The agent completes a bounded, well-specified task inside a session with the human present and steering."]
    milestones: [{ref: "pre-W01", claimed_at: "before W01", evidence: null, note: "FIXED AT G8 (T10), same reason as L0. No deliverable evidences this level because none is produced for it. Also already held. Recorded so the model is complete and so the progression is honest about where this learner actually starts."}]
  - id: "L2"
    name: "Level 2 — Agent can execute well-defined tickets."
    objective_requirements: ["A ticket in a file becomes a diff with no human keystrokes in between.", "The run is unattended: no interactive prompt can appear.", "The run is isolated: it happens in a worktree, not the main checkout.", "The run is repeatable: re-running produces no duplicate effect."]
    milestones:
      - {ref: "W01", claimed_at: "W01", evidence: "D-w01-1"}
      - {ref: "W02", claimed_at: "W02", evidence: "D-w02-1"}
      - {ref: "W03", claimed_at: "W03", evidence: "D-w03-1"}
  - id: "L3"
    consolidation_weeks_note: "ADDED AT G8 (T11). `weeks[W06].maturity_level_target` is L3 but W06 names no milestone here, and the same holds for W11 against L4. That is deliberate and is stated so a reader does not read the omission as an oversight: a week's `maturity_level_target` is the level the week OPERATES AT, while a milestone is a week that first makes the level TRUE. W06 and W11 are consolidation weeks -- they harden retrieval and attack it respectively, at a level already reached in W04 and W08, and they add no new agent capability. A week may therefore target a level it does not evidence. Only the milestone list carries claims."
    name: "Level 3 — Agent can research and plan."
    objective_requirements: ["The agent locates the relevant code itself rather than being handed it.", "It produces a hypothesis or a plan that a human reviews before execution.", "It detects that a task is underspecified and says so instead of guessing."]
    milestones:
      - {ref: "W04", claimed_at: "W04", evidence: "D-w04-1"}
      - {ref: "W05", claimed_at: "W05", evidence: "D-w05-1"}
      - {ref: "W07", claimed_at: "W07", evidence: "D-w07-1"}
      - {ref: "M04", claimed_at: "M04", evidence: "D-m04-1", note: "S8's ambiguity detection is the strongest evidence for this level and it arrives at month 04."}
  - id: "L4"
    consolidation_weeks_note: "See L3's consolidation_weeks_note: W11 targets L4 without naming a milestone here, for the same reason W06 targets L3 without naming one there."
    name: "Level 4 — Multiple agents execute independently with verification."
    objective_requirements: ["Several agents run concurrently without corrupting each other's work.", "A verification gate decides whether output is acceptable, not the human's impression of it.", "Failures are detected and recovered from without a human noticing them first.", "The system's behaviour is measurable: cost, latency and success rate per run."]
    milestones:
      - {ref: "W08", claimed_at: "W08", evidence: "D-w08-1"}
      - {ref: "W09", claimed_at: "W09", evidence: "D-w09-1"}
      - {ref: "W10", claimed_at: "W10", evidence: "D-w10-1"}
      - {ref: "W12", claimed_at: "W12", evidence: "D-w12-1"}
  - id: "L5"
    name: "Level 5 — Integrated engineering system consuming tasks/incidents and producing reviewed PRs."
    objective_requirements: ["Tasks arrive from an external system (Notion) and incidents from another (Sentry) without manual transfer.", "Output is a reviewed PR, multi-axis, not a diff on a branch.", "The system operates under a cost and quota budget it enforces on itself.", "A regression in agent behaviour is caught by a gate before it merges."]
    milestones:
      - {ref: "M04", claimed_at: "M04", evidence: "D-m04-1"}
      - {ref: "M04", claimed_at: "M04", evidence: "D-m04-4", note: "S2b's multi-axis review is what makes 'reviewed PR' mean what the brief means by it."}
      - {ref: "M06", claimed_at: "M06", evidence: "D-m06-4"}

# ---------------------------------------------------------------------------
# BUSINESS FRAMEWORKS
# business/*.md is the ONLY home for scripts, checklists, the scorecard,
# kill criteria and the outreach branch.
# ---------------------------------------------------------------------------

opportunity_scorecard:
  count: 9
  home_file: "business/opportunity-scorecard.md"
  scale: "0–5 per dimension; every score must CITE the evidence used, not intuition alone."
  dimensions:
    - {id: "OS-1", name: "pain severity", axis: "value", scoring_guidance: "How much does the current process cost in money, error rate or missed opportunity? 0 = mild annoyance, 5 = a named person's job is measurably worse every week."}
    - {id: "OS-2", name: "frequency", axis: "value", scoring_guidance: "How often does it happen? The multiplier in every ROI calculation, and the most common place a plausible automation turns out worthless."}
    - {id: "OS-3", name: "labor cost", axis: "value", scoring_guidance: "Hours per occurrence times FULLY LOADED hourly cost — salary times roughly 1.3–1.5. Buyers discount unloaded estimates as naive."}
    - {id: "OS-4", name: "process predictability", axis: "feasibility", scoring_guidance: "How rule-based and standardised is it? A process that differs every time is not automatable at this scale."}
    - {id: "OS-5", name: "data availability", axis: "feasibility", scoring_guidance: "Is the input machine-readable and reachable, or does it live in someone's inbox and head?"}
    - {id: "OS-6", name: "integration feasibility", axis: "feasibility", scoring_guidance: "Do the systems involved have APIs, and can the buyer actually grant access? Permission friction kills more pilots than technical difficulty."}
    - {id: "OS-7", name: "buyer access", axis: "adaptation", scoring_guidance: "Can you reach the person who decides? Generic RPA literature omits this because it is written for internal teams with a captive buyer; an external consultant has no such thing."}
    - {id: "OS-8", name: "willingness to pay", axis: "adaptation", scoring_guidance: "Backed by an actual conversation or an observable signal, NEVER by assumption. This is the dimension where wishful scoring is most tempting and most fatal — kill criterion 1 is literally about it."}
    - {id: "OS-9", name: "market repetition", axis: "value", scoring_guidance: "How many other businesses have this same shape of problem? The bridge from consulting to product."}
  supplementary_dimensions:
    status: "SUPPLEMENTARY — documented in business/opportunity-scorecard.md, NOT scored, NOT counted. The brief mandates nine and the count is enforced at G2; adding these to the scored set would break a brief-mandated count."
    credited_to: "R6"
    rows:
      - {name: "exception-handling burden", reason: "How many edge cases and how much judgement the current manual process requires is usually its OWN criterion in RPA literature rather than being folded into predictability."}
      - {name: "change/maintenance risk", reason: "Whether the target process or its underlying systems — APIs, vendor tools — are likely to change soon, which decides whether the automation STAYS valuable."}
      - {name: "compliance/risk sensitivity", reason: "Some processes are automation-unfriendly regardless of value because errors carry regulatory or reputational risk. This does not appear in the nine at all."}
  industry_crosscheck:
    framing: "Industry RPA practice distils many sub-criteria into two axes: BUSINESS VALUE (volume/frequency, labour cost, error rate, strategic importance) and FEASIBILITY (rule-based-ness, standardisation, stable environment, data availability, low exception-handling need), usually visualised as a 2x2."
    verdict: "The brief's nine map cleanly onto that. Buyer access plus willingness to pay is a GENUINE ADAPTATION, not a gap."
    exercise_use: "Score the opportunity on all nine, then separately bucket it into the value-by-feasibility 2x2, and state which framing you trust more where they disagree."

consulting_stages:
  progression_rule: "Stages are entered in canon order and never re-entered after exit. A stage whose exit criteria are unmet is not exited, regardless of elapsed months — the calendar does not promote."
  stages:
  - {id: "CS-1", name: "Stage 1 — simulated", description: "Build internal demos against realistic workflows.", exit_criteria: ["At least one workflow documented end-to-end from public information, with named steps, estimated frequency and estimated time cost.", "A discovery script exists and has been rehearsed.", "The artifact could be shown to a stranger as evidence of the documentation skill."], first_reached: "W03", note: "LOAD-BEARING. Under the corrected funnel this is the EXPECTED evidence path for at least one of W07/W08/W09, not a contingency. It must never be cut."}
  - {id: "CS-2", name: "Stage 2 — free/cheap pilot", description: "Solve one small real-world problem with strict scope.", exit_criteria: ["A real external party's process is measurably different after the work.", "A before/after baseline was MEASURED, not estimated.", "The scope was fixed in writing before work started and was not exceeded."], first_reached: "M05–M07 (contingent on the funnel)"}
  - {id: "CS-3", name: "Stage 3 — paid fixed-scope automation", description: "Deliver a measurable outcome.", exit_criteria: ["Money changed hands.", "The delivered outcome matches a written scope.", "A payback period in months can be stated and defended."], first_reached: "M07–M09 (contingent)"}
  - {id: "CS-4", name: "Stage 4 — repeatable offer", description: "Turn repeated work into a packaged service.", exit_criteria: ["The same shape of work has been delivered at least twice.", "A fixed-scope, fixed-price description exists that a buyer can say yes to without a bespoke proposal."], first_reached: "M08+ (contingent)"}
  - {id: "CS-5", name: "Stage 5 — productization candidate", description: "Recognize a pain shared by multiple clients.", exit_criteria: ["The pain register shows the same shape of pain across at least the number of independent buyers set in saas_validation.", "All seven evidence thresholds are met, or the framework returns an explicit non-verdict."], first_reached: "M09+ (contingent)"}

saas_validation:
  home_file: "business/saas-validation.md"
  non_verdict_is_passing: true
  non_verdict_rule: >-
    'Insufficient evidence, deferred to <month>' is a PASSING deliverable when it names exactly
    which threshold lacks evidence and the month by which that evidence could exist. A
    kill-criteria framework that can return 'not enough evidence to decide' is stronger than one
    that always produces a score, because a score is always actionable in the direction the author
    already wanted. This is also what protects the program from inventing evidence when the funnel
    underperforms — which, under the corrected funnel, is the expected case.
  evidence_thresholds:
    count: 7
    n_resolution_note: "The brief leaves two thresholds as 'at least N'. Concrete numbers are set in W11 (T-w11-12) with a one-line justification each. The defaults below are canon; W11 may raise them on evidence but may not lower them without a canon delta."
    rows:
      - {id: "ET-1", threshold: "at least N customer interviews", n: 8, justification: "Below 8 independent conversations the same pain appearing twice is as likely to be coincidence as signal. 8 is also roughly what this program's funnel could plausibly produce by month 07 if the reply band lands mid-range, so it is demanding without being unreachable."}
      - {id: "ET-2", threshold: "problem observed repeatedly", n: 3, justification: "The same shape of pain in at least 3 INDEPENDENT businesses — not 3 mentions by the same buyer, and not 3 businesses introduced by the same source."}
      - {id: "ET-3", threshold: "at least N users willing to pilot", n: 3, justification: "Two can be politeness from a warm-ish contact. Three independent yeses is the smallest number where a no from one does not collapse the evidence."}
      - {id: "ET-4", threshold: "at least one payment or strong purchase commitment", n: 1, justification: "Money is the only evidence in the framework that cannot be produced by politeness. One is enough because it is categorical, not statistical."}
      - {id: "ET-5", threshold: "clear acquisition channel", n: null, justification: "A named channel with a MEASURED cost per conversation from this program's own funnel — which is itself a reachability experiment. A channel that has not been measured is a hope."}
      - {id: "ET-6", threshold: "estimated ROI", n: null, justification: "Computed from a measured baseline using the fully-loaded method, expressed as a payback period in months. An industry-average ROI percentage does not satisfy this."}
      - {id: "ET-7", threshold: "manual workflow proven first", n: 1, justification: "At least one concierge delivery by hand. If you cannot deliver the outcome manually for one customer, automating it produces an automated way to deliver nothing."}
  kill_criteria:
    count: 5
    rows:
      - {id: "KC-1", criterion: "people say problem is annoying but won't pay", detection: "Interview notes record enthusiasm and no budget signal across at least 3 conversations."}
      - {id: "KC-2", criterion: "workflow differs completely between companies", detection: "The documented workflows share fewer than half their steps, so any product is really N bespoke builds."}
      - {id: "KC-3", criterion: "acquisition cost is obviously too high", detection: "This program's own measured funnel implies a cost per qualified conversation that exceeds a plausible first-year contract value."}
      - {id: "KC-4", criterion: "integration permissions make deployment impractical", detection: "Two or more prospects cannot or will not grant the access the automation requires."}
      - {id: "KC-5", criterion: "existing product already solves 90% of pain cheaply", detection: "Competition analysis finds a product at a price the buyer would accept, covering the workflow's main path."}
  monthly_funnel_targets_note: "The brief supplies illustrative monthly targets and states explicitly: do not blindly use those numbers if research suggests better targets, BUT TARGETS MUST EXIST. This program's targets are in funnel.volumes and months[].funnel_targets, derived bottom-up. The brief's figures are reproduced in business/customer-discovery.md alongside this program's, with the gap and its reason stated."

# ---------------------------------------------------------------------------
# TECHNOLOGY TRIAGE — all 30 named technologies.
# verdict is constrained to the four verbatim strings.
# ---------------------------------------------------------------------------

triage:
  count: 30
  verdict_enum: ["LEARN DEEPLY", "LEARN ENOUGH TO USE", "UNDERSTAND CONCEPT ONLY", "SKIP FOR NOW"]
  rows:
    - {id: "TR-01", technology: "LangGraph", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "Read the durable-execution doc page once in W02, use it to sanity-check the hand-built design's step boundaries, move on.", reasoning: "The DURABLE CONCEPT — checkpoint at step boundaries, resume from the last checkpoint, trade recovery granularity against latency — transfers completely to the hand-built state machine. The specific API surface does not need mastery for a platform explicitly not adopting a framework. Note the distinction the docs themselves make: in-process checkpointing persists DATA, not EXECUTION, so a process death still ends the run.", source: "R2"}
    - {id: "TR-02", technology: "MCP", verdict: "LEARN ENOUGH TO USE", sequencing: "AFTER the hand-built state machine in W02–W03, so the learner recognises MCP's stateless-handle pattern as the thing they already implemented rather than learning it cold.", reasoning: "The 2026-07-28 revision retires the initialize handshake and the session-id header; requests are stateless and self-contained with per-request capability negotiation, and application state persists via explicit handles in tool arguments. That STATELESS-REQUEST DISCIPLINE is directly reusable in the hand-built queue — carry task state explicitly, never rely on a sticky session — so there is transfer value beyond MCP itself. The wire-format specifics of the multi-round-trip and Tasks extensions are UNDERSTAND CONCEPT ONLY within this.", source: "R2"}
    - {id: "TR-03", technology: "agent skills", verdict: "LEARN ENOUGH TO USE", sequencing: "W04, as part of S2.", reasoning: "Directly reusable for structuring reusable harness behaviours; shallow to adopt, cross-tool portable. The heuristic that matters: a SKILL is a stable playbook, a TOOL is a changing data access or action. 'How to run tests' and 'how to open a PR' are skills; 'run pytest and return the exit code' is a tool.", source: "R1, R2"}
    - {id: "TR-04", technology: "coding agent harness design", verdict: "LEARN DEEPLY", sequencing: "W01, before any adapter code is written.", reasoning: "This is the literal mechanism the whole cost architecture depends on. Get the auth, context and permission semantics exactly right before writing the adapter, because a mistake here is not a bug — it moves the program onto metered billing.", source: "R1"}
    - {id: "TR-05", technology: "multi-agent orchestration", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "Concept in W01, practice in W08 via the hand-built queue.", reasoning: "The harness/model separation concept matters. A specific third-party orchestration framework is not needed while the build is two-harness and can be hand-rolled — and hand-rolled adapter code is more legible until the underlying two-CLI behaviour is characterised.", source: "R1"}
    - {id: "TR-06", technology: "Temporal or other durable workflow systems", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "Read once in W03, after the hand-built machine exists.", reasoning: "Temporal is the industry-standard reference implementation of the state-machine-plus-worker-lease concept and is worth reading ONCE for how a mature system solves worker-crash-mid-activity — precisely the scenario the hand-built system must also solve. Its docs state the key property in about a paragraph: an activity may physically execute more than once while still being OBSERVED AS COMPLETED EXACTLY ONCE, because the guarantee lives in the durable log, not the function body. DBOS is conditionally LEARN ENOUGH TO USE as a later graduation path — Postgres-native, low integration cost — if and only if the hand-built machine needs to scale past this program's scope. Restate stays SKIP FOR NOW: no primary source was consulted and there is no urgent need.", source: "R2"}
    - {id: "TR-07", technology: "Docker", verdict: "LEARN ENOUGH TO USE", sequencing: "W01 (compose for Postgres), W12 (sandboxing).", reasoning: "Narrow: a Dockerfile, compose for Postgres, and sandboxing agent execution as a Track D surface. Skip image-size tuning, registries and orchestration. The reframe that matters: this is process and namespace isolation, NOT a security boundary against a malicious workload — correcting a common and consequential misconception.", source: "R5, R7"}
    - {id: "TR-08", technology: "sandboxing", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "One paragraph and one diagram in W12; upgrade only if the months 04–06 arc reaches running agent-generated code.", reasoning: "At an Awareness security baseline the whole lesson fits in a paragraph: container is shared-kernel isolation, a user-space kernel intercepts syscalls at an I/O cost, a microVM gives hardware-enforced isolation with a dedicated kernel. Deep protocol-level study of any specific technology is disproportionate for a 22.5h track.", source: "R5"}
    - {id: "TR-09", technology: "Git worktrees", verdict: "LEARN ENOUGH TO USE", sequencing: "W01, immediately.", reasoning: "Needed from the first unattended run. The primitive is shallow and the payoff — no file-write races between parallel agents — is high. There is no deep theory beyond correct branch and cleanup discipline.", source: "R1"}
    - {id: "TR-10", technology: "queues", verdict: "LEARN ENOUGH TO USE", sequencing: "W08.", reasoning: "BUILD ON POSTGRES; DO NOT ADOPT A BROKER. Building it IS the lesson — claiming, visibility timeout, retries, dead-lettering, orphan reclaim — and adopting Celery or a hosted queue hides exactly those mechanics. Do not spend hours on broker comparison: the semantics transfer, the products do not, and product knowledge expires.", source: "R2, R7"}
    - {id: "TR-11", technology: "Redis", verdict: "SKIP FOR NOW", sequencing: "Not scheduled.", reasoning: "Adds an operational component duplicating what Postgres does MORE CORRECTLY, and Redis-based locking is the most contested primitive in the area. Introducing Redis to teach distributed locks means teaching an unsafe lock and then teaching the caveats. Advisory locks plus leases plus fencing tokens teach the safe version at lower cost. Revisit only on a MEASURED throughput reason — none will appear in phase 1.", source: "R7"}
    - {id: "TR-12", technology: "Postgres", verdict: "LEARN DEEPLY", sequencing: "W02 onward, deepened in W08.", reasoning: "THE HIGHEST-LEVERAGE SINGLE TECHNOLOGY IN THE PROGRAM. Simultaneously the state store, the queue (SKIP LOCKED), the lock (advisory), the outbox, the dedup table (unique and partial indexes), the transaction boundary AND the vector store (pgvector). Specifics: isolation levels and lost update, FOR UPDATE, SKIP LOCKED, advisory locks, LISTEN/NOTIFY, JSONB, migrations. Every Track B concept has a Postgres implementation — one deep technology beats four shallow ones inside a 39h floor. It is also why W05's pgvector cost is 0.5h and not 2.5h.", source: "R7"}
    - {id: "TR-13", technology: "vector databases", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "W05 concept, no operation beyond pgvector.", reasoning: "Deep specialisation in any single one is explicitly LOW ROI for this profile and budget. The transferable skill — how filtering interacts with ANN indexing, and why that matters for security — is fully teachable via one hands-on system plus conceptual exposure to a clearer published account. This is BR-120's second challenge answered.", source: "R3"}
    - {id: "TR-14", technology: "pgvector", verdict: "LEARN ENOUGH TO USE", sequencing: "W05.", reasoning: "Enough to stand up one permission-aware index and understand iterative-scan behaviour — which exists precisely to stop a post-filter returning fewer than k rows, i.e. it is the correctness bug of C-052 appearing at the index layer. Skip Postgres internals and index-tuning minutiae. Chosen because Postgres is already running.", source: "R3"}
    - {id: "TR-15", technology: "Qdrant", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "W05, one article.", reasoning: "Read its filterable-HNSW explanation once as the CLEAREST PUBLISHED ACCOUNT of pre-filtering done correctly at the ANN layer — payload indexes extending the graph so traversal stays inside the permitted subset, with a planner choosing among filtered traversal, hybrid, index-only and brute force by filter cardinality. The concept transfers even though the exercise is built on pgvector. Do not operate a second vector store.", source: "R3"}
    - {id: "TR-16", technology: "Elasticsearch/OpenSearch", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "W05, recognition only.", reasoning: "Know it exists and where it fits — when lexical search is already the core product — and that it ships native rank-fusion hybrid search. Do not operate a third system inside a two-week retrieval budget.", source: "R3"}
    - {id: "TR-17", technology: "BM25", verdict: "LEARN DEEPLY", sequencing: "W05, FIRST — before embeddings.", reasoning: "The baseline everything else is measured against: cheap, deterministic, and its failures (synonymy, vocabulary mismatch) are what motivate the rest of the track. Use bm25s rather than a naive implementation for anything beyond a toy.", source: "R3"}
    - {id: "TR-18", technology: "reranking", verdict: "LEARN ENOUGH TO USE", sequencing: "W06.", reasoning: "Understand what a cross-encoder is, why it is second-stage-only, run one locally, measure the lift and the latency cost. Cross-encoder training internals are out of scope. Reranking does not require paying: permissively licensed CPU-runnable models of real quality exist.", source: "R3"}
    - {id: "TR-19", technology: "LangSmith or equivalent observability", verdict: "LEARN ENOUGH TO USE", sequencing: "W10 — pick ONE and build the suite against it rather than surveying three.", reasoning: "The durable skill is the PATTERN — dataset-first evals, CI-gated scoring, trace-linked judging — not any one product. Building one harness deep teaches more than a shallow multi-tool survey.", source: "R4"}
    - {id: "TR-20", technology: "OpenTelemetry", verdict: "LEARN ENOUGH TO USE", sequencing: "W09, by emitting spans rather than by spec-reading.", reasoning: "Directly usable now for the agent and tool span vocabulary, but the GenAI conventions are DEVELOPMENT STATUS WITH ONGOING CHURN — renames within the last year, a repo split in mid-2026, no stable release. Deep spec mastery is a moving target; memorising today's attribute names is explicitly low ROI. Learn to READ THE CURRENT SPEC at instrumentation time and pin the version.", source: "R4"}
    - {id: "TR-21", technology: "AI eval frameworks", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "W10, one paragraph on what niche each fills.", reasoning: "Know the niche each fills; build the harness deep with one tool. A shallow four-tool survey teaches less than one suite that actually gates a merge.", source: "R4"}
    - {id: "TR-22", technology: "OWASP LLM/Agentic guidance", verdict: "LEARN ENOUGH TO USE", sequencing: "Introduce at W04 and W06, apply at W11 and W12.", reasoning: "The Agentic Top 10 is new, authoritative and maps directly onto this program's threats — goal hijack, tool misuse, identity and privilege abuse, memory and context poisoning. At an Awareness baseline recognise the four relevant categories rather than memorising ten. For the LLM list, TEACH THE CONCEPTS AND DO NOT CHASE NUMBERING ACROSS TWO LIVE EDITIONS — see tracks.D.identifier_policy: canon states no LLM0x identifier.", source: "R5"}
    - {id: "TR-23", technology: "OAuth", verdict: "LEARN ENOUGH TO USE", sequencing: "W12 and month 04, once the BOA needs scoped CRM tokens.", reasoning: "Teach scopes and token lifetime; skip protocol internals. Short lifetime is a stronger control than careful redaction, because any credential in an agent's context is a candidate for exfiltration through the output channel.", source: "R5"}
    - {id: "TR-24", technology: "RBAC/ABAC", verdict: "LEARN ENOUGH TO USE", sequencing: "RBAC at month 06; ABAC only if an exercise needs a context-dependent rule.", reasoning: "RBAC first because it matches the per-tool least-privilege profile shape already built in W12. ABAC earns itself only where a rule genuinely depends on context, such as a value threshold.", source: "R5"}
    - {id: "TR-25", technology: "policy engines", verdict: "SKIP FOR NOW", sequencing: "Concept at month 06; no engine stood up.", reasoning: "The policy-enforcement / policy-decision separation is the right PATTERN and standing up a real engine is the wrong INVESTMENT LEVEL for a solo developer inside a 22.5h track. A hand-written pre-execution check function teaches the same lesson at a fraction of the operational cost, and the month-06 deliverable states explicitly what an engine would add.", source: "R5"}
    - {id: "TR-26", technology: "event-driven systems", verdict: "LEARN ENOUGH TO USE", sequencing: "W08, extended at month 04 with the outbox relay.", reasoning: "Small durable core: at-least-once, consumer idempotency, ordering versus commutativity, backpressure, poison messages, dead-letter. The insight to plant: ADOPTING A QUEUE CREATES THE IDEMPOTENCY REQUIREMENT. Event sourcing and CQRS as an architecture are UNDERSTAND CONCEPT ONLY — high cost, no surface, hard to reverse, and unusually seductive to exactly this profile.", source: "R7"}
    - {id: "TR-27", technology: "DDD", verdict: "UNDERSTAND CONCEPT ONLY", sequencing: "Concept in W02, with three exceptions taught there at LEARN ENOUGH TO USE depth.", reasoning: "CATEGORICAL, NOT BUDGETARY: strategic DDD is an ORGANISATIONAL technology solving multiple teams disagreeing about what a word means, and a solo builder has no such disagreement, so most of its value is structurally unavailable. The three exceptions with real surfaces, costing minutes: aggregate boundary equals transaction boundary; anti-corruption layer (recognised in the supplied bad system); value objects as newtypes. Mitigation against collapse into 'write some dataclasses': one aggregate/invariant table as a W02 deliverable.", source: "R7"}
    - {id: "TR-28", technology: "GoF", verdict: "LEARN ENOUGH TO USE", sequencing: "W02 and W08, taught AT their surfaces and never as a catalogue.", reasoning: "The REVISED SEVEN only: Strategy, Adapter, State-as-data, Command, Decorator, narrow Repository, transaction boundaries. Observer is CUT as actively harmful in this context — teaching it as the queue pattern installs a wrong model in someone who must internalise at-least-once and backpressure — and Decorator takes its slot. The other sixteen are SKIP FOR NOW at recognition level; several ARE Python language features and teaching them as class hierarchies is teaching Java in Python. This is BR-120's first challenge answered.", source: "R7"}
    - {id: "TR-29", technology: "Fowler enterprise patterns", verdict: "LEARN ENOUGH TO USE", sequencing: "W02, W08 and month 04; roughly 2h total.", reasoning: "Five patterns with named surfaces: Gateway (highest ROI — the anti-corruption layer under a cheaper name, and the home for retry policy, rate limiting and idempotency keys), Service Layer (where the transaction boundary, the state transition and the outbox write live together — the pattern that makes the outbox CORRECT rather than merely present), narrow Repository, Transaction Script (the correct DEFAULT at this size; Domain Model is the aspiration), and Optimistic Offline Lock (ADDED — a version column is the cheapest correct concurrency control for W08). The catalogue is REFERENCE, not reading: look patterns up, do not read cover to cover.", source: "R7"}
    - {id: "TR-30", technology: "distributed systems fundamentals", verdict: "LEARN DEEPLY", sequencing: "W02–W03, deepened at W08.", reasoning: "NARROWLY: partial failure, at-least-once, idempotency, crash windows, leases, timeout as the only failure detector, orphan reclaim. Nothing here is new KNOWLEDGE for a Working-knowledge learner; all of it is new EVIDENCE — which is exactly what a concept-strong / operation-weak profile lacks. The academic tier — consensus internals, CRDTs, vector clocks, quorum replication, CAP taxonomy — is UNDERSTAND CONCEPT ONLY and lives in the glossary: you CONSUME consensus, you never implement it, and studying it is a multi-week tax with no surface.", source: "R7"}

# ---------------------------------------------------------------------------
# LOW ROI — populated from the brief's SIX "avoid obsolete learning" challenges,
# which are BARE PROSE LINES, not bullets. A list extractor returns ZERO items
# for that whole section, which is exactly why they are enumerated here.
# ---------------------------------------------------------------------------

low_roi:
  source_requirement: "BR-120"
  home_file: "reference/low-roi-and-cuts.md"
  brief_challenges:
    - id: "LR-01"
      question: "Do I really need to memorize every GoF pattern?"
      verdict: "NO."
      answer: >-
        Seven, taught at their surfaces, is the whole return — and one of the brief's own seven is
        replaced. Several GoF patterns ARE Python language features: Strategy is a function,
        Command is a callable or dataclass, Iterator is a generator, Decorator is @, Singleton is
        a module, Adapter is often a Protocol. Teaching them as class hierarchies is teaching Java
        idiom in a Python codebase. Several are actively harmful to cargo-cult in 2026 — Singleton
        first, because it is global mutable state that is hostile to testing and concurrency and,
        in a multi-process platform, is simply a lie; agents reach for it readily because it
        saturates their training data. The catalogue's ceremony was largely compensation for C++
        and Java circa 1994, which places it in the 'loses value when code is cheap' column by its
        own logic. The remaining sixteen are recognition-only at zero hours.
      reclaimed_to: "The revised seven at their surfaces in W02 and W08, plus the generated-code review checklist in W04."
    - id: "LR-02"
      question: "Do I need to become an expert in one vector database?"
      verdict: "NO."
      answer: >-
        This is a solo-operator, sub-10M-vector, single-node context where pgvector's simplicity
        dominates — and where Postgres is already running from W02 as the state store, queue, lock
        and outbox. The transferable concept is HOW FILTERING INTERACTS WITH ANN STRUCTURE, and why
        that is a security question and not only a performance one; that concept is fully captured
        by building one permission-filtered index and reading one clear published account of
        filtered traversal. Tuning HNSW construction parameters or learning a second query DSL does
        not serve the brief's breadth goal and trades directly against the permission-filtering and
        evaluation-metric hours that are load-bearing.
      reclaimed_to: "W05's permission pre-filter and leak proof; W06's frozen eval set and metrics."
    - id: "LR-03"
      question: "Do I need deep ML mathematics for my objectives?"
      verdict: "NO."
      answer: >-
        The differentiating skill is EVALUATING AND OPERATING model-based systems, not training
        them. This developer needs to select, run and evaluate pretrained models as black boxes
        with known contracts and published scores. Deriving contrastive loss, transformer attention
        from first principles, or how a benchmark's tasks are constructed would come directly out
        of the hands-on build-and-measure hours that close the ACTUAL gap — which the competency
        baseline identifies as systems integration, not ML theory.
      reclaimed_to: "W05–W06 retrieval build and measurement; W10's judge-reliability work, which IS the rigorous part and is about experimental design rather than mathematics."
    - id: "LR-04"
      question: "Do I need to build an LLM from scratch?"
      verdict: "NO."
      answer: >-
        Intellectually excellent, near-zero ROI here. It teaches how a transformer works; it does
        not teach why your pipeline opened three pull requests for one issue. Every failure this
        program is built to prevent lives above the model, in the harness, the state machine, the
        retry classification and the trust boundary.
      reclaimed_to: "The entire engineering column."
    - id: "LR-05"
      question: "Do I need Kubernetes?"
      verdict: "NO — CONDITIONALLY. Not now, and not for the stated reason."
      answer: >-
        Zero surface: one node, one Postgres, git worktrees for isolation. This would be learning an
        ops tool for a scale problem that does not exist and will not appear in this program. But
        the ban is CONDITIONAL and the condition matters: the brief bars Kubernetes 'merely because
        it is industry standard', not absolutely. If a client requires it, it is roughly two weeks
        to learn WITH A REAL SURFACE, which is strictly better than learning it now without one.
        check-antigoals MUST NOT hard-ban the string — see anti_goals.conditional_handling.
      reclaimed_to: "Docker for Postgres and for the W12 sandbox, which is the actual operational need."
    - id: "LR-06"
      question: "Do I need LangChain abstractions beyond the parts I use?"
      verdict: "NO."
      answer: >-
        The durable concept behind the framework — checkpoint at step boundaries, resume from the
        last checkpoint, trade recovery granularity against latency — transfers completely to the
        hand-built state machine, and the specific API surface does not need memorising for a
        platform explicitly not adopting a framework. Read the durable-execution page once, use it
        to sanity-check your own step boundaries, move on. The frameworks' real investment is in
        PRODUCTIONISATION — retries, backoff policy, cross-region, multi-tenant queueing,
        dashboards — not in the mechanism, and the mechanism is what this program needs to own.
      reclaimed_to: "W02–W03's hand-built state machine, which R2 explicitly endorses building by hand."
  additional_rows:
    - {id: "LR-07", item: "LeetCode", verdict: "NO — CONDITIONALLY", reasoning: "The funnel is cold outreach to companies buying AI engineering capability, evidenced by portfolio artifacts. Nobody in that funnel runs a whiteboard algorithm screen. But the brief's ban is conditional on justification, and if the learner's month-12 decision turns toward a large-company Staff role with an algorithmic screen, that is a justification. check-antigoals must not hard-ban the string.", source: "R7"}
    - {id: "LR-08", item: "Kafka / RabbitMQ / SQS product comparison", verdict: "NO", reasoning: "The lesson is SEMANTIC — at-least-once, competing consumers, visibility timeout, dead-letter. Semantics transfer; product knowledge does not, and it expires.", source: "R7"}
    - {id: "LR-09", item: "Redis and Redlock", verdict: "NO", reasoning: "Duplicates Postgres capability and teaches the most contested locking primitive in the area.", source: "R7"}
    - {id: "LR-10", item: "Event sourcing and CQRS as an architecture", verdict: "NO", reasoning: "High cost, no surface, hard to reverse, and unusually seductive to exactly this profile.", source: "R7"}
    - {id: "LR-11", item: "Consensus internals (Raft, Paxos), CRDTs, vector clocks, CAP debates", verdict: "NO", reasoning: "You consume consensus via Postgres; you never implement it. Glossary entries only.", source: "R7"}
    - {id: "LR-12", item: "Microservices decomposition", verdict: "NO", reasoning: "One service, one user.", source: "R7"}
    - {id: "LR-13", item: "Hexagonal / Clean Architecture as doctrine", verdict: "NO", reasoning: "The useful 10% is 'depend on interfaces at the edges', which Gateway and Adapter already teach concretely. The rest is layer ceremony with a naming argument attached.", source: "R7"}
    - {id: "LR-14", item: "TLA+ and formal methods", verdict: "NO — ON BUDGET, NOT ON MERIT", reasoning: "Genuinely well-suited to verifying a state machine and the one item R7 would defend someone choosing anyway — but a multi-week investment before it produces anything, and a 39h track at a hard floor cannot hold it. NAMED EXPLICITLY as a month-06+ stretch so the learner knows it was rejected on budget rather than on merit.", source: "R7"}
    - {id: "LR-15", item: "Building on the Agent SDK library instead of the CLI binary", verdict: "NO", reasoning: "Technically interesting, but it explicitly requires API-key billing and defeats the zero-marginal-EUR premise. Revisit only if the metered fallback becomes the primary path.", source: "R1"}
    - {id: "LR-16", item: "Chasing exact published quota numbers", verdict: "NO", reasoning: "One vendor does not publish weekly limits at all; the other's figures are partly temporary and boost-dependent. Further searching will not produce a citable number. MEASURE EMPIRICALLY — that is what W01's 0.25h task is for.", source: "R1"}
    - {id: "LR-17", item: "Deep-diving eval-framework internals beyond 'what niche does it fill'", verdict: "NO", reasoning: "The suite needs one framework built deep, not a four-tool survey.", source: "R4"}
    - {id: "LR-18", item: "Memorising current OTel GenAI attribute names", verdict: "NO", reasoning: "Development status and actively churning. Learn to read the current spec at instrumentation time and pin the version.", source: "R4"}
    - {id: "LR-19", item: "Deep protocol-level study of sandbox implementations", verdict: "NO", reasoning: "Disproportionate for a 22.5h track at an Awareness baseline. The concept — container is not a hard security boundary, microVM is hardware isolation — is teachable in one paragraph without operating either.", source: "R5"}
    - {id: "LR-20", item: "Standing up a real policy engine for the intent-gate pattern", verdict: "NO", reasoning: "Correct pattern, wrong investment level. A hand-written check function teaches the same lesson.", source: "R5"}
    - {id: "LR-21", item: "Chasing numeric injection-defense effectiveness percentages", verdict: "NO — AND FORBIDDEN", reasoning: "No independently verified primary benchmark meeting the sourcing bar exists. Do not let the learner anchor on unsourced numbers. Canon forbids stating any such percentage; measure attack success rate against your OWN system instead, which is the brief's requirement anyway.", source: "R5"}
    - {id: "LR-22", item: "Further email-versus-LinkedIn channel benchmark research", verdict: "NO", reasoning: "None of the available sources is independently verifiable and the program is scoped to email. More research here would not change a near-term decision.", source: "R6"}
    - {id: "LR-23", item: "Enterprise-scale RPA prioritisation frameworks", verdict: "NO", reasoning: "Built for internal enterprise teams evaluating hundreds of processes — a scale and context mismatch for a solo consultant evaluating single-digit opportunities per week.", source: "R6"}

