# canon.yaml — AI-Native Engineering Program, authoritative source of truth.
#
# RULE FOR ALL PROSE LANES: every number, identifier, verdict, stage semantic and
# week allocation in the generated repository MUST come from this file verbatim.
# Prose expands rows. Prose never invents. If a fact is missing, emit [[GAP:id]]
# and write a row to .omc/research/canon-gaps.md. Do not guess.
#
# Authoring order and provenance:
#   - .omc/handoffs/g0-research.md  BINDING. Overrides the plan wherever they conflict.
#   - .omc/plans/ai-native-roadmap-plan.md (v5) C2/C3/C4 = schema, hours, weeks.
#   - .omc/plans/user-constraints.md = user-supplied answers (see user_supplied_inputs).
#   - .omc/research/RB-R8.md = brief_requirements[] verbatim; AUTHORITATIVE ON COUNTS.
#   - .omc/research/RB-R1..R7.md = triage verdicts, exercises, resources, rationale.
#
# A # VERIFICATION block at the end of this file states, per assertion, whether it
# passes, and lists every deviation from the plan with its reason.

meta:
  version: "1.1.0"
  generated_at: "2026-08-25"
  horizon_months: 12
  detailed_weeks: 12
  calendar_weeks: 18
  calendar_weeks_note: >-
    RAISED 14 -> 18 AT G5, on evidence, by user decision. The week-04 budget audit estimated the
    week's work bottom-up BEFORE reading its stated budget and returned 21.9h against 15.0h — theory
    +50%, building +40%, testing +100%, customer discovery +7%. The exemplar critic independently put
    the same week over, though lower, and the two agreed specifically that the failure-exercise task
    was about 2x underpriced. The one bucket that survived is the one already costed bottom-up from
    published unit rates, which is exactly the correlated-optimism signature A0 said seven blind audits
    could not detect and which no build-time check can find. See calendar_model below for what changed
    and what deliberately did not.
  budget_audit_g8:
    method: "Six weeks estimated bottom-up BEFORE reading the stated hours, selected by rule: every week with no recalibration behind it (W01, W02, W03) plus a sample of those that do (W05, W07, W10). W09 and W12 excluded — both sit behind the M1 and M2 recalibrations."
    result: "ALL SIX WEEKS FAIL at least one bucket; W03 fails all four. Aggregate 110.65h against 90.0h stated, +22.9%."
    structural_finding: >-
      The overrun is NOT evenly spread noise. It is concentrated in Building (+32.5% overall) and Testing
      (+65.0% overall), recurring in five of six weeks for Building and ALL SIX for Testing. That is the
      same pattern the W04 audit found, and it appears in W01, W02 and W03 -- none of which have any
      recalibration behind them. The customer-discovery bucket, the one column already costed bottom-up
      from published unit rates, is the only one that holds.
    largest_single_delta: "T-w07-2 (build S3, the ten-stage Sentry lane). Canon prices it at 4.0h — already the largest single task in the programme — and the audit put it at 6.0h, +50%. W07 is packed at 15.0h with no slack to absorb it, and the file forbids financing overruns from the business bucket."
    calendar_verdict: >-
      The 18-calendar-week estimate HOLDS, with less margin than advertised. Measured 1.229x against the
      1.5x buffer the calendar already implies (18 files-weeks / 12 files). Extrapolated: ~221h of real work
      against 180h stated, about 14.8 fifteen-hour weeks, under the 18-week ceiling. But the buffer is being
      consumed by a PREDICTABLE DEFECT — engineering-hour under-costing — rather than by genuine contingency.
    theory_share_finding: >-
      Under the auditor's INDEPENDENT classification the theory share is 14.6%, not the 19.4% canon states —
      roughly half the brief's 25-30% floor, consistently, across all six weeks. Theory hours did not move
      much in absolute terms (17.5h -> 16.2h); the share fell because building and testing absorbed more
      hours in the bottom-up pass, enlarging the denominator. Canon's own figure is optimistic rather than
      conservative.
    action: >-
      RECORDED, NOT RE-PLANNED. The calendar decision already absorbs the aggregate overrun, and re-pricing
      147 tasks against one auditor's estimate would substitute a second single estimate for the first —
      the exact failure A0 names. This block is the input the M1 hour recalibration reads: it tells the
      learner which buckets to expect to overrun before they have four weeks of their own actuals, and
      W03 is flagged as the week most likely to break confidence because it fails on every axis at once.

  calendar_model:
    rule: >-
      A WEEK-FILE IS A UNIT OF WORK, NOT A UNIT OF TIME. The learner works ~15h per calendar week; a
      week-file whose real effort exceeds 15h simply spans more than one calendar week. Twelve
      week-files therefore occupy roughly 16 calendar weeks of work plus two floating catch-up weeks, which is where meta.calendar_weeks: 18 comes from.
    why_this_and_not_a_scope_cut: >-
      meta.scaling_modes already states the programme's own rule — HOURS CHANGE DEPTH AND CALENDAR,
      NEVER THE P0 DELIVERABLE SET. Cutting scope to defend a calendar the estimates cannot support
      would invert it, and Track B is at a declared hard floor (a fourth cut is not an available trade,
      C8). Extending the calendar is the rule applied, not an exception to it.
    what_did_not_change: >-
      Every hour table, every check-hours assertion and every 15.0h week total. Those are the PLANNED
      budget and they still reconcile exactly. What changed is the claim about wall-clock, which was
      never checked by anything and was the only place the optimism could hide.
    funnel_consequence: >-
      This helps rather than hurts, and the reason should be stated where the user can see it. Funnel
      lead time is in CALENDAR time — a send matures in 1–3 weeks regardless of how long a week-file
      takes. A longer calendar means MORE sends have matured by the time each week-file is reached, so
      matured_sends_by_end_of_week is a conservative floor under the new model, not a stale figure.
      The watch and activation thresholds are sited against week-file boundaries and remain valid;
      under a stretched calendar they fire, if anything, slightly later and against more evidence.
    retrospective_anchoring: >-
      M1, M2 and M3 are anchored to WEEK-FILES 04, 09 and 12, not to calendar months. They already
      were. Under the stretched calendar M1 lands around calendar week 5-6 rather than 4 — which is
      strictly better for its mandated hour recalibration, because it reads more logged actuals.
    honest_residual: >-
      The two reviewers DISAGREED on magnitude — 5.0h vs 2.5h on the largest task, because the critic
      had context about an existing state-machine capability that the blind auditor deliberately did
      not. Real underestimation is established; its size is not. 18 is therefore an estimate carrying
      the same uncertainty as the 14 it replaces, and the instrument that settles it is not another
      audit — it is the M1 recalibration against the user's own logged hours.          # 12 week-files span 14 calendar weeks; 2 declared float weeks.
  baseline_hours_per_week: 15.0
  total_planned_hours: 180.0
  start_date_assumption: "2026-08-31"
  scaling_modes:
    - mode: "8h"
      rule: "P0 rows only; no stretch; business floor 2.5h held; the calendar EXTENDS — the same P0 set takes ~18 months. Hours change depth and calendar, never the P0 deliverable set."
    - mode: "15h"
      rule: "Baseline. Every week row in weeks[] is written at this budget."
    - mode: "25h"
      rule: "Stretch required; a second failure exercise per week; Track F pulls forward; phase 1 compresses to ~8 weeks."
  in_flight_recovery_rule: "Never double up after a missed week — slip the calendar. Each week's `recovery` field names the subset to run in the 8h mode. CLARIFIED AT G5b (G5b-01): the enumerated items must FIT WITHIN 8h, not sum to exactly 8.0. W04's happens to reconcile to 8.0; W05's sums to 7.25 and is correct — a subset that fits with room to spare is a better recovery plan than one filled to the ceiling, because a compressed week is compressed precisely when estimates are already under pressure. Prose renders the subset as canon lists it and asserts no total. Sends in particular are never doubled up: the funnel has lead time that hours cannot compress."
  compressed_week_rule:
    statement: >-
      A COMPRESSED WEEK RUNS ITS NAMED SUBSET AND CLOSES DONE-COMPRESSED, NOT DONE. The two are
      different states and the difference is written down rather than felt.
    what_may_be_left_unticked: >-
      Any deliverable the subset does not fund. It is not dropped: the week's `recovery` names it by
      id and names the week it is carried to, and the same applies to any acceptance criterion whose
      tasks were deferred. Nothing may be ticked on partial evidence, and nothing may disappear
      because a week was hard.
    relation_to_done: >-
      The Definition of DONE is unchanged and still requires every deliverable ticked and every
      criterion true. DONE-COMPRESSED is a DIFFERENT and weaker claim, stated as such: the subset's
      deliverables are ticked, its criteria are true, and every remaining id is listed with its
      destination week. A week that closes DONE-COMPRESSED is DONE only once the carried ids land.
    relation_to_the_p0_rule: >-
      "The same P0 rows ship at every budget" is a claim about the PROGRAMME, not about any single
      week. That is precisely why the 8h mode extends the calendar to roughly 18 months rather than
      cutting scope — the P0 set still ships, later. Reading the rule as "every P0 row ships inside
      the compressed week itself" makes it unsatisfiable, which is how a subset that drops a P0
      deliverable came to look like a contradiction rather than like the calendar working.
    recovery_field_shape: >-
      Every weeks[].recovery therefore names four things: the subset with its hours, what is
      deferred and to where, which deliverable ids stay UNTICKED, and which acceptance criteria go
      with them. A recovery naming only the subset leaves the learner to work out the consequences
      in the week they are already under pressure.
  weekly_review_budget:
    inside_the_15: false
    expected_minutes: 20
    statement: >-
      THE WEEKLY REVIEW SITS OUTSIDE THE 15 HOURS. Filling templates/weekly-review.md, scoring the
      week 0-100 against its own stated rules and updating SCOREBOARD is expected to take about 20
      minutes.
    why_not_funded: >-
      Every week's tasks total exactly 15.0 and Track P funds retrospectives at W04, W09 and W12
      only, so the review has never had an hour behind it. Two repairs were available: price it at
      ~0.5h in all twelve weeks, which would re-open all seven check-hours assertions and cut half
      an hour of engineering from every week to pay for bookkeeping; or state plainly that it sits
      outside, as the stretch goal already does. Canon takes the second. It is the smaller lie to
      retire: the 15.0 is a budget for the WORK, and the instrument that measures the work is not
      itself the work.
    where_stated: ["README.md#weekly-review-process", "templates/week-template.md", "templates/weekly-review.md"]
  imputation_rate:
    model_tier: "sonnet-tier"
    input_eur_per_mtok: 1.85
    output_eur_per_mtok: 9.25
    basis: "USD 2.00/10.00 per Mtok (R1, [VOLATILE], priced through 2026-08-31) converted at 0.925 EUR/USD."
    measured_from: "week_01"
    note: "Used only to impute a EUR figure for `cost/task` under flat-rate subscription execution, where the realised marginal cost is EUR 0 and the metric would otherwise be degenerate."
  theory_cap_hours_per_week: 3.5
  business_floor_hours_per_week: 2.5
  deliverables_cap: 4
  subsystems_cap: 1
  failure_exercises_per_week: [1, 2]
  no_git_commits: true
  no_git_commits_reason: "User instruction, captured 2026-08-25. Phase G9 is dropped. All build output stays as uncommitted working-tree files."
  repo_visibility: "private-now/public-capable"
  repo_visibility_rule: "No client names or prospect PII in tracked files. `*.local.md` is gitignored and holds real data. business/ templates carry placeholder identities so the repo can be flipped public with no scrub."

# ---------------------------------------------------------------------------
# FRAMING — the brief's identity, philosophy and success statements.
# README's mandated "target professional profile" and "philosophy" sections
# expand FROM HERE. Without this block those sections have nothing to expand
# from and the prose lane has no option but to invent.
# ---------------------------------------------------------------------------

framing:
  home_files: ["README.md", "phases/phase-01-foundations.md"]
  what_this_is:
    verbatim: "engineering program / operating system"
    statement: "This is NOT a list of things to study. It is a rigorous, execution-oriented professional development system that lives in a repository and is followed week by week. The final result must read more like an engineering program or operating system than a learning roadmap."
    requirement_ref: "BR-002"
    operationalised_by: "Every week has a runnable demo command, a deliverable checkbox list and acceptance criteria that are binary predicates, numbers or artifact paths. A reader can execute this repository. That is the test of whether it is a program rather than a roadmap."
  target_profile:
    not_this: "an 'AI prompt engineer'"
    verbatim: "AI-native Staff Engineer / Agent Systems Engineer / Technical Founder capable of taking a problem from business intent to reliable production system."
    requirement_ref: "BR-018"
    operationalised_by: "The phrase 'from business intent to reliable production system' is the whole arc: Track E and F supply the business intent, Tracks A/B/C supply the system, Track D and the evaluation harness supply the 'reliable'. A programme that stopped at 'operate' could not claim this profile, which is why the difficulty ladder ends at `sell`."
  philosophy:
    verbatim: "ABILITY TO BUILD > KNOWLEDGE"
    statement: "Every substantial topic must end in one or more observable artifacts."
    requirement_ref: "BR-019"
    banned_completion_claim: "I watched/read/studied X"
    banned_evidence_claim: "I studied it"
    operationalised_by: "Theory is capped at 3.5h/week and 19.4% overall. Every P0 concept carries a mastery_check_ref resolving to a deliverable id. Every competency column maps to deliverable ids. `evidence_source: real | simulated` is carried per business artifact so a demonstration can never be mistaken for evidence."
  apprenticeship_framing:
    verbatim: "one-year apprenticeship"
    statement: "Designed as a ONE-YEAR APPRENTICESHIP for someone who wants to remain highly valuable if coding itself becomes increasingly automated."
    requirement_ref: "BR-144"
    operationalised_by: "This is the reason the durable-concept set is exactly the generated-code review checklist: the concepts that rise in value are the ones describing failures invisible to a generate-and-test loop — second call, crash window, concurrency, unstated external assumption."
  success_statement:
    failure_form: "I know AI tools."
    success_form: "I can independently design, build, evaluate, secure, operate and commercialize AI-native software systems, while using coding agents to multiply my engineering throughput."
    requirement_ref: "BR-145"
    seven_verbs:
      note: "The success statement names SEVEN separately checkable capabilities. Each maps to evidence, and none is satisfied by a claim."
      rows:
        - {verb: "design", evidence_ids: ["D-w01-4", "D-w04-3", "D-w12-3"], ladder_stage: "explain"}
        - {verb: "build", evidence_ids: ["D-w02-1", "D-w05-1", "D-w08-1"], ladder_stage: "implement"}
        - {verb: "evaluate", evidence_ids: ["D-w06-1", "D-w10-1", "D-w10-2"], ladder_stage: "measure"}
        - {verb: "secure", evidence_ids: ["D-w11-2", "D-w12-2", "D-m05-2"], ladder_stage: "secure"}
        - {verb: "operate", evidence_ids: ["D-w03-1", "D-w08-1", "D-w09-1"], ladder_stage: "operate"}
        - {verb: "commercialize", evidence_ids: ["D-w08-4", "D-w12-4", "D-m07-1"], ladder_stage: "sell"}
        - {verb: "use coding agents to multiply throughput", evidence_ids: ["D-w01-1", "D-w04-1", "D-m04-1"], ladder_stage: "operate"}
    build_around: "EVIDENCE of that capability, never a claim about it."
  exercise_framing:
    requirement_refs: ["BR-020", "BR-021"]
    purpose: "These eight are what make the philosophy CHECKABLE rather than decorative. Any exercise in this repository must be rewritable into the Good column; an exercise that can only be stated in the Bad column has not been designed yet. check-schema's task-shape rule and the G6 lane critics both use this pair as the test."
    bad:
      - {verbatim: "learn LangGraph", why_bad: "Names a technology and no observable. It cannot be completed, only abandoned."}
      - {verbatim: "learn distributed systems", why_bad: "Names a field. There is no state of the world that differs after it is done."}
      - {verbatim: "read about RAG", why_bad: "Names a consumption activity. It is the completion claim the philosophy explicitly bans."}
      - {verbatim: "learn prompt injection", why_bad: "Names a threat without an attacked system, so nothing distinguishes having learned it from having heard of it."}
    good:
      - {verbatim: "implement a resumable LangGraph workflow with persisted state and human approval", homed_at: "D-w02-1 and D-w04-1 — built HAND-ROLLED rather than on the named framework, per the durable-execution triage; the checkable properties (persisted state, resumability, human approval) are unchanged and are what the exercise proves."}
      - {verbatim: "implement an idempotent event consumer and demonstrate duplicate delivery handling", homed_at: "D-w03-1 — and hardened past the brief's shape: the naive version is built FIRST and its duplicates counted, because for a concept-strong learner seeing the duplicates is the entire value."}
      - {verbatim: "compare BM25, vector and hybrid retrieval on a real dataset using an evaluation set", homed_at: "D-w05-1 — the three-way bake-off against a label set frozen before any tuning."}
      - {verbatim: "build an indirect-prompt-injection attack suite and show which attacks are blocked", homed_at: "D-w11-2 — at least three techniques, attack success rate against control before and after one structural mitigation."}
    note: "Three of the four Good framings map to a single canon deliverable each and one maps to two. That is a deliberate coverage check: the brief supplied four exemplars of what a well-formed exercise looks like, and if any of them had no home, the exercise design would have drifted from the philosophy it claims."

# ---------------------------------------------------------------------------
# QUESTION SETS — the brief's question-and-reflection layer, VERBATIM.
# Six citations in this file depend on `monthly_retrospective`; before this
# block existed they pointed at nothing. A prose citation is not id-shaped, so
# the reference audit did not catch it. See VERIFICATION section 8.
# ---------------------------------------------------------------------------

question_sets:

  monthly_retrospective:
    count: 10
    requirement_ref: "BR-114"
    home_file: "months/*.md#retrospective"
    cadence: "End of every month, all twelve. Answered in the month file, not the week file."
    rule: "All ten are answered every month. An unanswered question is not a thin month, it is an incomplete retrospective."
    questions:
      - {id: "RQ-01", text: "What can I now build that I could not build 30 days ago?"}
      - {id: "RQ-02", text: "Which concept remains theoretical?"}
      - {id: "RQ-03", text: "What broke in real usage?"}
      - {id: "RQ-04", text: "What did agents repeatedly fail at?"}
      - {id: "RQ-05", text: "What should become a reusable skill?"}
      - {id: "RQ-06", text: "What should become a deterministic tool instead of an LLM decision?"}
      - {id: "RQ-07", text: "Where did human approval prove necessary?"}
      - {id: "RQ-08", text: "What business problems appeared repeatedly?"}
      - {id: "RQ-09", text: "What should I stop learning?"}
      - {id: "RQ-10", text: "What should I double down on?"}
    eleventh_output:
      id: "RQ-11"
      text: "A CANON DELTA."
      status: "ADDED BY THIS PROGRAMME, not by the brief. The ten questions produce answers; the eleventh output turns an answer into an edit. Without it the retrospective is a diary."
      procedure: "answer -> record what changed -> `make delta` -> edit canon.yaml, bump meta.version -> `make regen` -> `make check`. Documented in HOW-TO-EDIT.md."
    rq10_operationalisation:
      note: >-
        RQ-10 is OPERATIONALISED, NOT REPLACED. It is the programme's only value
        instrument, and asked bare it invites a preference rather than a finding. It is
        therefore asked with a defined response attached: 'Which of the last four weeks'
        deliverables taught you something you did not already know?' ANY TRACK SCORING 0
        OF 4 TRIGGERS A CANON DELTA RE-PITCHING THAT TRACK, and cut_list[] rows carry a
        `track` tag so the answer has somewhere to go. The brief's question is asked
        verbatim as RQ-10; this is the follow-up that makes it actionable.
    rq09_operationalisation:
      note: "RQ-09 is answered against low_roi[] rather than freehand. A thing you should stop learning that is not already in low_roi[] becomes a new row, with its verdict and reasoning, in the same delta."

  closing_design_questions:
    count: 9
    requirement_ref: "BR-124"
    home_file: "reference/difficulty-ladder.md#closing-questions"
    home_note: >-
      HOMED EXPLICITLY, because the difficulty ladder is a DIFFERENT list of nine and
      gesturing at that file was not a home. These nine are an OUTCOME REQUIREMENT, not a
      list to reproduce: the brief frames them as 'I should not merely know how to make an
      agent work, I should know how to answer', which means each must be answerable
      AGAINST THE BUILT SYSTEMS with evidence, not answered in the abstract.
    rule: "Each question carries `answerable_from` — the deliverable ids whose existence makes the answer evidenced rather than asserted. The M12 checkpoint tests all nine against the built systems."
    questions:
      - {id: "CQ-1", text: "Why is this architecture correct?", answerable_from: ["D-w01-4", "D-w04-3", "D-w12-3", "D-m04-3"], note: "The workflow-versus-agent classification plus three architecture reviews plus the saga-versus-outbox classification defence."}
      - {id: "CQ-2", text: "What happens when it fails?", answerable_from: ["D-w03-1", "D-w08-1", "D-m04-1", "D-m04-2"], note: "100 killed replays, a 30%-kill chaos run, and a compensation-failure suite that reaches a defined terminal state rather than hanging."}
      - {id: "CQ-3", text: "How do we know it works?", answerable_from: ["D-w06-1", "D-w10-1"], note: "Retrieval metrics against a frozen label set, and a three-tier gate with a justified statistical threshold."}
      - {id: "CQ-4", text: "How do we know it remains correct?", answerable_from: ["D-w10-1", "D-w09-1"], note: "agent_regression re-executes what ships; the pinned convention version and per-run metadata make a silent upstream change detectable."}
      - {id: "CQ-5", text: "What can an attacker do?", answerable_from: ["D-w11-2", "D-w12-2", "D-m05-2"], note: "Measured attack success rate against the learner's own system, per technique, before and after each structural mitigation."}
      - {id: "CQ-6", text: "What should require human approval?", answerable_from: ["D-w04-1", "D-w04-2", "D-w12-1"], note: "The placement audit: irreversible or high-impact state changes, with the gate rendering the literal proposed call."}
      - {id: "CQ-7", text: "What happens at 10× scale?", answerable_from: ["D-w08-1", "D-w09-1"], note: "The honest answer is bounded by what was measured. The chaos run and the quota model say what breaks first — database, quota or disk — and the W08 reflection question forces that answer to be stated with its evidence."}
      - {id: "CQ-8", text: "How much does it cost?", answerable_from: ["D-w01-2", "D-w09-1", "D-w10-1"], note: "Measured quota headroom, the composite cost/task metric, and a measured judge cost per item — plus the recorded finding that the binding constraint is quota rather than euros."}
      - {id: "CQ-9", text: "What measurable business value does it create?", answerable_from: ["D-w08-4", "D-w12-4", "D-m07-1"], note: "THE WEAKEST-EVIDENCED OF THE NINE, and stated as such. An ROI calculation from a measured baseline and a scorecard verdict are real instruments, but under the corrected funnel the baseline may be a Stage-1 simulated one through month 07. The honest answer at M3 names the evidence_source tag."}

  exercise_reflection_examples:
    count: 5
    requirement_ref: "BR-075"
    home_file: "templates/experiment-template.md"
    purpose: "The brief supplies these as EXAMPLES of reflection questions that force ARCHITECTURAL REASONING rather than recall. They are the shape every exercise's Reflection section and every week's `reflection` field is written against — not a list to paste."
    questions:
      - {id: "XQ-1", text: "What failure mode did your original design miss?"}
      - {id: "XQ-2", text: "What would fail under 10× load?"}
      - {id: "XQ-3", text: "Which parts must be idempotent?"}
      - {id: "XQ-4", text: "What authority should the agent not have?"}
      - {id: "XQ-5", text: "What would you change before allowing this into production?"}
    application_rule: "Every week's `reflection` list has at least three entries, each specific to that week's build, and each must be answerable ONLY by someone who did the work — a question answerable from the reading alone has failed the shape."

# ---------------------------------------------------------------------------
# TRACKS
# `surface` names where the concept is actually exercised in a built system.
# A P0 concept with an empty `surface` is a G2 failure (C3.4).
# `why_it_matters` is required on every P0 and answers BR-040/BR-025: why the
# concept still matters in the age of generated code.
# priority ∈ {P0, P1, P2, P3} per BR-135.
# kind ∈ {durable, implementation} per BR-025/BR-026.
# ---------------------------------------------------------------------------

tracks:

  A:
    id: "A"
    name: "Track A — Agentic Engineering"
    home_file: "tracks/agentic-engineering.md"
    hours: 43.0
    share_of_180: "23.9%"
    entry_competency: "Independent implementation (user-supplied). Track A is NOT introductory. The learner already delegates real work to coding agents; W01 opens on harness anatomy and an S0 build, not on 'what is a coding agent'."
    artifacts_bought: >-
      43.0h buys: a single-task runner that drives the literal `claude` CLI as an unattended
      subprocess and captures a diff (S0); a typed cross-harness adapter that EXPOSES rather
      than smooths harness differences; a verification + automated-review + human-approval +
      PR + CI pipeline (S2); a Sentry diagnosis lane run against 20 real labelled historical
      issues (S3); an OTel-instrumented observability and cost-accounting layer (S5); and a
      measured weekly quota-headroom figure that the whole cost architecture depends on.
    concepts:
      - id: "C-001"
        name: "coding agents"
        priority: "P0"
        kind: "implementation"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "S0 — the runner invokes `claude -p` as a subprocess with no TTY attached."
        mastery_check_ref: "D-w01-1"
        why_it_matters: "The unit of work stopped being a keystroke and became a delegated task. What survives is not knowing an agent exists but knowing what a task must contain to be delegable: a bounded contract, a verification command, and an acceptance predicate a machine can evaluate. The learner already operates agents interactively; the gap is operating them unattended, where nothing can ask a clarifying question."
      - id: "C-002"
        name: "agent harness architecture"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "The HarnessAdapter Protocol and its Claude and Codex strategies; the month-04 cross-harness comparison."
        mastery_check_ref: "D-w01-2"
        why_it_matters: "R1's harness literature shows the loop around a model changes outcomes more than swapping the model, with a documented 32x cost spread at identical code quality. Code that hard-codes `call Claude` bakes a vendor choice into business logic; code that routes through a typed adapter survives a harness swap. The classic adapter failure is a least-common-denominator interface that erases exactly the differences you built it to observe (R7) — so this adapter must expose differences in typed form."
      - id: "C-003"
        name: "tool calling"
        priority: "P0"
        kind: "implementation"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "S0's allowed-tool policy file; S2's verification gate; every `execute_tool` span in S5."
        mastery_check_ref: "D-w01-1"
        why_it_matters: "A tool call is the point where a language model acquires the ability to change the world, and therefore the point where every reliability and security property is decided. Generated orchestration code treats the tool list as configuration; it is in fact the system's entire authority surface."
      - id: "C-004"
        name: "skills"
        priority: "P1"
        kind: "implementation"
        first_week: "W04"
        home_file: "tracks/agentic-engineering.md"
        surface: "The SKILL.md files under .claude/skills/ that package `how to run tests` and `how to open a PR` for S2."
        mastery_check_ref: "D-m06-4"
        why_it_matters: "R2's heuristic: a skill is a stable playbook, a tool is a changing action. Packaging a stable procedure as a skill removes it from the prompt, which is the only place it could drift."
      - id: "C-005"
        name: "agents vs workflows"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "The stage-by-stage classification of the platform pipeline written in W01 and enforced by S1a's transition table."
        mastery_check_ref: "D-w01-4"
        why_it_matters: "R2 marks this the single highest-leverage architectural decision in the pipeline. Workflows orchestrate the model through predefined code paths — the engineer owns every branch. Agents let the model direct its own process — the engineer owns the goal and the guardrails. A generating model defaults to making everything an agent loop, because that is the pattern that saturates its training data, and that forfeits the predictability, replayability and cheap debugging a workflow gives you for the 90% of the pipeline that does not need model-driven branching. Get this boundary wrong in week 1 and every subsequent week compounds the mistake."
      - id: "C-006"
        name: "context engineering"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "The explicit per-run context construction in the adapter — system prompt, MCP config, agent set and settings passed per invocation rather than inherited from the working directory."
        mastery_check_ref: "D-w01-2"
        why_it_matters: "Default `-p` loads hooks, skills, MCP servers and CLAUDE.md automatically, so context is ambient and directory-dependent; `--bare` forces the caller to construct every piece explicitly (R1). Generated orchestration code that assumes the agent will just know project conventions is depending on non-reproducible ambient state. Deterministic, CI-grade behaviour requires the context be an input, not an environment."
      - id: "C-007"
        name: "task decomposition"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "The task-file schema consumed by S0 and the subagent call-graph reconstruction in W02."
        mastery_check_ref: "D-w02-1"
        why_it_matters: "Decomposition is where the human still holds the advantage, because it requires knowing what `done` means for this codebase. Under generated code the bottleneck moved from production to specification: a task decomposed into verifiable units is cheap to execute and cheap to check; one decomposed into `implement the feature` is neither."
      - id: "C-008"
        name: "multi-agent orchestration"
        priority: "P1"
        kind: "implementation"
        first_week: "W08"
        home_file: "tracks/agentic-engineering.md"
        surface: "S4's worker pool: N concurrent workers, one worktree each, claiming from one Postgres queue."
        mastery_check_ref: "D-w08-1"
        why_it_matters: "R1: orchestration code that does not track a call-graph id per spawned subagent loses the ability to attribute cost, latency or a stalled branch to the decomposition step that caused it. Attribution is the whole reason to orchestrate rather than to loop."
      - id: "C-009"
        name: "parallel work"
        priority: "P0"
        kind: "durable"
        first_week: "W08"
        home_file: "tracks/agentic-engineering.md"
        surface: "S4 — concurrent workers proved not to strand, duplicate or collide under a chaos run that kills at least 30% of workers mid-task."
        mastery_check_ref: "D-w08-1"
        why_it_matters: "R7's sharpest operational claim: the correct answer to contention is usually partition, not lock. One worktree per task, one branch per task, disjoint ownership — contention that cannot arise needs no coordination. An agent asked for `a distributed lock` produces a lock-shaped thing that acquires and releases convincingly; what it omits is what happens when the lease expires while the holder is still working, and that omission is invisible in the code."
      - id: "C-010"
        name: "Git worktrees / isolated environments"
        priority: "P0"
        kind: "implementation"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "Every S0 run executes inside a worktree, never the main checkout; S4 adds lifecycle and orphan reclaim."
        mastery_check_ref: "D-w01-1"
        why_it_matters: "Any multi-agent pipeline running concurrent agents against a single checkout is racing itself; worktree-per-agent is the durable pattern regardless of which harness executes inside it (R1). The primitive is shallow — `git worktree add` — and the payoff is the elimination of a whole class of second-write-wins bug."
      - id: "C-011"
        name: "model routing"
        priority: "P1"
        kind: "implementation"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "Pinned model ids in the adapter's run metadata; the month-04 fallback policy."
        mastery_check_ref: "D-w01-2"
        why_it_matters: "An agent-side regression gate is only meaningful if the model version is pinned; routing through an alias silently changes the thing under test (R1). Pinning is not a performance decision, it is a measurement precondition."
      - id: "C-012"
        name: "retries"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        home_file: "tracks/agentic-engineering.md"
        surface: "The retry classification truth table in S1b and the aggregate retry budget in S5."
        mastery_check_ref: "D-w03-1"
        why_it_matters: "A model emits `for attempt in range(3): ... sleep(1)` because that is the modal retry loop in its training distribution, and it is wrong three ways — no jitter, no error classification, no aggregate budget (R7). None are typing problems; all three are semantic judgements about your domain. Only you know that `a PR already exists for this branch` is a success, not an error. The human supplies the truth table; the agent supplies the loop."
      - id: "C-013"
        name: "resumability"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        home_file: "tracks/agentic-engineering.md"
        surface: "S1b — a killed run resumes from the last recorded step boundary, proved under 100 replays with injected kills."
        mastery_check_ref: "D-w03-1"
        why_it_matters: "An agent pipeline has two amnesias, process death and context death, and a persisted state machine answers both (R7). A resume is not a rerun: it is a fresh attempt carrying prior state, and because the work unit is nondeterministic, the retry does something different. That distinction has no textbook and is where this program teaches something the literature does not."
      - id: "C-014"
        name: "checkpoints"
        priority: "P1"
        kind: "durable"
        first_week: "W02"
        home_file: "tracks/agentic-engineering.md"
        surface: "The step-boundary records in S1a written before the effect, not after."
        mastery_check_ref: "D-w02-1"
        why_it_matters: "R2: checkpointing persists DATA; durable execution persists EXECUTION. A generated resumable agent that saves state to a row per step looks durable in a demo and has not solved the harder problem — the worker running step 7 is gone and something else must claim step 7."
      - id: "C-015"
        name: "human approval"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        home_file: "tracks/agentic-engineering.md"
        surface: "S2's approval gate and BOA-S1's draft-only outreach with an audit trail; hardened in S7b to cover irreversible actions."
        mastery_check_ref: "D-w04-1"
        why_it_matters: "R5: the gate is an architectural control, not UX. It must sit where a state change is irreversible or high-impact, and it must show the LITERAL proposed tool call plus its evidence, never a paraphrase. Generated approval-gate code routinely approves the agent's summary of what it will do; an injected instruction can produce a truthful-looking summary while the underlying call differs. That is approval theatre, not a gate."
      - id: "C-016"
        name: "long-running tasks"
        priority: "P1"
        kind: "implementation"
        first_week: "W02"
        home_file: "tracks/agentic-engineering.md"
        surface: "S1a's `waiting_on_input` state and the lease renewal path in S4."
        mastery_check_ref: "D-w02-1"
        why_it_matters: "A task that outlives its process is the ordinary case in an agent platform, not the exception, because model calls are slow and human approvals are slower. Everything about the design follows from accepting that up front rather than discovering it."
      - id: "C-017"
        name: "task queues"
        priority: "P0"
        kind: "implementation"
        first_week: "W08"
        home_file: "tracks/agentic-engineering.md"
        surface: "S4 — a Postgres queue with `SELECT ... FOR UPDATE SKIP LOCKED` claiming, leases, and a dead-letter path."
        mastery_check_ref: "D-w08-1"
        why_it_matters: "Agents are good at building queue plumbing and bad at deciding whether you need one (R7). Adopting a queue is not an infrastructure decision, it is a decision to make every downstream handler idempotent — and that causal link is the most under-taught thing in the area."
      - id: "C-018"
        name: "agent permissions"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "The versioned permission-policy file that is an input to every S0 run; extended to per-tool least-privilege profiles in S7b."
        mastery_check_ref: "D-w01-1"
        why_it_matters: "Both harnesses treat an approval request in unattended mode as a hard failure or a hang (R1). Code that assumes an unattended run can silently ask and wait will stall. The permission policy must be a first-class, versioned, per-run input — which also makes it reviewable, which is what turns it into a security control."
      - id: "C-019"
        name: "cost/token budgets"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/agentic-engineering.md"
        surface: "The W01 quota-headroom measurement; S5's per-run cost accounting; `cost_budget.quota_model`."
        mastery_check_ref: "D-w01-2"
        why_it_matters: "In an agent platform the failure mode of a naive retry loop is a bill, not an error (R7) — and under a flat-rate subscription it is not even a bill, it is a stall, which is worse because it is silent. The binding resource here is quota, not euros; measuring it in week 1 is what makes every later size decision derived rather than guessed."
      - id: "C-020"
        name: "automated PR generation"
        priority: "P0"
        kind: "implementation"
        first_week: "W04"
        home_file: "tracks/agentic-engineering.md"
        surface: "S2 opens real PRs against the user's own GitHub repository; S3 does the same from a Sentry issue."
        mastery_check_ref: "D-w04-1"
        why_it_matters: "The PR is the first effect the platform has that reaches a human inbox, which makes it the first effect that cannot be compensated. `One PR per branch name` is a natural key that makes the create idempotent by construction — and preferring natural keys over idempotency bookkeeping is the operational lesson (R7)."
      - id: "C-021"
        name: "automated review"
        priority: "P0"
        kind: "implementation"
        first_week: "W04"
        home_file: "tracks/agentic-engineering.md"
        surface: "S2's single-axis automated review; extended to the five-axis multi-axis review capability S2b at month 04."
        mastery_check_ref: "D-w04-3"
        why_it_matters: "Hand-written code fails in a distribution your instincts were trained on. Generated code is syntactically clean, idiomatic, well-named and wrong at boundaries, under repetition, under concurrency and under failure (R7). The review correlates moved; the heuristics did not. The rewritten checklist is the highest-leverage artifact in the program and it is versioned for that reason."
      - id: "C-022"
        name: "agent feedback loops"
        priority: "P1"
        kind: "durable"
        first_week: "W10"
        home_file: "tracks/agentic-engineering.md"
        surface: "S6's three-tier regression gates feeding the harness and prompt layer; the M1/M2/M3 canon deltas feeding the program itself."
        mastery_check_ref: "D-w10-1"
        why_it_matters: "Without a frozen eval set predating a prompt or scaffold change, an improvement is unfalsifiable — the harness silently overfits to whatever it currently does (R4). A feedback loop with no baseline is a rumour mill."

  B:
    id: "B"
    name: "Track B — Software Architecture & System Design"
    home_file: "tracks/system-design.md"
    hours: 39.0
    share_of_180: "21.7%"
    hours_history: "~57.0 → 42.0 → 39.0 across three plan revisions. Every cut was individually justified and each is recorded in the ADR. A FOURTH CUT IS A HARD STOP, not an available trade. cut_list[] rows carrying track: B are pre-tagged so an M1 overrun has somewhere else to go first."
    entry_competency: "Distributed systems: Working knowledge (user-supplied), concept-strong / operation-weak. The learner knows what idempotency IS and has not shipped and operated an idempotent consumer, a saga/outbox, or a distributed lock under real load. Nothing in this track explains what a concept is. Everything is about proving it, operating it, and knowing which ideas survive when an agent writes the code."
    artifacts_bought: >-
      39.0h buys: a durable task state machine on Postgres proved effectively-once under 100
      replays with kill -9 injected between the commit and each external call; a task queue with
      lease-based claiming, dead-lettering and worktree isolation proved to strand nothing and
      duplicate no effect under a chaos run; an aggregate/invariant table for the task domain; a
      versioned generated-code review checklist; a production failure-mode taxonomy wired into
      the state machine's error classification; and three architecture reviews against 14 named
      defect classes, one of them on a deliberately bad system supplied to the learner.
    concepts:
      - id: "C-023"
        name: "boundaries"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/system-design.md"
        surface: "The HarnessAdapter contract; the three modules subjected to the W02 boundary regeneration test."
        mastery_check_ref: "D-w02-2"
        why_it_matters: "Two arguments, both STRENGTHENED under agents (R7). Context economy: a module whose contract fits in context while its implementation need not is exactly the unit an agent works inside reliably; across a leaky boundary it must hold N implementations at once to be semantically correct, cannot, and emits plausible code with wrong assumptions about the other side. And regeneration granularity — when code is cheap the powerful move is to throw a module away and regenerate it, and that move is only safe at the granularity of a narrow testable contract. Boundary quality has stopped being a maintainability preference and become a capability gate."
      - id: "C-024"
        name: "coupling/cohesion"
        priority: "P0"
        kind: "durable"
        first_week: "W02"
        home_file: "tracks/system-design.md"
        surface: "The module map of the platform; the deep-module ratio (public symbols vs implementation size) measured per module in the W02 regeneration test."
        mastery_check_ref: "D-w02-2"
        why_it_matters: "Coupling is now measurable rather than aesthetic: the W02 exercise deletes an implementation, hands an agent only the interface, docstring and tests, and records what it gets wrong. Every failure names a specific piece of out-of-module knowledge the implementation silently depended on. That is a coupling metric with an experiment behind it."
      - id: "C-025"
        name: "deep modules"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/system-design.md"
        surface: "The adapter: one narrow invoke/stream/capture/report contract over two very different CLI surfaces."
        mastery_check_ref: "D-w01-2"
        why_it_matters: "Ousterhout argued for deep modules from human cognitive load; under an agent it becomes literal and measurable (R7). The W02 regeneration test is a direct empirical test of his central claim, and running it against his interface-vs-implementation framing is the highest-value hour in this track."
      - id: "C-026"
        name: "modularity"
        priority: "P0"
        kind: "durable"
        first_week: "W02"
        home_file: "tracks/system-design.md"
        surface: "Package structure of the platform: adapter, state machine, queue, gateways, verification, observability as separately regenerable units."
        mastery_check_ref: "D-w02-2"
        why_it_matters: "DRY was always two arguments under one name — do not TYPE the same thing twice, and do not ENCODE THE SAME DECISION twice. The first has collapsed; the second has not moved. Three explicit near-identical handlers now often beat one parameterised abstraction with three flags, because duplication costs nothing to produce and abstraction costs comprehension forever. The rule: duplicate code freely, never duplicate a decision (R7)."
      - id: "C-027"
        name: "domain modeling"
        priority: "P0"
        kind: "durable"
        first_week: "W02"
        home_file: "tracks/system-design.md"
        surface: "The Task / Attempt / Run / Verification / Effect / IdempotencyKey / CommitSha vocabulary, and the aggregate/invariant table that names each invariant, its owning aggregate and the transaction that enforces it."
        mastery_check_ref: "D-w02-1"
        why_it_matters: "The least obvious argument in the track: your domain model is the COMPRESSION SCHEME FOR YOUR INSTRUCTIONS (R7). Output quality is bounded by the vocabulary you supply — with a real domain model a prompt is one unambiguous sentence; with `data`, `handle()` and `process()` every prompt re-explains the domain and every re-explanation is a chance to drift. Value objects become cheap and high-value in Python, because a frozen wrapper over `str` carries semantics to the agent at the call site. Naming was always a comprehension investment; it is now additionally a generation-quality investment. Stated as a design principle with its mechanism, NOT as an empirical finding — R7 flags that no controlled study establishes the effect size."
      - id: "C-028"
        name: "state machines"
        priority: "P0"
        kind: "durable"
        first_week: "W02"
        home_file: "tracks/system-design.md"
        surface: "S1a — an enum column plus a legal-transition table in Postgres, with each step's completion recorded durably before the next step starts."
        mastery_check_ref: "D-w02-1"
        why_it_matters: "An enum plus a legal-transition table is a MACHINE-CHECKABLE SPECIFICATION OF INTENT, which is exactly the artifact you want when a machine writes the code: invalid-transition tests are trivial to generate and catch a whole error class at near-zero cost. What stays human is what is not mechanical — which states exist, which transitions are legal, what `done` means. Design the machine, delegate the code. WARNING, per R7: the GoF State pattern (class per state, polymorphic dispatch) is the WRONG SHAPE for a durable machine, because state must outlive the process. Teach the machine, not the pattern."
      - id: "C-029"
        name: "transactions"
        priority: "P0"
        kind: "durable"
        first_week: "W08"
        home_file: "tracks/system-design.md"
        surface: "The dedup insert and the state transition committing in one transaction (S1b); the outbox row riding the same transaction as the transition (month 04)."
        mastery_check_ref: "D-w03-1"
        why_it_matters: "Taught small, deliberately. What bites at this scale: read-committed as Postgres' default and the lost update it permits under read-modify-write; `FOR UPDATE` and `SKIP LOCKED`; unique and partial indexes as the only reliable dedup primitive; and the fact that external APIs offer no isolation at all. An agent writes read-modify-write by default because it is the readable form, and read-modify-write is correct single-threaded and broken concurrently. Demanding a conditional update, a version column or a row lock is a review skill not detectable by reading code in isolation — only by reading it while holding a model of concurrent execution."
      - id: "C-030"
        name: "concurrency"
        priority: "P0"
        kind: "durable"
        first_week: "W08"
        home_file: "tracks/system-design.md"
        surface: "S4's N-worker chaos run: at least 30% of workers killed mid-task, zero tasks stranded, zero duplicated effects."
        mastery_check_ref: "D-w08-1"
        why_it_matters: "See C-009. Partition before you lock. The residual, once partitioning is exhausted, is a lease that can expire while its holder still works — and the holder does not find out. A lock without either a fencing token or an idempotent protected operation is a comfort blanket."
      - id: "C-031"
        name: "consistency"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        home_file: "tracks/system-design.md"
        surface: "The three dedup mechanisms enumerated and each demonstrated in the W03 replay harness."
        mastery_check_ref: "D-w03-1"
        why_it_matters: "The honest version at this scale is small and shrinking it serves the learner. Linearizability, the CAP taxonomy and consensus internals are recognition-only: you CONSUME consensus via Postgres, you never implement it. What you must be able to state is which of your effects share a transaction with their record, and which do not."
      - id: "C-032"
        name: "queues"
        priority: "P0"
        kind: "durable"
        first_week: "W08"
        home_file: "tracks/system-design.md"
        surface: "S4 — built on Postgres, not adopted from a broker."
        mastery_check_ref: "D-w08-1"
        why_it_matters: "A queue is not a list you pop from. The durable concept is a lease: a worker claims a task for a bounded time, must ack before the lease expires or another worker may claim it, and repeated failure routes to a dead-letter path rather than an infinite retry loop (R2). Generated consumer code routinely omits lease logic entirely — fine until a worker can crash mid-task — and omits dead-lettering, so a poison message loops forever and starves the queue. Building it is the lesson; adopting Celery or SQS hides exactly those mechanics."
      - id: "C-033"
        name: "event-driven systems"
        priority: "P1"
        kind: "durable"
        first_week: "W08"
        home_file: "tracks/system-design.md"
        surface: "The outbox relay running as a separate process (month 04), so at-least-once is real rather than simulated."
        mastery_check_ref: "D-m04-2"
        why_it_matters: "The small durable core is at-least-once, consumer idempotency, ordering versus commutativity, backpressure, poison messages and DLQ. Teach ordering as `make handlers commutative or version them`, not as vector clocks. Event sourcing and CQRS are UNDERSTAND CONCEPT ONLY: high commitment, real operational cost, no surface here, hard to reverse — and unusually seductive to exactly this profile."
      - id: "C-034"
        name: "caching"
        priority: "P1"
        kind: "implementation"
        first_week: "W09"
        home_file: "tracks/system-design.md"
        surface: "Prompt/context caching in the adapter's cost accounting; memoised analysis keyed by commit SHA in S3."
        mastery_check_ref: "D-w09-1"
        why_it_matters: "DEMOTED from P0 to P1 on R7's recommendation, and the demotion is the teaching point. The classical content — write-through versus write-behind, invalidation, stampede protection — presumes read-heavy multi-user load this platform will never acquire. The two real surfaces are prompt/context caching, which is Track A economics, and content-addressing an analysis by commit SHA, which is a thirty-minute idea. Reallocated ~1h to the generated-code review checklist and the saga re-anchoring. This is a reallocation inside a declared hard floor, not a cut."
      - id: "C-035"
        name: "retries"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        home_file: "tracks/system-design.md"
        surface: "The retry classification truth table in S1b; the aggregate retry budget proved to bound spend under an induced failure storm in S5."
        mastery_check_ref: "D-w03-1"
        why_it_matters: "See C-012. Taught in the SAME WEEK as idempotency, deliberately: a retry is only safe if the operation is idempotent, and splitting them across weeks breaks the link that makes either one meaningful."
      - id: "C-036"
        name: "idempotency"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        home_file: "tracks/system-design.md"
        surface: "S1b's dedup table under a unique constraint, and the natural keys — one PR per branch name, one Notion page per task id, one git ref per branch — that make the external creates idempotent by construction."
        mastery_check_ref: "D-w03-1"
        why_it_matters: "The anchor concept of the track. A test suite records the invocations someone thought to write down, and essentially every test invokes the handler ONCE. An agent optimises against the tests and the ticket; neither mentions the second call. So it produces a handler that is locally correct and globally wrong, and nothing in the generation loop can catch it — the defect is invisible to the type checker, the linter, review-by-reading (the code IS fine for one call) and CI. It surfaces on the third retry as a duplicate PR. The durable skill is therefore not WRITING the idempotent handler, which an agent does correctly the moment you ask; it is knowing the demand exists, being able to state the key, and being able to PROVE absorption."
      - id: "C-037"
        name: "rate limiting"
        priority: "P0"
        kind: "durable"
        first_week: "W09"
        home_file: "tracks/system-design.md"
        surface: "The token bucket sitting ABOVE the retry layer in S5's middleware chain, so retries cannot bypass the budget."
        mastery_check_ref: "D-w09-1"
        why_it_matters: "The subscription quota is a global semaphore across concurrent workers — genuinely distributed resource management, unusually motivating because the failure mode is a stall or a bill rather than an exception. Bounding CONCURRENCY is usually more effective than bounding RATE. It is also the one place an adversary attacks you through your own automation (W09), making it a security concept wearing a reliability hat."
      - id: "C-038"
        name: "distributed locks"
        priority: "P0"
        kind: "durable"
        first_week: "W08"
        home_file: "tracks/system-design.md"
        surface: "Postgres advisory locks plus leases plus a fencing token in S4; the choice justified in writing."
        mastery_check_ref: "D-w08-1"
        why_it_matters: "Redis and Redlock are SKIP FOR NOW (R7): introducing Redis to teach distributed locks means teaching an unsafe lock and then teaching the caveats. Advisory locks, leases and fencing tokens teach the safe version at lower operational cost. The examinable question is what happens if the lease expires while the LLM call is still in flight."
      - id: "C-039"
        name: "outbox pattern"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        home_file: "tracks/system-design.md"
        surface: "Month 04 — the outbox row written in the same transaction as the state transition, with a separate relay process, fault-injected at every boundary between commit and last external call."
        mastery_check_ref: "D-m04-2"
        why_it_matters: "You cannot atomically commit a transaction and perform an HTTP call. Code shaped `db.commit(); github.create_pr()` has a crash window, and CRASH-WINDOW BUGS ARE THE DEFINITIONAL CLASS THAT GENERATED CODE NEVER SURFACES — the naive version passes every test absent a crash, and no agent injects a kill between two statements unprompted. This is the second structural argument, after idempotency, for why certain fundamentals rise: they describe failures invisible to the generate-and-test loop. Knowing the outbox exists is what makes you write the test that kills the process at the right line."
      - id: "C-040"
        name: "sagas"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "tracks/system-design.md"
        surface: "RE-ANCHORED, per R7, onto TASK-LIFECYCLE TEARDOWN at month 04 — create worktree → create branch → push → open PR → verification fails → compensate: delete the remote branch, close the PR, remove the worktree, release the lease (last), mark failed."
        mastery_check_ref: "D-m04-3"
        why_it_matters: "The three-way GitHub/Notion/Sentry fan-out is NOT a saga and calling it one teaches a real confusion. If the Notion write fails after the PR is created, the correct behaviour is retry Notion forever, not delete the PR — those are independent, non-conflicting side effects, which is at-least-once fan-out with a durable outbox and is complete without any saga concept. A saga is defined by COMPENSATION, and the platform's genuine one is task teardown, which has every property that makes sagas hard: compensations can themselves fail, compensations must be idempotent, ordering matters, and SOME STEPS ARE NOT UNDOABLE because the PR notification already reached a human inbox. Compensation is not rollback; intermediate states were observed. The durable skill is the discriminating rule — independent effects go to outbox plus retry plus idempotent receivers; ordered steps requiring semantic undo go to a saga with compensations. A learner who can classify a new problem into one of those buckets has the skill; one who has built both but thinks they are the same does not."
      - id: "C-041"
        name: "failure recovery"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        home_file: "tracks/system-design.md"
        surface: "The orphan-reclaim path in S4; the defined terminal state a permanently failing compensation must reach rather than hanging (month 04)."
        mastery_check_ref: "D-w08-1"
        why_it_matters: "Failure detection by timeout is the textbook impossibility made concrete: a worker dies holding a task in RUNNING and you cannot distinguish slow from dead. R7 names this the most under-appreciated item in the platform and exactly the operate-don't-explain material this learner lacks. Leases, heartbeats, visibility timeouts and orphan reclaim are the whole answer, and every one of them is an operational choice with a trade — false reclaim against slow reclaim."
      - id: "C-042"
        name: "migrations"
        priority: "P2"
        kind: "implementation"
        first_week: "M08"
        home_file: "tracks/system-design.md"
        surface: "One ADR at month 08 on the schema-evolution strategy for the task tables."
        why_it_matters: "Schema change is where an agent is most dangerous and least detectable: it will write the migration you asked for and not the backfill you did not think to ask for, because a migration is a code fact and a backfill is a domain fact. The residue worth one ADR is the ORDERING RULE — expand, backfill, switch reads, contract — which is a decision no diff can carry."
        p2_reason: "C3.4's lenses audit found a weak surface: a solo repository with no external consumers and one deployment. The useful residue is one decision recorded once, not a fifteen-hour module. The brief mandates that major P2/P3 calls be explained (BR-136); this is that explanation."
      - id: "C-043"
        name: "API evolution"
        priority: "P2"
        kind: "implementation"
        first_week: "M08"
        home_file: "tracks/system-design.md"
        surface: "The same month-08 ADR, covering the internal tool/protocol surface between pipeline stages."
        why_it_matters: "The generated-code angle is versioning DISCIPLINE, not versioning mechanics. When regenerating a module is cheap, the temptation is to change its interface freely because the callers can be regenerated too — and that reasoning holds right up to the first caller you do not control. Deprecate-then-remove-with-a-floor is the habit that survives cheap regeneration."
        p2_reason: "Same audit, same verdict. The one durable idea worth carrying is MCP's feature-lifecycle policy — Active → Deprecated → Removed with a mandated minimum interval, deprecate-then-remove rather than yank-and-break (R2) — which is a governance concept applicable to the platform's own internal surface independent of whether MCP is adopted."
      - id: "C-044"
        name: "multi-tenancy"
        priority: "P0"
        kind: "durable"
        first_week: "W05"
        home_file: "tracks/system-design.md"
        surface: "REHOMED, per C3.4, from the single-user platform to the SECURE KNOWLEDGE AGENT — the permission-filtered index in SKA-S0, extended to RBAC/ABAC at month 06."
        mastery_check_ref: "D-w05-2"
        why_it_matters: "A single-user platform has no tenants, so teaching multi-tenancy there is teaching a lens with no surface. The SKA has real ones. And the rehoming is what makes the concept sharp rather than abstract: on a retrieval index, a tenancy decision and a security decision are the SAME decision, and getting it wrong produces a correctness bug and a disclosure bug simultaneously."
      - id: "C-045"
        name: "observability"
        priority: "P0"
        kind: "durable"
        first_week: "W09"
        home_file: "tracks/system-design.md"
        surface: "S5's OTel GenAI spans, cost attributes and `quota_stall_seconds`, exported per run with harness version and pinned model id."
        mastery_check_ref: "D-w09-1"
        why_it_matters: "The fastest-rising P0 in the track, and not for the usual reason. When YOU write code you carry a mental model and logs supplement it. When an agent writes it you have NO SUCH MODEL — only a review-derived approximation. The trace stops supplementing and becomes your primary instrument for knowing what the system does. Two amplifiers: the work is nondeterministic, so single-run debugging weakens and aggregate observability strengthens; and reviewing generated code at volume is only tractable if you can ask production what the code DID rather than reason about what it SHOULD do. Observability moves from ops hygiene to epistemic infrastructure."
      - id: "C-046"
        name: "reliability"
        priority: "P0"
        kind: "durable"
        first_week: "W09"
        home_file: "tracks/system-design.md"
        surface: "Latency budgets, the aggregate retry budget, and the unbounded-retry defense proved under an induced failure storm in S5."
        mastery_check_ref: "D-w09-1"
        why_it_matters: "Nygard's stability antipatterns — integration points, cascading failures, blocked threads, slow responses, unbounded result sets — are precisely the failure shapes a three-integration platform acquires, and they are the half of the learner's gap that no amount of concept reading fixes. The defenses (timeouts, circuit breaker, bulkheads, fail fast, back pressure) are cheap to state and only meaningful once you have watched the failure they prevent."
    pattern_triage:
      br_040_rule:
        requirement_ref: "BR-040"
        statement: >-
          "Explain why each selected pattern matters IN THE AGE OF GENERATED CODE." The brief's
          mandate is PER-PATTERN, not per-track, and it is the only place the brief ties design
          patterns to the AI-native thesis. Every kept pattern below therefore carries a
          `why_it_matters` answering that question SPECIFICALLY — not the easier question of
          whether the pattern fits this platform.
        self_correction: >-
          The first draft of this block argued the thesis forcefully for the patterns it CUT
          (Singleton "saturates their training data"; the catalogue as "compensation for C++ and
          Java circa 1994") and argued platform-fit for most of the patterns it KEPT. That
          asymmetry is a tell: it is easy to say why a pattern is obsolete and harder to say what
          about it got MORE valuable, so an author under time pressure writes the easy half. The
          brief asks for the hard half. Fixed below.
      revised_seven:
        - name: "Strategy"
          verdict: "keep"
          surface: "The HarnessAdapter Protocol with its Claude and Codex strategies."
          why_it_matters: >-
            One decision with Adapter, not two. The generated-code argument is about the SIZE OF
            AN INSTRUCTION: an agent asked to "add Codex support" against a codebase with no
            Strategy seam will edit every call site, because that is the literal reading of the
            request and nothing tells it which call sites are the vendor boundary and which are
            incidental. With the seam named, the same request becomes "implement CodexStrategy
            against this Protocol" — one file, one contract, a blast radius you can review in a
            sitting. Strategy stopped being about polymorphism and became about making a change
            SPECIFIABLE. A boundary you can name is a task you can delegate.
        - name: "Adapter"
          verdict: "keep"
          surface: "The typed invoke / stream events / capture diff / report tokens / report cost / report exit reason vocabulary."
          why_it_matters: >-
            The sharpest constraint in the set, and it runs AGAINST the model's instinct. An LLM
            asked to unify two APIs will CONVERGE them, because smoothing differences is what
            "unify" means in its training distribution and because a smaller interface reads as
            cleaner in review. Here that instinct is exactly wrong: cross-harness comparison is
            this programme's point, so THE DIFFERENCES ARE THE MEASUREMENT. The adapter must be
            specified as "expose these differences as typed fields", or you will be handed a
            beautiful interface that has silently deleted your experiment — and the deletion will
            not show up as a bug, because everything still runs.
        - name: "State-as-data"
          verdict: "keep — most load-bearing"
          surface: "S1a: an enum column plus a legal-transition table in Postgres."
          why_it_matters: >-
            Two arguments, both specific to generation. First, a transition table is a
            MACHINE-CHECKABLE SPECIFICATION OF INTENT, so the invalid-transition suite can be
            GENERATED from it rather than written — the cheapest real test coverage in the
            programme, and coverage of a class of error that review-by-reading never catches.
            Second, and less comfortable: an agent asked for "a state machine" produces the GoF
            class-per-state form, because that is what the pattern NAME retrieves, and that form
            dies with the process. To get the right thing you must ask for "an enum column and a
            transition table in Postgres" — which means you must already know the answer. That is
            the whole shape of this era: the human supplies the design, the agent supplies the code.
        - name: "Command"
          verdict: "keep — better than it looks"
          surface: "The task record as a reified, serialised, replayable command; the middleware chain wraps it."
          why_it_matters: >-
            Reification is what makes an agent's work AUDITABLE, and auditability is what you need
            precisely when you did not write the code. Generated orchestration passes closures and
            callbacks around because that is idiomatic Python — and a closure cannot be
            serialised, inspected in a database, rendered in an approval payload for a human, or
            compensated after the fact. It also matters because the work unit is NONDETERMINISTIC:
            "run it again" produces a different run, while "replay this command" preserves the
            INTENT. Reifying the task is the difference between a system you can interrogate and
            one you can only re-execute and hope.
        - name: "Decorator"
          verdict: "PROMOTED into Observer's slot"
          surface: "The middleware chain: retry, timeout, rate limiting, cost accounting, tracing, caching."
          why_it_matters: >-
            Cross-cutting concerns are the canonical thing an agent bolts on INLINE — a retry loop
            here, a timer there, a token counter in a third place — because each addition is
            locally correct and none of them looks like a design decision. The result is a system
            in which nobody can state what order the concerns apply in, AND ORDER IS THE ENTIRE
            SEMANTICS: a rate limiter below the retry cannot bound your budget, because retries
            bypass it; a timeout outside the retry times the whole sequence rather than the
            attempt; tracing inside the retry hides the attempts you most need to see. A named,
            ordered chain converts an invisible property into a reviewable list — which is the
            general move this whole track teaches.
        - name: "Repository"
          verdict: "keep — narrow only"
          surface: "A typed collection-like boundary over task persistence."
          why_it_matters: >-
            This is a REGENERATION argument. An agent given raw ORM access writes queries at every
            call site, each individually reasonable, and the persistence contract becomes
            undiscoverable — at which point no module can be thrown away and regenerated, because
            its dependencies are everywhere. A narrow repository is what keeps task persistence a
            regenerable unit. And it carries its own generated-code failure mode: asked for "a
            repository", an agent produces a generic Repository[T] over the ORM — an abstraction
            over an abstraction — because that is what the pattern name retrieves. Narrow is the
            instruction, and it has to be stated.
        - name: "transaction boundaries"
          verdict: "keep the concept, drop the implementation"
          surface: "Which operations are atomic; why the outbox row rides the same transaction as the state transition."
          why_it_matters: >-
            The concept in this set with no code to write and the highest REVIEW value, which is
            exactly the profile of a skill whose worth rose. An agent cannot infer what must be
            atomic — that is a domain fact, not a code fact — so it commits wherever the code
            reads tidily, and the resulting diff is indistinguishable from a correct one. "What is
            atomic, who commits, and why does the outbox row share the transaction with the state
            transition" cannot be answered by reading the diff; it can only be answered by reading
            it WHILE HOLDING A MODEL OF THE DOMAIN AND OF CONCURRENT EXECUTION. Generated code
            made that kind of reading scarce and therefore valuable.
      cut_from_the_brief_seven:
        - name: "Observer"
          verdict: "CUT — demoted to recognition-only"
          reason: "Weakest of the seven and mildly harmful. In-process Observer is synchronous, in-memory, unretried, unbounded, and propagates consumer exceptions to the publisher. A durable queue is none of those. Teaching Observer as the queue pattern installs an actively wrong model in someone who must internalise at-least-once, backpressure and consumer idempotency. Its slot goes to queue semantics in W08."
          why_it_matters: "The generated-code angle is the reason the cut is worth making rather than merely defensible: an agent asked for 'an event system' will produce in-process Observer, because it is the shape that dominates the training data, and it will look correct until the first consumer crash. Naming the pattern as WRONG HERE is what stops you accepting that output."
        - name: "Factory"
          verdict: "NOT PROMOTED"
          reason: "A module-level function returning the right harness for a config string needs no pattern instruction. Abstract Factory is on the actively-harmful list."
          why_it_matters: "Naming a trivial function after a pattern invites an agent to build the hierarchy the name implies. The instruction 'write a function that returns the right harness' produces a function; the instruction 'add a factory' produces a class tree."
      actively_harmful_to_cargo_cult:
        - {name: "Singleton", why_harmful: "Most harmful. Global mutable state, hostile to testing and concurrency, and in a multi-process platform it is simply a lie. Agents reach for it readily because it saturates training data."}
        - {name: "Abstract Factory", why_harmful: "Deep hierarchies for one concrete family; textbook speculative generality, whose justification — 'changing it later is expensive' — has collapsed."}
        - {name: "Template Method", why_harmful: "Built to hoist shared hand-written code into a base class: a labour saving with a coupling cost. The saving is gone; the cost remains."}
        - {name: "Visitor", why_harmful: "Defensible in compilers, misapplied everywhere else; a dispatch dict or a match statement says it plainly."}
        - {name: "Mediator", why_harmful: "Reliably degenerates into a god object."}
        - {name: "Flyweight / Prototype / Interpreter", why_harmful: "Flyweight solved a memory cost that no longer binds; Prototype is copy.deepcopy; Interpreter means 'I am writing a DSL', nearly always wrong for a solo builder."}
        - {name: "Bridge", why_harmful: "Indistinguishable from Strategy often enough that teaching both is pure hour tax."}
      recognition_only_zero_hours: ["Iterator", "Facade", "Proxy", "Composite", "Builder", "Chain of Responsibility", "Memento", "Observer"]
      recognition_only_note: "Three are already taught under other names: Chain of Responsibility IS the middleware chain, Proxy is part of the harness adapter, Memento is subsumed by 'persist your state'. Several others are Python language features — Strategy is a function, Command is a callable or dataclass, Iterator is a generator, Decorator is @, Singleton is a module, Adapter is often a Protocol. The GoF catalogue's ceremony was largely compensation for C++ and Java circa 1994, which places it in the 'loses value' column by its own logic. RECALL value for these is near zero; RECOGNITION value — knowing the thing exists, what it is called, when it applies — is undiminished and arguably higher, because recognition is what lets you name it in a prompt and notice its absence in a review."
      fowler:
        - name: "Gateway"
          verdict: "earn it — highest ROI here"
          surface: "GitHubGateway, NotionGateway, SentryGateway (month 04). The anti-corruption layer under a cheaper name."
          why_it_matters: >-
            Each external API's weirdness — its retry semantics, its idempotency story, its rate
            limit, its error taxonomy — lives NOWHERE IN THE CODE unless a gateway holds it. An
            agent writing a call inline re-derives that knowledge per call site from what the docs
            say generally, and gets it subtly and differently wrong each time. A gateway makes
            "how we talk to GitHub" one reviewable file, which is also the only place a
            natural-key decision can be ENFORCED rather than remembered. When you are reviewing
            code you did not write, the number of places a fact can hide is the number of places
            you have to look.
        - name: "Service Layer"
          verdict: "earn it — underrated"
          surface: "Where the transaction boundary, the state transition and the outbox write live together."
          why_it_matters: >-
            THE PATTERN THAT MAKES THE OUTBOX CORRECT RATHER THAN MERELY PRESENT. Generated code
            will happily write the outbox row and the state transition in two separate
            transactions: both statements are individually correct, the diff reads cleanly, and
            nothing in it signals that the two must be atomic. A service layer gives that
            requirement a PLACE — one function whose entire purpose is to own the boundary — so
            the requirement is enforced structurally rather than remembered by whoever reviews
            next. Requirements that live only in a reviewer's head do not survive volume.
        - name: "Repository"
          verdict: "earn it, narrow"
          surface: "Task persistence only."
          why_it_matters: "See the revised-seven entry: this is a regeneration argument. A discoverable persistence contract is what keeps a module throw-away-and-regenerate-able; scattered inline queries make every module depend on everything."
        - name: "Transaction Script"
          verdict: "earn it — the brave call"
          surface: "The correct DEFAULT for a solo platform; Domain Model is the aspiration."
          why_it_matters: >-
            The pattern whose ECONOMICS ACTUALLY CHANGED, which is why it is the brave call rather
            than a lazy one. Reaching for a rich Domain Model was always justified by "changing it
            later is expensive"; later is now cheap, so the justification evaporated while the
            comprehension cost stayed exactly where it was. And a script is the shape an agent
            MODIFIES most reliably: load, decide, transition, write effects, in one readable
            sequence with no dispatch to chase. Fowler framed this as a complexity trade rather
            than a maturity ladder; generated code moved the trade.
        - name: "Optimistic Offline Lock"
          verdict: "earn it — ADDED, not on the brief's list"
          surface: "A `version` column: the cheapest correct concurrency control for W08's overlapping-agents exercise."
          why_it_matters: >-
            The cheapest correct answer to the defect an agent produces most reliably.
            Read-modify-write is correct single-threaded, broken concurrently, and IDENTICAL IN
            BOTH CASES when you read it — an agent writes it by default because it is the readable
            form. You cannot catch that by reading; you catch it by demanding a conditional update.
            A version column converts the unanswerable review question "did you think about
            concurrency?" into a mechanical check on the schema, which is the kind of translation
            worth looking for everywhere.
        - name: "Data Mapper"
          verdict: "concept only"
          surface: "One rule: keep domain dataclasses distinct from ORM rows."
          why_it_matters: "The residue is worth one sentence because of what it prevents: if the type handed to the harness layer is also the persistence row, an agent asked to change persistence will edit the harness too — correctly, by its lights, because the type carries both meanings and nothing told it which one you meant."
        - name: "Unit of Work"
          verdict: "concept only"
          surface: "SQLAlchemy Session. Teach transaction boundaries."
          why_it_matters: "See transaction boundaries in the revised seven. The implementation is free; the question is not."
        - name: "Domain Model"
          verdict: "P2"
          surface: "Earns itself in exactly one place — the task/attempt/verification aggregate, where invariants are real."
          why_it_matters: "Where invariants are real it is the cheapest way to state them; where they are not, it is speculative generality with a respectable name — and speculative generality is precisely the category whose economic justification collapsed when code got cheap."
        - name: "rest of PoEAA"
          verdict: "skip"
          surface: "Identity Map (the ORM gives it), Lazy Load (a footgun), Active Record, Table Module, Front Controller, the MVC family, Session State."
          why_it_matters: "Web-at-scale answers to problems this programme lacks. Recognition value only — know the names so you can decline them deliberately when an agent proposes one."
      ddd:
        verdict: "UNDERSTAND CONCEPT ONLY, with three P0 exceptions"
        reason: "The load-bearing reason is categorical, not budgetary: STRATEGIC DDD IS AN ORGANISATIONAL TECHNOLOGY, NOT A DESIGN TECHNOLOGY. Bounded contexts, context maps, ubiquitous language and anti-corruption layers solve multiple teams disagreeing about what a word means. A solo builder has no such disagreement, so most of DDD's value is structurally unavailable regardless of teaching quality. That argument survives later scrutiny where a budget argument would not."
        p0_exceptions:
          - "Aggregate boundary = transaction boundary = consistency boundary. It is the rule telling you what belongs in one transaction, and it makes the outbox obviously correct rather than a memorised recipe. Teach the sentence, skip the book."
          - "Anti-corruption layer. Same idea as Gateway; name it once so the learner recognises it in the supplied bad system in architecture review #2."
          - "Value objects as newtypes. The only part of DDD whose value has clearly RISEN under generated code, because the type name carries semantics to the agent at the call site."
        risk_and_mitigation: "Concept-only DDD collapses into 'write some dataclasses' and the learner loses the discipline of asking what the invariants are and who enforces them. Mitigation, ~1h in W02: one aggregate/invariant table for the task domain — each invariant, its owning aggregate, and the transaction that enforces it. That makes the useful 20% a deliverable rather than a hope."

  C:
    id: "C"
    name: "Track C — Production AI Application Engineering"
    home_file: "tracks/ai-application-engineering.md"
    hours: 33.5
    share_of_180: "18.6%"
    entry_competency: "Retrieval / embeddings / search: Awareness (user-supplied, level 1). The learner has NEVER shipped BM25, vector or hybrid search, and has never measured retrieval quality with precision, recall or NDCG. Weeks 05–06 are genuinely from-zero. Pitch the entry down and give it runway; do not assume the vocabulary."
    artifacts_bought: >-
      33.5h buys: a permission-filtered hybrid retrieval layer (BM25 + local embeddings + a
      hand-implemented RRF fusion) with an automated test proving that the naive post-filter
      silently drops authorized results; a frozen labelled evaluation set built BEFORE any
      tuning, with NDCG@5, MRR and precision@5 reported per configuration; a local
      cross-encoder reranker with a measured lift and a measured latency cost; a cited-answer
      contract that rejects an answer whose citation is absent from retrieved context; and a
      20-task evaluation harness with three tiers of regression gate, an N=5 rerun policy and
      a justified pass-rate threshold.
    concepts:
      - id: "C-047"
        name: "embeddings"
        priority: "P0"
        kind: "implementation"
        first_week: "W05"
        home_file: "tracks/ai-application-engineering.md"
        surface: "SKA-S0 — Qwen3-Embedding-0.6B run locally at EUR 0, embedding the SKA corpus into a pgvector table."
        mastery_check_ref: "D-w05-1"
        why_it_matters: "The learner needs to SELECT, RUN and EVALUATE pretrained models as black boxes with known contracts and published scores — not train one. Deriving contrastive loss or attention internals is explicitly low ROI here (R3): the gap is systems integration, not ML theory, and math hours come directly out of the build-and-measure hours that close the real gap."
      - id: "C-048"
        name: "semantic search"
        priority: "P0"
        kind: "implementation"
        first_week: "W05"
        home_file: "tracks/ai-application-engineering.md"
        surface: "The embedding-only arm of the W05 three-way bake-off."
        mastery_check_ref: "D-w05-1"
        why_it_matters: "Semantic retrieval fails silently and specifically: on error codes, SKUs, names, acronyms and negation, because embeddings compress these near their positive counterparts. A generated retrieval layer that wires up only a vector store is correct in a demo and degraded invisibly on the exact-match queries real users type."
      - id: "C-049"
        name: "BM25"
        priority: "P0"
        kind: "implementation"
        first_week: "W05"
        home_file: "tracks/ai-application-engineering.md"
        surface: "SKA-S0's lexical arm, built with `bm25s`."
        mastery_check_ref: "D-w05-1"
        why_it_matters: "The baseline everything else is measured against — cheap, deterministic, and the thing whose failures (synonymy, vocabulary mismatch) motivate the rest of the track. Knowing WHY BM25 exists is what makes you keep it after adding vectors rather than deleting it as legacy."
      - id: "C-050"
        name: "vector retrieval"
        priority: "P0"
        kind: "implementation"
        first_week: "W05"
        home_file: "tracks/ai-application-engineering.md"
        surface: "pgvector 0.8.6 — extension, table and HNSW index, added to the Postgres instance already running since W02 for the task state machine."
        mastery_check_ref: "D-w05-1"
        why_it_matters: "The operational property that matters is how filtering interacts with ANN traversal, not how HNSW is implemented. pgvector 0.8.0's iterative index scans exist precisely to fix the post-filter 'returned fewer than k rows' problem — which is C-052's correctness bug appearing at the index layer."
      - id: "C-051"
        name: "hybrid retrieval"
        priority: "P0"
        kind: "durable"
        first_week: "W05"
        home_file: "tracks/ai-application-engineering.md"
        surface: "Reciprocal Rank Fusion, hand-implemented in roughly twenty lines, k fixed at 60 and NOT hand-tuned in W05."
        mastery_check_ref: "D-w05-1"
        why_it_matters: "Generated hybrid search often adds BM25 and cosine scores directly, or normalises them independently — unsound, because the scales and distributions are incomparable, and it produces plausible-looking results silently dominated by whichever signal has the wider numeric range that day. RRF sidesteps this by using rank position only, which is why it is the default in Elasticsearch, Azure AI Search and OpenSearch. A generated implementation still needs checking for off-by-one rank indexing and for a k hard-coded independent of corpus size."
      - id: "C-052"
        name: "metadata filtering"
        priority: "P0"
        kind: "durable"
        first_week: "W05"
        home_file: "tracks/ai-application-engineering.md"
        surface: "The permission pre-filter in SKA-S0 and the leak-proof test that constructs a query whose raw top-k contains more of tenant B's documents than tenant A's."
        mastery_check_ref: "D-w05-2"
        why_it_matters: "THE CORRECTNESS AND SECURITY CRUX OF THE SECURE KNOWLEDGE AGENT, and the load-bearing concept for Track B's rehomed multi-tenancy content. Post-filtering runs ANN search first and then discards unauthorized hits from that k, so an authorized-but-lower-ranked chunk is pushed out entirely and the user gets fewer than k results, or zero, from a set that in fact contains a good match. An agent asked to 'add access control' generates exactly `results = vector_search(query, k=10); [r for r in results if user_can_see(r)]` — it compiles, it passes a happy-path test, and it is broken precisely when it matters. Worse, result COUNT, LATENCY and partial scores leak the EXISTENCE of documents the user cannot see. This fuses a correctness bug with a disclosure vulnerability, and a test that only checks 'no unauthorized content was returned' does not catch it."
      - id: "C-053"
        name: "chunking"
        priority: "P1"
        kind: "implementation"
        first_week: "W06"
        home_file: "tracks/ai-application-engineering.md"
        surface: "A three-configuration sweep — fixed 200-token, fixed 500-token, recursive-with-overlap — re-run against the frozen W05 label set with everything else held constant."
        mastery_check_ref: "D-w06-1"
        why_it_matters: "Chunk boundaries bound what can EVER be retrieved: a boundary separating a claim from its qualifier is unrecoverable downstream regardless of embedding or reranker quality. Fixed and recursive chunking are cheap deterministic defaults; semantic chunking adds ingest cost and is a second-pass optimisation."
      - id: "C-054"
        name: "reranking"
        priority: "P1"
        kind: "implementation"
        first_week: "W06"
        home_file: "tracks/ai-application-engineering.md"
        surface: "A local CPU cross-encoder reranking hybrid's top-20, with per-query wall-clock latency logged. Primary: BAAI/bge-reranker-v2-m3 (Apache-2.0). For the exercise: cross-encoder/ms-marco-MiniLM-L6-v2 (22.7M params, CPU-viable)."
        mastery_check_ref: "D-w06-1"
        why_it_matters: "A cross-encoder jointly encodes query and document in one pass rather than independently, modelling their interaction directly — too slow to run over a full corpus, so it only ever reranks a retriever's top-N. The examinable consequence: reranking can reorder an already-correct top-5 but can NEVER pull in a relevant document from outside the retriever's candidate set. Reranking does not require paying; permissively licensed CPU-runnable cross-encoders of real quality exist, and paying buys marginal quality and zero-ops hosting, not a capability gap."
        license_warning: "jina-reranker-v2-base-multilingual weights are CC-BY-NC-4.0 — NON-COMMERCIAL. It must not be recommended in a repository the user may make public or use for client work. This is a hard exclusion, not a preference."
      - id: "C-055"
        name: "query rewriting"
        priority: "P1"
        kind: "implementation"
        first_week: "W06"
        home_file: "tracks/ai-application-engineering.md"
        surface: "Folded into W06's SKA-S1 build at zero incremental hour cost, alongside reranking."
        mastery_check_ref: "D-w06-1"
        why_it_matters: "The examinable boundary is where query rewriting fixes a failure that reranking structurally cannot: reranking reorders what was retrieved, rewriting changes what is retrievable."
      - id: "C-056"
        name: "context construction"
        priority: "P0"
        kind: "durable"
        first_week: "W06"
        home_file: "tracks/ai-application-engineering.md"
        surface: "The assembly of ranked chunks into the SKA prompt — ordering, citation markers, truncation under a token budget — and the diagnosis-step context in S3."
        mastery_check_ref: "D-w11-3"
        why_it_matters: "How ranked chunks are assembled determines whether claims can be attributed back to sources at all. Attribution is not a presentation concern; it is the precondition for the free-tier hallucination check in W10 and for any security claim about what the model was told."
      - id: "C-057"
        name: "structured outputs"
        priority: "P0"
        kind: "implementation"
        first_week: "W03"
        home_file: "tracks/ai-application-engineering.md"
        surface: "BOA-S0's Pydantic extraction schema with retry-on-validation-failure; the SKA's answer-plus-cited-chunk-ids contract in W11."
        mastery_check_ref: "D-w11-3"
        why_it_matters: "Forcing the answer through a schema turns 'cited answer' into a VALIDATED, RETRYABLE CONTRACT rather than a prompting hope. It is also a security control and not only a parsing convenience: a schema that has no field for an instruction cannot carry one."
      - id: "C-058"
        name: "tools"
        priority: "P0"
        kind: "implementation"
        first_week: "W01"
        home_file: "tracks/ai-application-engineering.md"
        surface: "Shared with C-003. The SKA's retrieval tool and the BOA's CRM lookup are the Track C instances."
        mastery_check_ref: "D-w04-2"
        why_it_matters: "See C-003. In an application context the additional lesson is that a tool's schema is the only contract the model has: an under-specified argument is a silent behaviour change."
      - id: "C-059"
        name: "agents"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        home_file: "tracks/ai-application-engineering.md"
        surface: "The BOA's classification and proposed-action steps; the SKA's answering step."
        mastery_check_ref: "D-w01-4"
        why_it_matters: "See C-005. In an application, the classification question is asked per STEP, not per system: a task→coding-agent→tests→review→PR pipeline is mostly a workflow with an agent embedded at the write-code and review steps."
      - id: "C-060"
        name: "memory"
        priority: "P0"
        kind: "durable"
        first_week: "M05"
        home_file: "tracks/ai-application-engineering.md"
        surface: "BOA-S2 at month 05 — durable per-account agent memory: accumulated facts about a contact or account that LATER, SEPARATE decisions read as trusted."
        mastery_check_ref: "D-m05-1"
        why_it_matters: "Agent memory is not conversation history, not task state and not a RAG corpus, and the distinctions are load-bearing (R5, quoting OWASP verbatim). Conversation history is the ephemeral transcript of the current session. Task/workflow state is machine bookkeeping about where a pipeline currently is — deterministic process state, not a belief the agent holds. A RAG corpus is written by a separate ingestion process. AGENT MEMORY is persistent, cross-session state THE AGENT ITSELF WRITES and later treats as trusted fact it reasons from. That defining property is exactly what makes it poisonable, and it is why the program had no memory surface until BOA-S2 existed to give it one."
      - id: "C-061"
        name: "state"
        priority: "P0"
        kind: "durable"
        first_week: "W02"
        home_file: "tracks/ai-application-engineering.md"
        surface: "Shared with C-028. The Track C instance is the BOA's per-message pipeline state."
        mastery_check_ref: "D-w02-1"
        why_it_matters: "MCP's 2026-07-28 spec removes PROTOCOL-level session state — the initialize handshake and Mcp-Session-Id are retired — while explicitly still allowing application-level state via opaque handles passed as arguments (R2). The general pattern is worth internalising beyond MCP: push statefulness out of the transport layer and into explicit, inspectable application data. Generated code that assumes a long-lived stateful connection will not survive horizontal scaling."
      - id: "C-062"
        name: "evaluations"
        priority: "P0"
        kind: "durable"
        first_week: "W06"
        home_file: "tracks/ai-application-engineering.md"
        surface: "The frozen 15–20 pair labelled retrieval set (W06) and the 20-task agent suite (W10)."
        mastery_check_ref: "D-w06-1"
        why_it_matters: "THE SINGLE HIGHEST-LEVERAGE CONCEPT IN THE TRACK for a level-1 baseline, because it converts retrieval from vibes into an engineering discipline with a number attached. Build the labelled set BEFORE touching chunk size, reranker choice or fusion weights, and treat every change as a diffable experiment against that frozen set. Without it, 'improving' retrieval is unfalsifiable: a change has no way to prove it helped, and generated code silently regresses recall while looking fine on the one demo query used to sanity-check it."
      - id: "C-063"
        name: "trace evaluation"
        priority: "P0"
        kind: "durable"
        first_week: "W10"
        home_file: "tracks/ai-application-engineering.md"
        surface: "W10's trace-eval pass over the S5 spans, scoring whole traces rather than final strings."
        mastery_check_ref: "D-w10-2"
        why_it_matters: "An agent test is a whole multi-span trace — plan, tool calls, retries, answer — and evaluating only the final string discards where the generated orchestration went wrong. Two runs can produce the same answer with wildly different cost, latency and retry behaviour, and only one of them is a system you would ship."
      - id: "C-064"
        name: "hallucination analysis"
        priority: "P1"
        kind: "implementation"
        first_week: "W10"
        home_file: "tracks/ai-application-engineering.md"
        surface: "The free tier, always on: lexical citation-presence checking (pure code, ~EUR 0) plus a local NLI entailment score run offline on CPU. An LLM judge is reserved for cases where the two disagree."
        mastery_check_ref: "D-w10-2"
        why_it_matters: "R4 ranks five methods by cost and the cheapest two are genuinely free. Citation-presence checking catches the common failure — citing something that was never retrieved — at zero marginal cost and with no model call. Self-consistency sampling is the priciest method here because it costs k FULL GENERATION calls, not k judge calls; knowing that ordering is what keeps a budget-constrained program from reaching for the expensive method first."
      - id: "C-065"
        name: "observability"
        priority: "P0"
        kind: "durable"
        first_week: "W09"
        home_file: "tracks/ai-application-engineering.md"
        surface: "Shared with C-045. The Track C instance is the SKA's cost and latency measurement, mandated by BR-064."
        mastery_check_ref: "D-w09-1"
        why_it_matters: "See C-045."
      - id: "C-066"
        name: "latency"
        priority: "P1"
        kind: "implementation"
        first_week: "W09"
        home_file: "tracks/ai-application-engineering.md"
        surface: "p50/p95 rerank latency per query in W06; latency budgets per pipeline stage in S5."
        mastery_check_ref: "D-w09-1"
        why_it_matters: "Latency in an agent system is not one number but a distribution across a nondeterministic path, and it is contaminated by quota stalls that are a property of your billing plan rather than of your code. `quota_stall_seconds` exists so the two can be separated; without that separation, average task duration is uninterpretable."
      - id: "C-067"
        name: "cost optimization"
        priority: "P0"
        kind: "durable"
        first_week: "W09"
        home_file: "tracks/ai-application-engineering.md"
        surface: "S5's per-run cost accounting with the composite `cost/task` metric; `cost_budget.eval_set_size_formula` driven by quota rather than by euros."
        mastery_check_ref: "D-w09-1"
        why_it_matters: "The instructive inversion of this program: judge inference is nearly free (an 80-item pass costs under EUR 0.60) while QUOTA is the binding constraint, because agent re-execution consumes a resource that money cannot immediately buy back. A cost model denominated in the resource that is not scarce measures nothing."
      - id: "C-068"
        name: "model routing"
        priority: "P1"
        kind: "implementation"
        first_week: "M04"
        home_file: "tracks/ai-application-engineering.md"
        surface: "Month 04 — routing policy alongside the cross-harness adapter comparison."
        mastery_check_ref: "D-m04-1"
        why_it_matters: "See C-011. The application-level addition is that routing decisions must be recorded per run, or a later comparison silently compares two different systems."
      - id: "C-069"
        name: "fallbacks"
        priority: "P1"
        kind: "implementation"
        first_week: "M04"
        home_file: "tracks/ai-application-engineering.md"
        surface: "Month 04 — the metered-API code path kept live behind the same harness-adapter interface, so a quota-exhaustion event degrades to billed tokens rather than blocking the pipeline."
        mastery_check_ref: "D-m04-1"
        why_it_matters: "A fallback that has never executed is a hypothesis. Keeping the metered path behind the same interface means the fallback is exercised by construction whenever quota runs out, rather than discovered to be broken at the moment it is needed."
    retrieval_stack_decisions:
      lexical: "bm25s — up to ~500x faster than rank_bm25 via eager sparse-matrix scoring at index time; pure NumPy/SciPy. Correct default over rank_bm25 for anything beyond a toy demo."
      embeddings_primary: "Qwen3-Embedding-0.6B — Apache-2.0, 0.6B params, ~1.5GB on disk, MTEB-multilingual mean 64.33. Best quality-per-resource pick at EUR 0."
      embeddings_alternates: ["nomic-embed-text (~0.3GB via Ollama, easiest single-command start, lower MTEB)", "BAAI/bge-m3 (multilingual, dense+sparse+multi-vector from one model, Apache-2.0)", "gte-multilingual-base (305M params, Apache-2.0)"]
      reranker_primary: "BAAI/bge-reranker-v2-m3 — cross-encoder, ~0.6B params, Apache-2.0, use_fp16=True for speed."
      reranker_for_exercise: "cross-encoder/ms-marco-MiniLM-L6-v2 — 22.7M params, sub-second CPU latency at a top-20 to top-50 rerank window, no GPU needed."
      reranker_excluded: "jina-reranker-v2-base-multilingual — CC-BY-NC-4.0, non-commercial. EXCLUDED from all recommendations because the repository is public-capable and may be used for client work."
      store: "pgvector 0.8.6 (2026-07-29). Chosen because Postgres is ALREADY RUNNING from W02 as the task state store, queue, lock, outbox and dedup table — so the SKA adds an extension, a table and an index rather than a new operational component."
      store_alternates_concept_only: "Qdrant — read its filterable-HNSW article once as the clearest published account of pre-filtering done correctly at the ANN layer; the concept transfers even though the exercise is built on pgvector. Elasticsearch/OpenSearch — know where they fit (lexical search as the primary product). Do NOT operate a second or third vector store."
      embedding_policy: "local, EUR 0"

  D:
    id: "D"
    name: "Track D — AI Security"
    home_file: "tracks/ai-security.md"
    hours: 22.5
    share_of_180: "12.5%"
    entry_competency: "Security / threat modelling: Awareness (user-supplied, level 1). No structured attack thinking, trust-boundary analysis or least-privilege design as deliberate practice. Weeks 11–12 and the months 04–06 arc START FROM CONCEPTS, not from 'attack your own system on day one'. 22.5h across 17 topics from a level-1 baseline is compressed; months 04–06 deliberately carry the depth."
    identifier_policy:
      agentic_top_10: "PERMITTED. ASI01–ASI10 were verified verbatim against OWASP's OWN PDF (genai.owasp.org/download/52117, linked from the OWASP landing page dated 2025-12-09). Cite the PDF, never a vendor summary."
      llm_top_10: "FORBIDDEN TO NUMBER. Canon and all prose MUST use OWASP LLM category NAMES without any LLM0x identifier. A newer 'OWASP GenAI LLM Top 10 2026' appears to have been published 2026-08-04 and reportedly renumbers Excessive Agency; it was NOT independently refetched from its primary PDF, so no numbering is verified. The Agentic Top 10 PDF's own internal cross-references to the 2025 numbering may themselves already be stale. Use 'Prompt Injection', 'Excessive Agency' etc. as bare names. This rule is checked at G2."
      effectiveness_percentages: "FORBIDDEN. Canon contains and prose must contain NO percentage figure for prompt-injection defense effectiveness. R5 found no independently verified primary benchmark meeting the sourcing bar and deliberately stated none. Track D's attack suite measures ATTACK SUCCESS RATE AGAINST THE USER'S OWN SYSTEM, which is the brief's requirement anyway, rather than citing industry numbers that do not exist at a citable standard."
    asi_categories:
      - {id: "ASI01", name: "Agent Goal Hijack"}
      - {id: "ASI02", name: "Tool Misuse and Exploitation"}
      - {id: "ASI03", name: "Identity and Privilege Abuse"}
      - {id: "ASI04", name: "Agentic Supply Chain Vulnerabilities"}
      - {id: "ASI05", name: "Unexpected Code Execution (RCE)"}
      - {id: "ASI06", name: "Memory & Context Poisoning"}
      - {id: "ASI07", name: "Insecure Inter-Agent Communication"}
      - {id: "ASI08", name: "Cascading Failures"}
      - {id: "ASI09", name: "Human-Agent Trust Exploitation"}
      - {id: "ASI10", name: "Rogue Agents"}
    artifacts_bought: >-
      22.5h buys: an indirect-prompt-injection attack suite of at least three distinct
      techniques run against the learner's own retrieval index, with attack success rate
      measured before and after a structural mitigation; a data-exfiltration attempt including
      at least one covert channel, reported against the lethal-trifecta legs; a confused-deputy
      demonstration in which a low-privilege step forges an instruction a high-privilege step
      executes, patched with per-action re-authorization and re-tested; per-tool least-privilege
      profiles with scoped short-lived tokens; an append-only provenance audit log; and a
      sandboxed code-execution surface. Portfolio item #5 — the AI security attack/evaluation
      report — begins in W11 and closes at month 05.
    concepts:
      - id: "C-070"
        name: "prompt injection"
        priority: "P0"
        kind: "durable"
        first_week: "W11"
        home_file: "tracks/ai-security.md"
        surface: "The W11 attack suite's direct-injection control arm."
        mastery_check_ref: "D-w11-2"
        why_it_matters: "Generated agent code treats the whole context window as one trusted blob — it does not insert a boundary between text the operator typed and text a retrieved document or tool output contained — so injected instructions in the latter execute with the same authority as the former. That absence of a boundary is the PRECONDITION for goal hijack, not a symptom of it."
      - id: "C-071"
        name: "indirect prompt injection"
        priority: "P0"
        kind: "durable"
        first_week: "W11"
        home_file: "tracks/ai-security.md"
        surface: "S7a — at least three distinct payload styles (instruction override, persona/role-play override, delimiter/format confusion) seeded into the learner's own index and measured against control."
        mastery_check_ref: "D-w11-2"
        why_it_matters: "This is the class where the attacker never touches your prompt. The examinable distinction is between a prompt-level patch (asking the model to be careful) and an ARCHITECTURAL change (treating retrieved content as untrusted by construction), and only the second eliminates the class."
      - id: "C-072"
        name: "RAG poisoning"
        priority: "P0"
        kind: "durable"
        first_week: "W06"
        home_file: "tracks/ai-security.md"
        surface: "W06 — poisoned documents seeded into the SKA index the learner built the week before."
        mastery_check_ref: "D-w06-2"
        why_it_matters: "Corpus poisoning is a DATA/SUPPLY problem at the corpus level. It overlaps memory poisoning only as one named sub-case, and it touches the agentic supply-chain category when the corpus is a third-party feed. The documents are usually written by a separate ingestion process, not self-written by the agent from unverified conversation — and that is the line that separates it from memory poisoning."
      - id: "C-073"
        name: "memory poisoning"
        priority: "P0"
        kind: "durable"
        first_week: "M05"
        home_file: "tracks/ai-security.md"
        surface: "Months 05–06 against BOA-S2's durable per-account memory. Maps to ASI06."
        mastery_check_ref: "D-m05-2"
        why_it_matters: "OWASP ASI06 ships its own worked example — Travel Booking Memory Poisoning: an attacker repeatedly reinforces a fake flight price, the assistant stores it as truth, then approves bookings at that price and bypasses payment checks. The BOA exercise is structurally the same shape and is therefore VALIDATED BY OWASP'S OWN EXAMPLE rather than contrived. The chain is: untrusted input channel → a memory-write step lacking provenance or trust tiering that treats repetition as corroboration → a durable write with no human confirmation → a LATER, UNRELATED decision reading that entry as ground truth → the decision executing because the read-time step trusts anything already stored. Two properties MUST hold or a reviewer can reasonably reclassify it as ordinary prompt injection: the false fact must persist ACROSS the triggering message and be read by a later SEPARATE decision cycle, and it must be written by the agent's own memory-write path from untrusted input."
      - id: "C-074"
        name: "malicious tool output"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "tracks/ai-security.md"
        surface: "W12's failure exercise — a tool returns attacker-shaped content and the agent's handling is measured."
        mastery_check_ref: "D-w12-2"
        why_it_matters: "Tool output is the trust boundary engineers most reliably forget, because the tool is 'ours'. It is not: a tool that reads a GitHub issue, a Sentry event body or a web page is a conduit for arbitrary attacker text arriving with the authority of an internal component."
      - id: "C-075"
        name: "data exfiltration"
        priority: "P0"
        kind: "durable"
        first_week: "W11"
        home_file: "tracks/ai-security.md"
        surface: "The W11 exfiltration attempt: at least one covert channel (data encoded in a helpful-looking URL parameter) in addition to a direct ask."
        mastery_check_ref: "D-w11-2"
        why_it_matters: "The LETHAL TRIFECTA (Simon Willison, 2025-06-16 — an independent framing, not an OWASP identifier): access to private data, plus exposure to untrusted content, plus the ability to communicate externally, equals exfiltration risk regardless of prompt care. A business-automation agent is a near-textbook trifecta system: CRM data is private, inbound email is untrusted, outbound email and CRM writes are external channels. Generated code rarely BREAKS the triangle; it adds instructions asking the model to be careful. The structural fix — strip external-send capability from any turn that touched untrusted input in that cycle — is a leg removal, and the examinable question is whether your fix removed a leg or merely filtered."
      - id: "C-076"
        name: "insecure tool permissions"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        home_file: "tracks/ai-security.md"
        surface: "The per-tool least-privilege profile introduced in W04's runner and hardened in S7b."
        mastery_check_ref: "D-w12-1"
        why_it_matters: "Scaffolds default to broad tool scopes — read/write on the whole CRM — because it is easier to wire up in a demo, and that default survives into production. OWASP names this the precondition for tool misuse and privilege abuse."
      - id: "C-077"
        name: "confused deputy problems"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "tracks/ai-security.md"
        surface: "W12 — a low-privilege classifier step forges a high-impact instruction that the high-privilege CRM-write step executes without re-checking the original human request; patched with per-action re-authorization and re-tested."
        mastery_check_ref: "D-w12-2"
        why_it_matters: "A program with more privilege than its caller is tricked into misusing that privilege on the caller's behalf (Norm Hardy, 1988). OWASP ASI03 names it explicitly and cites the classic MIT reading, so the concept has a load-bearing primary citation rather than being asserted. Multi-agent scaffolds an LLM writes commonly have a low-privilege step forward instructions to a high-privilege step 'because it's internal' — this exact shape. The examinable question is: where ELSE in your build does one component implicitly trust another's output?"
      - id: "C-078"
        name: "excessive agency"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "tracks/ai-security.md"
        surface: "The approval gates on irreversible actions in S7b, and the audit of which platform steps genuinely need autonomy."
        mastery_check_ref: "D-w12-1"
        why_it_matters: "OWASP's own least-agency framing: avoid unnecessary autonomy, because deploying agentic behaviour where it is not needed expands the attack surface without adding value. This connects directly to C-005 — the workflow/agent classification is a SECURITY decision as much as an architectural one. NOTE: state this category by NAME ONLY. No LLM0x identifier, per identifier_policy."
      - id: "C-079"
        name: "privilege boundaries"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "tracks/ai-security.md"
        surface: "The genuine privilege differential between the BOA's classification step and its CRM-write step, which is what makes the confused-deputy exercise real rather than staged."
        mastery_check_ref: "D-w12-2"
        why_it_matters: "A privilege boundary that exists only in a diagram is not a boundary. The build-time check is whether the two steps are actually separate processes with separate credentials, or the same process with a comment."
      - id: "C-080"
        name: "least privilege"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        home_file: "tracks/ai-security.md"
        surface: "Per-tool profiles and scoped short-lived tokens in S7b; OAuth scopes and token lifetime for the BOA's CRM access."
        mastery_check_ref: "D-w12-1"
        why_it_matters: "The version that survives contact with an agent is per-TOOL and per-ACTION, not per-service: an agent with one broad token has the union of every permission any of its steps ever needed, forever."
      - id: "C-081"
        name: "sandboxing"
        priority: "P1"
        kind: "implementation"
        first_week: "W12"
        home_file: "tracks/ai-security.md"
        surface: "Docker with a restricted filesystem and no network for the agent's code-execution surface in S7b; upgraded in depth only at months 04–06 if the arc reaches running agent-generated code."
        mastery_check_ref: "D-w12-1"
        why_it_matters: "One paragraph and one diagram suffice at a level-1 baseline, and the whole lesson is that A CONTAINER IS NOT A HARD SECURITY BOUNDARY against a malicious workload — it is namespace and cgroup isolation over a shared kernel. gVisor intercepts syscalls in a user-space kernel and blocks many kernel-exploit escapes at an I/O cost. Firecracker and Kata microVMs give hardware-enforced isolation with a dedicated kernel per workload. Deep protocol-level study of any of them is explicitly low ROI here; recognising which tier you are actually running is not."
      - id: "C-082"
        name: "approval gates"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        home_file: "tracks/ai-security.md"
        surface: "Shared with C-015. The Track D instance is the placement audit: which state changes are irreversible or high-impact enough to require one."
        mastery_check_ref: "D-w04-1"
        why_it_matters: "See C-015. The security-side addition: the gate must display the literal proposed tool call and its evidence, because an injected instruction can produce a truthful-looking SUMMARY while the underlying call differs."
      - id: "C-083"
        name: "secrets"
        priority: "P1"
        kind: "implementation"
        first_week: "M04"
        home_file: "tracks/ai-security.md"
        surface: "Month 04 — secrets handling alongside SKA tenant isolation; scoped short-lived tokens rather than long-lived keys."
        mastery_check_ref: "D-m04-4"
        why_it_matters: "In an agent system a secret is not only leakable through logs and repositories but through the MODEL: any credential in context is a candidate for exfiltration through the output channel. Short lifetime is therefore a stronger control than careful redaction."
      - id: "C-084"
        name: "audit logs"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "tracks/ai-security.md"
        surface: "The append-only audit log in S7b, carrying PROVENANCE on every tool call and every memory write; introduced earlier as BOA-S1's draft-only audit trail in W04."
        mastery_check_ref: "D-w12-1"
        why_it_matters: "Provenance is a durable record of where a piece of data or memory came from AND AT WHAT TRUST LEVEL, attached AT WRITE TIME. Without a provenance tag a generated memory-write function looks identical whether a fact came from a verified CRM sync or an anonymous email, so no read-time policy — 'do not act on unverified facts for financial actions' — can be expressed later. The audit log is not a compliance artifact here; it is the data structure that makes the mitigation expressible."
      - id: "C-085"
        name: "tenant isolation"
        priority: "P0"
        kind: "durable"
        first_week: "W05"
        home_file: "tracks/ai-security.md"
        surface: "Shared with C-044 and C-052. Deepened at month 04 (SKA tenant isolation) and month 06 (RBAC then ABAC on the SKA authorization surface)."
        mastery_check_ref: "D-w05-2"
        why_it_matters: "See C-052. RBAC first, because it matches the per-tool least-privilege profile shape; ABAC only if an exercise genuinely needs context-dependent rules such as a dollar-amount threshold. A real policy engine is SKIP FOR NOW at this level: teach the policy-enforcement/policy-decision pattern conceptually and implement a hand-written pre-execution check function, which teaches the same lesson at a fraction of the operational cost."
      - id: "C-086"
        name: "output validation"
        priority: "P0"
        kind: "durable"
        first_week: "W11"
        home_file: "tracks/ai-security.md"
        surface: "S7a's output validation plus the structural trifecta break; the SKA's citation-presence rejection in W11."
        mastery_check_ref: "D-w11-3"
        why_it_matters: "Validating the output is the last place a hijacked turn can be stopped, and the only place where the control is deterministic code rather than a model's cooperation. A schema with no field for an instruction, plus a citation check that rejects an unsupported claim, are both structural — they hold whether or not the model was fooled."

  E:
    id: "E"
    name: "Track E — Consulting & Customer Discovery"
    home_file: "tracks/consulting.md"
    hours: 34.0
    share_of_180: "18.9%"
    entry_competency: "ZERO PIPELINE. User's own words: 'nothing, i gonna build it.' No warm network, no case study, no referral path. This is not an assumption; it is a user-supplied fact (user_supplied_inputs USI-03)."
    # ---- BR-046 RESOLUTION: pipeline-construction-from-zero as a CHECKABLE property ----
    zero_pipeline_assertion:
      requirement_ref: "BR-046"
      statement: >-
        Track E teaches CLIENT ACQUISITION FROM A COLD START. It does not teach client delivery
        assuming clients exist. A plan can satisfy all fifteen Track E topic bullets while still
        assuming a pipeline exists; R8 identified that as the single highest-risk prose
        requirement in the brief. This block makes the obligation an explicit, checkable
        property rather than an inference.
      checkable_conditions:
        - id: "ZP-1"
          condition: "AT LEAST FOUR Track E concepts satisfy BOTH clauses simultaneously: `acquisition_from_zero: true` AND `first_week` in {W01, W02, W03, W04}. Acquisition work therefore starts before any delivery work."
          satisfied_by: ["C-087", "C-088", "C-089", "C-093", "C-095"]
          count_satisfying: 5
          single_reading_note: >-
            RESTATED. The first draft listed C-090 (identifying high-value automation,
            first_week W06) among the satisfiers, which meant a checker implementing the
            condition literally returned FAIL while the surrounding gloss supported a looser
            reading that passed. A condition advertised as mechanically checkable that has two
            readings with opposite verdicts is WORSE THAN ONE THAT PLAINLY FAILS. The fix does
            not move C-090 — its first application genuinely is W06 and backdating it would be
            a fiction — and does not weaken the threshold. Instead it recognises two concepts
            that always belonged: conducting a discovery interview (C-088) and running a
            discovery call (C-095) from a standing start, both first_week W04, are ACQUISITION
            work, not delivery work. A first-timer with no pipeline running their first call is
            acquiring a client, not serving one. Five concepts now satisfy both clauses, and the
            satisfied_by list contains only in-window concepts, so the literal and the intended
            readings return the same verdict.
          checker_note: "A checker must AND the two clauses. It must not accept a flagged-but-late concept."
        - id: "ZP-2"
          condition: "At least one exercise requires constructing a prospect list from PUBLIC SOURCES ONLY, with no warm introduction, no referral and no existing contact permitted."
          satisfied_by: ["D-w01-3", "D-w02-3"]
        - id: "ZP-3"
          condition: "At least one exercise requires sending cold messages to strangers and recording the outcome per touch, with a stated expectation that most produce nothing."
          satisfied_by: ["D-w02-3", "D-w05-3"]
        - id: "ZP-4"
          condition: "The no-case-study condition is addressed EXPLICITLY as an objection to be answered, not silently assumed away. A named artifact must exist whose purpose is to substitute for the case study the learner does not yet have."
          satisfied_by: ["D-w03-3", "PF-07"]
          note: "W03's Stage-1 workflow rehearsal against a PUBLIC company is that artifact. It is also the fallback_deliverable path for W07/W08/W09, which the corrected funnel makes the EXPECTED path — so it is load-bearing twice over and must not be cut."
        - id: "ZP-5"
          condition: "The funnel's conversion assumptions carry an explicit no-case-study penalty rather than using the vendor-average band unadjusted."
          satisfied_by: ["funnel.reply_rate_band"]
        - id: "ZP-6"
          condition: "Agency subcontracting is positioned as a POST-CASE-STUDY channel, not as a zero-to-one shortcut, because entry to it runs through warm intros or visible proof of work — which is the same bottleneck, not a bypass of it."
          satisfied_by: ["C-101"]
      failure_mode_this_prevents: "A Track E that reads as 'here is how to scope, price and deliver an engagement' and never answers 'how does a stranger with no portfolio get a first conversation'. That output would satisfy every bullet and fail the brief."
    artifacts_bought: >-
      34.0h buys: a positioning and niche statement; 56 hand-selected prospects (24 researched
      manually before the extraction agent exists, 32 assisted afterwards); 52 personalised
      cold sends (15 hand-written, 37 assisted) with 104 follow-ups; a Stage-1 workflow
      rehearsal against a public company that doubles as the fallback evidence path; two
      workflow documentation artifacts; one ROI calculation from a MEASURED baseline; two
      scored automation opportunities; a qualification checklist and an offer sketch. Every
      business artifact carries `evidence_source: real | simulated` so a substitution is
      visible and can never inflate the funnel.
    exercise_shape_rule_ref: "See top-level exercise_shape_rule, which was HOISTED out of this track because its old wording scoped it to business/*.md and therefore excluded tracks/micro-saas.md — the file carrying the most playbook-prone content in the repository."
    concepts:
      - id: "C-087"
        name: "choosing a niche"
        priority: "P0"
        kind: "durable"
        first_week: "W01"
        acquisition_from_zero: true
        home_file: "tracks/consulting.md"
        surface: "The W01 positioning and niche note, which determines every prospect selected for the next eleven weeks."
        mastery_check_ref: "D-w01-3"
        why_it_matters: "Niche selection IS market selection, which is why W01 counts as a Track F reinforcement week. Small, tightly-targeted lists are reported at roughly 5.8% reply rate against roughly 2.1% for large-list blasts (R6) — a self-selected comparison inside one vendor's customer base, so directional rather than predictive, but it is the only lever a zero-network sender actually controls."
      - id: "C-088"
        name: "interviewing businesses"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        acquisition_from_zero: true
        acquisition_note: "A discovery interview run by someone with no pipeline is ACQUISITION, not delivery. The script exists before the first call precisely because a first-timer improvising will pitch, and a pitch converts a prospect into a decline."
        home_file: "tracks/consulting.md"
        surface: "The discovery script in templates/discovery-interview.md, first written during W03's Stage-1 rehearsal and first used in W04's call slot."
        mastery_check_ref: "D-w04-4"
        why_it_matters: "A discovery call that pitches produces a polite decline; one that asks a diagnostic question produces a workflow description you can cost. The script exists before the first call precisely because a first-timer improvising will pitch."
      - id: "C-089"
        name: "discovering repetitive workflows"
        priority: "P0"
        kind: "durable"
        first_week: "W03"
        acquisition_from_zero: true
        home_file: "tracks/consulting.md"
        surface: "W03's Stage-1 rehearsal documents a workflow at a PUBLIC company from public information, proving the documentation skill without needing a client."
        mastery_check_ref: "D-w03-3"
        why_it_matters: "The skill is separable from the relationship, and separating them is what makes progress possible from zero. You can learn to document a workflow before anyone lets you near theirs — and the rehearsal artifact is what you show instead of the case study you do not have."
      - id: "C-090"
        name: "identifying high-value automation"
        priority: "P0"
        kind: "durable"
        first_week: "W06"
        acquisition_from_zero: true
        home_file: "business/opportunity-scorecard.md"
        surface: "The nine-dimension opportunity scorecard, applied to one opportunity in W06 and one in W10."
        mastery_check_ref: "D-w06-4"
        why_it_matters: "Industry RPA practice converges on two axes — business value and feasibility — distilled from many sub-criteria. The brief's nine map cleanly onto that, and buyer access plus willingness to pay is a genuine ADAPTATION rather than a gap: generic RPA literature is written for internal teams with a captive buyer, and an external consultant has no such thing."
      - id: "C-091"
        name: "qualification"
        priority: "P0"
        kind: "durable"
        first_week: "W11"
        home_file: "tracks/consulting.md"
        surface: "The qualification checklist applied before the W11 offer sketch."
        mastery_check_ref: "D-w11-4"
        why_it_matters: "A reply is not progress. 'Reply' as a category includes polite declines, unsubscribes, gatekeeper messages and 'not now, follow up in Q3' — none of which should count toward a booked call. Qualification code that gates on reply SENTIMENT rather than on buyer-confirmed pain plus a budget signal will overweight politeness as progress."
      - id: "C-092"
        name: "ROI estimation"
        priority: "P0"
        kind: "durable"
        first_week: "W08"
        home_file: "tracks/consulting.md"
        surface: "W08's ROI calculation from a MEASURED before/after baseline, not an estimate."
        mastery_check_ref: "D-w08-4"
        why_it_matters: "The pattern buyers accept: time saved in hours per week, multiplied by FULLY LOADED hourly cost (salary times roughly 1.3–1.5 for benefits and overhead), times 52 weeks, minus platform and maintenance cost, expressed as a PAYBACK PERIOD IN MONTHS rather than a headline ROI percentage. Buyers discount unloaded-cost estimates as naive, and they discount industry-average ROI percentages as generic vendor copy because those are consulting-industry means that no specific small business recognises as applying to them. The credibility lives in the measured baseline and the shown method."
      - id: "C-093"
        name: "outreach"
        priority: "P0"
        kind: "durable"
        first_week: "W02"
        acquisition_from_zero: true
        home_file: "business/outreach.md"
        surface: "52 sends and 104 follow-ups across W02–W11, with per-touch reply attribution."
        mastery_check_ref: "D-w02-3"
        why_it_matters: "The best-supported number in the whole market brief: 58% of replies come from the first touch and the remaining 42% from follow-ups, with independent sources giving a 42–65% range (R6). That makes two follow-ups per prospect close to NECESSARY rather than optional, and it sits inside the reported 2–3 follow-up sweet spot. Follow-ups must add new information; 'just checking in' is a touch that costs goodwill and buys nothing."
      - id: "C-094"
        name: "writing offers"
        priority: "P1"
        kind: "durable"
        first_week: "W11"
        home_file: "business/consulting-offer.md"
        surface: "The W11 offer sketch, which becomes portfolio item #8, the consulting offer page."
        mastery_check_ref: "D-w11-4"
        why_it_matters: "An offer is a scope decision made in advance so it is not made under pressure in a call. Writing it before you need it is what stops the first real conversation from producing an unbounded engagement."
      - id: "C-095"
        name: "discovery calls"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        acquisition_from_zero: true
        acquisition_note: "The call slot is RESERVED IN ADVANCE in W04 and W05 rather than scheduled on demand, because a reply that waits three days for a free evening has already lost most of its value. Reserving capacity for a conversation you have not yet earned is itself an acquisition discipline."
        home_file: "tracks/consulting.md"
        surface: "Call slots budgeted in W04 (1.50h, deliberately prep-light) and W05 (1.75h full all-in), with a 0.25h no-show/reschedule reserve in W08."
        mastery_check_ref: "D-w04-4"
        why_it_matters: "Speed of handling matters enormously — replies handled within four hours are reported to convert roughly twice as well as delayed handling (R6, low confidence). The operational consequence is that the call slot must be RESERVED in advance, because a reply that waits three days for a free evening has already lost most of its value."
      - id: "C-096"
        name: "scoping"
        priority: "P1"
        kind: "durable"
        first_week: "M04"
        home_file: "tracks/consulting.md"
        surface: "Months 04–07, alongside the first Stage-2 pilot. Homed here because Track F and Track E both thin in phase 1 by decision, and scoping has no surface until an engagement exists."
        mastery_check_ref: "D-m06-3"
        why_it_matters: "Scope is the only variable a fixed-price engagement has, so scoping IS pricing. Strict scope is what makes a free or cheap pilot survivable rather than an unbounded gift."
      - id: "C-097"
        name: "proposals"
        priority: "P1"
        kind: "durable"
        first_week: "M04"
        home_file: "tracks/consulting.md"
        surface: "Months 04–07."
        mastery_check_ref: "D-m06-3"
        why_it_matters: "A proposal that leads with features loses to one that leads with a measured payback period. See C-092."
      - id: "C-098"
        name: "pricing"
        priority: "P1"
        kind: "durable"
        first_week: "M04"
        home_file: "tracks/consulting.md"
        surface: "Months 04–07."
        mastery_check_ref: "D-m06-3"
        why_it_matters: "Small-business buyers prefer fixed or productized pricing for defined outcomes; hourly billing is defensible only for genuinely undefined discovery work and should be capped at 10–20 hours (R6, moderate confidence). Reference bands, all from vendor-marketing sources and therefore likely to reflect ASKING rates rather than realised ones: fixed projects cluster at EUR/USD 5,000–25,000 with 10,000–15,000 typical for a four-to-six week build."
      - id: "C-099"
        name: "delivering a small project"
        priority: "P1"
        kind: "durable"
        first_week: "M05"
        home_file: "tracks/consulting.md"
        surface: "Consulting Stage 2 — the first free or cheap pilot, months 05–07."
        mastery_check_ref: "D-m07-1"
        why_it_matters: "Stage 2 exists to manufacture the artifact that Stage 1 cannot: a real before/after number from someone else's business. Everything downstream — the case study, the agency channel, the pricing confidence — is gated on it."
      - id: "C-100"
        name: "producing a case study"
        priority: "P0"
        kind: "durable"
        first_week: "M05"
        home_file: "templates/case-study.md"
        surface: "templates/case-study.md, written with placeholder identities so the repository stays public-capable; the real instance lives in a gitignored *.local.md file."
        mastery_check_ref: "D-m07-1"
        why_it_matters: "Case studies materially reduce buyer risk-perception, which is why their absence carries a reply-rate penalty. The credibility failure mode is an unverified time-savings claim: pilot-tracking work must refuse to produce a case-study artifact until a MEASURED before/after number exists, or the artifact is worse than nothing."
      - id: "C-101"
        name: "finding subcontracting opportunities through automation/AI agencies"
        priority: "P2"
        kind: "durable"
        first_week: "M05"
        home_file: "tracks/consulting.md"
        surface: "Months 05–07, as a Stage 2/3 SIDE-QUEST after a pilot case study exists: reach out to 3–5 niche automation agencies and record what they ask for."
        why_it_matters: "The durable lesson is that a channel requiring PROOF OF WORK to enter is not an alternative to building proof of work — it is a consumer of it. Recognising that shape saves you from every future shortcut whose entry condition is the thing you were trying to shortcut."
        p2_reason: >-
          DEMOTED from a parallel channel, per R6. White-label and overflow arrangements between
          automation agencies and independent developers do exist and are common, but every source
          describing how you GET IN says it starts through warm channels — a conversation at a
          meetup, a referral, a DM from someone who saw your work — which is itself a
          cold-outreach-adjacent problem, not a bypass of one. The route substitutes cold outreach
          to agencies for cold outreach to end buyers, with the ADDED friction that agencies want
          proof of work before extending trust with their own client relationships. It is therefore
          not faster from a zero-network start, and it is homed after a case study exists.
          Agencies look for fast turnaround, output indistinguishable from their own team's,
          NDA discipline, and communication-stack fit; none of the sources mention certifications.
          The implicit bar is a demonstrable sample of clean documented automation work — which
          loops straight back to needing one real pilot artifact.

  F:
    id: "F"
    name: "Track F — Micro-SaaS Discovery"
    home_file: "tracks/micro-saas.md"
    hours: 5.0
    share_of_180: "2.8%"
    thin_by_decision: "Track F carries 5.0h in phase 1 — W10 1.5, W11 1.5, W12 2.0 — and is thin BY DECISION, not by oversight. F consumes evidence that phase 1 is still producing: pain frequency, willingness to pay, reachability. Building the framework before the evidence exists produces a scorecard scored on assumptions, which is the exact failure the kill criteria exist to prevent. F's phase-1 job is to build the instruments; months 05–09 apply them."
    process_chain:
      requirement_ref: "BR-051"
      count: 6
      statement: "The brief teaches Track F as an ORDERED PROCESS, not a topic list. Every link was homed, but the chain itself was never enumerated as a sequence — so it is enumerated here, because THE ORDER IS THE CONTENT: each link is gated on evidence produced by the one before it, and skipping a link is exactly how a plan arrives at 'brainstorm SaaS ideas', which the brief bans."
      links:
        - {n: 1, link: "consulting / interviews", produces: "Raw exposure to how a business actually works", homed: "C-088, C-095; the W04-W09 call slots and Stage-1 rehearsals"}
        - {n: 2, link: "recurring pain", produces: "The pain register: the same shape of problem seen more than once across independent buyers", homed: "C-102, D-w10-4"}
        - {n: 3, link: "evidence", produces: "Scored opportunities with per-dimension evidence, and the seven thresholds with resolved numbers", homed: "C-103..C-106, D-w06-4, D-w10-4, D-w11-4"}
        - {n: 4, link: "prototype", produces: "A manual concierge delivery, by hand, before any automation", homed: "C-108, D-m09-1, and the CL-6 prototype-decision gate"}
        - {n: 5, link: "paid validation", produces: "Money, or a strong purchase commitment — the only evidence politeness cannot produce", homed: "C-110, D-m09-1"}
        - {n: 6, link: "productization", produces: "A verdict, or an explicit non-verdict naming the missing threshold and its date", homed: "C-112, D-w12-4, consulting_stages CS-5"}
      gating_rule: "A link may not be entered until the previous link has produced its artifact. Phase 1 reaches link 3 at best; links 4-6 live in months 05-09 and are contingent on the funnel. Saying plainly that the chain probably stalls at link 3 is more useful than a plan that assumes it does not."
    non_verdict_rule: "F's fallback output is an EXPLICIT NON-VERDICT — 'insufficient evidence, deferred to month 05' — and that is a PASSING deliverable. A kill-criteria framework that can return 'not enough evidence to decide' is stronger than one that always produces a score. See saas_validation.non_verdict_is_passing."
    artifacts_bought: >-
      5.0h buys: a pain-scoring model derived from the nine-dimension scorecard (W10); the
      seven evidence thresholds with their N placeholders resolved to concrete numbers (W11);
      and the five kill criteria plus a verdict — or an explicit, passing non-verdict — on the
      first SaaS candidate (W12). Portfolio item #10, the micro-SaaS opportunity scorecard,
      is the accumulated output.
    concepts:
      - id: "C-102"
        name: "problem discovery"
        priority: "P0"
        kind: "durable"
        first_week: "W10"
        home_file: "tracks/micro-saas.md"
        surface: "The pain register assembled from W04–W09 discovery calls and workflow documentation, real or Stage-1 simulated, each row tagged with its evidence_source."
        mastery_check_ref: "D-w10-4"
        why_it_matters: "The brief explicitly bans 'brainstorm SaaS ideas'. The whole point of the ordering — consulting first, product second — is that the product hypothesis must be a RESIDUE of observed repeated pain, not a starting position."
      - id: "C-103"
        name: "pain scoring"
        priority: "P0"
        kind: "durable"
        first_week: "W10"
        home_file: "business/opportunity-scorecard.md"
        surface: "W10's pain-scoring model, which turns the nine-dimension scorecard into a repeatable instrument rather than a one-off spreadsheet."
        mastery_check_ref: "D-w10-4"
        why_it_matters: "A scorecard that is re-derived each time it is used is not an instrument, it is an opinion with a table around it. The examinable property is reproducibility: two scorings of the same opportunity a month apart should agree, and where they do not, the disagreement should be traceable to new evidence."
      - id: "C-104"
        name: "frequency"
        priority: "P0"
        kind: "durable"
        first_week: "W10"
        home_file: "tracks/micro-saas.md"
        surface: "A scorecard dimension; recorded per discovery call from W04."
        mastery_check_ref: "D-w10-4"
        why_it_matters: "Frequency is the multiplier in every ROI calculation and the single most common place a plausible automation turns out to be worthless: a painful task done twice a year saves nothing worth paying for."
      - id: "C-105"
        name: "willingness to pay"
        priority: "P0"
        kind: "durable"
        first_week: "W10"
        home_file: "tracks/micro-saas.md"
        surface: "A scorecard dimension; the top-3 shortlist requires this to be backed by an actual conversation or an observable signal, never by assumption."
        mastery_check_ref: "D-w10-4"
        why_it_matters: "The first kill criterion is literally 'people say the problem is annoying but will not pay'. Willingness to pay is the dimension where wishful scoring is most tempting and most fatal, which is why the acceptance criterion demands evidence rather than a number."
      - id: "C-106"
        name: "reachability"
        priority: "P0"
        kind: "durable"
        first_week: "W10"
        home_file: "tracks/micro-saas.md"
        surface: "A scorecard dimension; measured directly by this program's own funnel, which IS a reachability experiment."
        mastery_check_ref: "D-w10-4"
        why_it_matters: "The program's own reply rate is a measurement of how reachable this niche is by cold email. That makes the funnel dual-purpose: it is business development AND it is the acquisition-cost input to the SaaS decision. A niche that will not answer email has an acquisition cost problem no product quality can fix."
      - id: "C-107"
        name: "competition"
        priority: "P1"
        kind: "durable"
        first_week: "M05"
        home_file: "tracks/micro-saas.md"
        surface: "Months 05–09."
        mastery_check_ref: "D-m09-1"
        why_it_matters: "Kill criterion five is 'an existing product already solves 90% of the pain cheaply'. Competition analysis is therefore a kill instrument, not a positioning exercise."
      - id: "C-108"
        name: "manual concierge MVP"
        priority: "P1"
        kind: "durable"
        first_week: "M05"
        home_file: "tracks/micro-saas.md"
        surface: "Months 05–09."
        mastery_check_ref: "D-m09-1"
        why_it_matters: "Threshold seven is 'manual workflow proven first'. The concierge MVP is how that threshold is met: if you cannot deliver the outcome by hand for one customer, automating it produces an automated way to deliver nothing."
      - id: "C-109"
        name: "landing page tests"
        priority: "P2"
        kind: "implementation"
        first_week: "M05"
        home_file: "tracks/micro-saas.md"
        surface: "Months 05–09."
        why_it_matters: "A landing-page test measures whether a stranger will surrender an email address, which is a weaker signal than this programme already collects from its own cold funnel. Its value here is as a CHEAPER instrument for a question already being answered, not as a new question."
        p2_reason: "Standard practice with no distinctive learning content for this profile, and it has no surface until a positioned offer exists. Homed, not deepened."
      - id: "C-110"
        name: "paid pilots"
        priority: "P0"
        kind: "durable"
        first_week: "M07"
        home_file: "tracks/micro-saas.md"
        surface: "Consulting Stage 3 and months 07–09; also scoreboard metric SM-21."
        mastery_check_ref: "D-m09-1"
        why_it_matters: "Threshold four is 'at least one payment or a strong purchase commitment'. Money is the only evidence in the whole framework that cannot be produced by politeness."
      - id: "C-111"
        name: "pre-sales where appropriate"
        priority: "P2"
        kind: "durable"
        first_week: "M07"
        home_file: "tracks/micro-saas.md"
        surface: "Months 07–09, contingent on a Stage 3 engagement existing."
        why_it_matters: "Pre-selling is the only validation instrument that cannot be faked by enthusiasm, which is exactly why it is gated on evidence rather than scheduled. Stating its precondition means an unmet precondition reads as the gate working rather than as the plan slipping."
        p2_reason: "Conditional on evidence the program may not have produced by month 07. Homed with its precondition stated rather than scheduled as if it were certain."
      - id: "C-112"
        name: "kill criteria"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "business/saas-validation.md"
        surface: "W12 — the five kill criteria applied, producing a verdict or an explicit non-verdict."
        mastery_check_ref: "D-w12-4"
        why_it_matters: "The user's stated goal is to learn to kill weak ideas early. A framework that always produces a score cannot do that, because a score is always actionable in the direction the author already wanted. Making 'insufficient evidence, deferred' a PASSING output is what gives the framework the ability to say no — and it is also what protects the program from inventing evidence when the funnel underperforms, which is the exact failure this whole branch structure exists to prevent."

  P:
    id: "P"
    name: "Track P — Program (pseudo-track)"
    home_file: "README.md"
    home_file_note: >-
      MOVED at G4. Was phases/phase-01-foundations.md, which forced check-canon to demand the
      verbatim "3.0" and "1.7%" inside a phase file -- directly against schemas.phase.rules,
      "phases NEVER own topics, hours or tasks". README already carries the time-commitment
      section, so programme overhead belongs there. The phase file may describe the retrospective
      cadence without stating hours.
    hours: 3.0
    share_of_180: "1.7%"
    coverage_rule_exempt: true
    included_in_check_hours_rule_4: true
    activity_class_declaration: >-
      Track P is classified `testing` BY DECLARATION, not by natural fit. A retrospective is
      measurement of the PROGRAM rather than of a system. The brief fixes the week template at
      four time-budget buckets (Theory / Building / Testing/evaluation / Customer discovery) and
      adding a fifth would break the mandated schema, so there is nowhere better to put it. Since
      the theory/building/testing seam is the one the assertion suite does NOT guard, this
      classification is declared here in canon so the G5 critic and the seven budget auditors do
      not re-litigate it and do not count it as a misclassification.
    funding: "3.0h total: W04 1.0h (M1 retrospective), W09 1.0h (M2), W12 1.0h (M3)."
    concepts:
      - id: "C-113"
        name: "the retrospective as control loop"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        home_file: "HOW-TO-EDIT.md"
        surface: "Three phase-1 retrospectives, each answering all ten questions in question_sets.monthly_retrospective plus its eleventh output RQ-11: a CANON DELTA. The loop is answer → record what changed → `make delta` → edit canon.yaml, bump meta.version → `make regen` → `make check`."
        mastery_check_ref: "D-m01-4"
        why_it_matters: "A twelve-month plan written once is a document that rots by month three. The retrospective is canon's only AUTHORISED MUTATION PATH, which is what makes the repository a system that adapts rather than a plan that decays. Its hard precondition is that `gen-derived` preserves the `<!-- user:actuals -->` regions byte-for-byte — without that, the first `make regen` destroys the logged actuals the hour recalibration reads."
      - id: "C-114"
        name: "hour recalibration against logged actuals"
        priority: "P0"
        kind: "durable"
        first_week: "W04"
        home_file: "months/month-01.md"
        surface: "M1's mandated delta: four weeks of logged actual hours compared to planned, per bucket; rewrite weeks[05..12].hours; above 15% overrun, invoke cut_list[]."
        mastery_check_ref: "D-m01-4"
        why_it_matters: "The 141 engineering hours are a single practitioner's estimate. Seven blind bottom-up re-estimates detect OUTLIERS, not CORRELATED optimism. The only uncorrelated instrument in the entire program is the user's own clock, and M1 is the first point at which it has said anything. The failure mode this exists to catch — the numbers agree perfectly and the weeks still take 22 hours — is survivable if and only if it is discovered in week 4 rather than month 6, and answered by cutting scope rather than by quietly falling behind."
      - id: "C-115"
        name: "funnel recalibration against measured conversion"
        priority: "P0"
        kind: "durable"
        first_week: "W09"
        home_file: "months/month-02.md"
        surface: "M2's mandated delta: the measured reply rate against the 1.5–8% assumption, and per-touch attribution against the 42–65% follow-up band. Placed at W09 because 47–52 matured sends is reached there; M1 reads only 15."
        mastery_check_ref: "D-m02-4"
        why_it_matters: "Every conversion number in this program comes from vendor-published cold-email marketing content whose authors have a commercial incentive to make outreach look more winnable than it is, and none of it separates a solo operator with no case study from an established SDR team with intent data. R6 says expect the program's own recalibration to move these numbers, plausibly by 2x IN EITHER DIRECTION. The plan's job is not to be right; it is to be wrong in a way that is measured and corrected on a fixed date."
      - id: "C-116"
        name: "ecosystem re-verification"
        priority: "P0"
        kind: "durable"
        first_week: "W12"
        home_file: "resources/ecosystem-snapshot-2026-08.md"
        surface: "M3's mandated delta: re-verify every [VOLATILE] claim in resources/ecosystem-snapshot-2026-08.md against its primary source and record what moved."
        mastery_check_ref: "D-m03-4"
        why_it_matters: "This program is built on facts with half-lives measured in weeks: an OTel convention set that is entirely Development status with no stable release, an MCP spec revision three weeks old at authoring time, a subscription quota boost with a published expiry date, an OWASP document that may have been superseded twenty-one days before this file was written. Quarantining all of it in ONE dated file with a re-verify date is the difference between a repository that ages honestly and one that becomes confidently wrong."

