    quota_ceiling: "<= 40 agent runs, incl. the 10-run measurement battery"
    planned_weekly_run_count: 40
    planned_weekly_run_count_note: "The number T-w01-6's trigger is read against, stated so the trigger is computable. It is this week's quota_ceiling and nothing else."
    quota_measurement_method:
      why: >-
        AC-w01-2b asks for weekly agent-run headroom AS A NUMBER, and the task previously said what
        to log without saying how to read remaining quota or how ten runs become a weekly figure.
        This block is the how. It is deliberately a procedure with a declared failure mode rather
        than a formula, because the vendor publishes a reset window and does not publish a weekly
        cap — see resources/ecosystem-snapshot-2026-08.md, "Subscription quota — measured, never
        quoted".
      battery: "Ten dispatches of tasks/example.md through S0, in ONE CONTIGUOUS SESSION, using the same pinned model for all ten."
      per_run_fields: ["harness", "model", "usage.input_tokens", "usage.output_tokens", "started_at", "ended_at", "wall_clock_seconds", "quota_stall_seconds"]
      per_run_source: "The CLI's JSON output. quota_stall_seconds is wall-clock the run spent blocked by the rate limiter, i.e. elapsed time not attributable to the model or to your own code — the same field SM-10 and SM-11 exclude their stalled samples by."
      extrapolation: >-
        Compute observed runs-per-window: the number of runs completed before the FIRST run whose
        quota_stall_seconds is greater than zero. Call it k. The published reset window for the plan
        tier is five hours, which gives 33 complete windows in a 168-hour week (168 / 5 = 33.6,
        floored, because a partial window at the week boundary carries no guaranteed allowance).
        The extrapolated weekly headroom is k x 33, and it is an UPPER BOUND: the vendor's weekly
        cap is not published and can bind before the per-window one does.
      no_stall_case: >-
        If none of the ten runs stalls, the battery has not found the ceiling. Record 10 as a FLOOR,
        label it `floor`, and do not multiply it up — a floor multiplied by 33 is an invention with
        a number attached. A floor is a usable result: it is what the W10 eval sizing needs least
        of.
      isolation: >-
        The quota bucket is shared with the chat surface and everything else on the account, so
        run the battery in one contiguous session and record every interactive turn that fell in
        the same window, or record that there were none. Where isolation was not achieved, the
        figure is a FLOOR rather than a measurement and must be labelled `floor` — the label is the
        deliverable, not the number, because a contaminated figure presented as a measurement is
        what the whole task exists to avoid.
      label_field: "Every headroom figure carries `basis: measurement | floor`. AC-w01-2b checks the label, not only the number."
      trigger: >-
        A measured headroom BELOW 80 RUNS PER WEEK — twice planned_weekly_run_count, which is 40 —
        authorises an immediate out-of-cycle canon delta rather than queueing behind M1, whose
        mandated slot already belongs to the hour recalibration. The same trigger is stated from
        the other side in the ecosystem snapshot as "fewer than two runs of headroom for every run
        the plan schedules". A `floor` result below 80 does NOT trip it: a floor is a statement
        about the battery, not about the ceiling.
    score_rules: {s0_runner_works: 30, adapter_contract_tested: 20, quota_measured: 15, failure_report_complete: 15, positioning_and_10_prospects: 20}
    depends_on: []

