      - {id: "T-w03-2", title: "Build S1b: idempotent steps, a dedup table under a unique constraint committed in the SAME transaction as the state transition, and resume-from-last-step", primary_track: "B", reinforces: [], activity_class: "building", hours: 3.0, deliverable_ids: ["D-w03-1"]}
      - {id: "T-w03-3", title: "Retries with jitter, an explicit error-classification truth table, and an aggregate retry budget across layers", primary_track: "B", reinforces: ["D"], activity_class: "building", hours: 1.0, deliverable_ids: ["D-w03-1"]}
      - {id: "T-w03-4", title: "Build the naive handler FIRST and replay one event 100 times recording duplicates; then make it effectively-once and replay again with kill -9 injected at random instruction boundaries, at least 20 of 100 interrupted, including between the commit and each external call", primary_track: "B", reinforces: [], activity_class: "testing", hours: 2.5, deliverable_ids: ["D-w03-1"]}
      - {id: "T-w03-5", title: "Classify in writing every duplicate the naive version produced, name which dedup mechanism would have prevented each, and write the one sentence explaining why the claim proved is effectively-once processing under at-least-once delivery", primary_track: "B", reinforces: [], activity_class: "testing", hours: 0.5, deliverable_ids: ["D-w03-1"]}
