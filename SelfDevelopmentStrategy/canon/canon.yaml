#  task in either week from `building` to `theory` breaks the assertion. That is
#  the correct sensitivity for a cap to have, and it is why the G5 critic and the
#  seven budget auditors are directed to recompute theory share FROM THEIR OWN
#  CLASSIFICATION rather than from the labels in this file.
