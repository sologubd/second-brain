  rule: >-
    A phase file states its span, arc, entry and exit criteria, its career checkpoint and what it
    does NOT cover. It links to weeks/, tracks/ and exercises/ rather than restating them. Months
    07-12 are deliberately thin (see months[].thin_by_decision), so P4 and P5 carry less detail by
    decision rather than by omission, and their files must say so.

# ---------------------------------------------------------------------------
# PROJECTS
# projects/*.md is the ONLY home for stage definitions and runnable-demo criteria.
# ---------------------------------------------------------------------------

projects:
  platform:
    id: "PRJ-01"
    name: "Engineering Agent Platform"
    home_file: "projects/engineering-agent-platform.md"
    is_flagship: true
    incremental_rule: "EVERY STAGE MUST BE RUNNABLE. Do not attempt all functionality initially; build it incrementally. A stage with no runnable demo command has not shipped."
    python_package:
      name: "agentplat"
      module_form: "python -m agentplat.run"
      rule: "THE PYTHON PACKAGE IS NAMED `agentplat`, NEVER `platform`."
      reason: >-
        `platform` is a Python standard-library module. A package of that name at the repository
        root shadows the stdlib for every process started from that directory, and the failure is
        not a clean import error at the call site — it surfaces as `ModuleNotFoundError: __path__
        attribute not found on 'platform'` from inside unrelated library code that imported the
        stdlib module for a version string. The project keeps its name, Engineering Agent Platform;
        only the importable package is renamed. Recorded here because a name collision that breaks
        the runner is a stage-zero defect, and this file is the only home for stage definitions.
    demo_target_rule:
      canonical_entry_point: "the `make` target"
      rule: >-
        `stages[].runnable_demo_command` is THE canonical entry point for a stage and is always the
        `make` form. Each target is a thin wrapper that shells the module form — `make demo-s0
        TASK=...` runs `python -m agentplat.run $(TASK)` — so there is exactly one command to type,
        one place the flags live, and no second spelling for prose to drift onto. Acceptance
        criteria cite the make form; where they name the module form as well, they name it as what
        the target wraps.
      wrapped_forms:
        - {target: "demo-s0", wraps: "python -m agentplat.run $(TASK)"}
        - {target: "demo-s1a", wraps: "python -m agentplat.run --resume-demo"}
        - {target: "demo-s1b-replay", wraps: "python -m agentplat.replay --n $(N)"}
        - {target: "demo-s2", wraps: "python -m agentplat.run --gate --pr $(TASK)"}
        - {target: "demo-s2b", wraps: "python -m agentplat.review --pr $(PR)"}
        - {target: "demo-s3", wraps: "python -m agentplat.sentry --issue $(ISSUE)"}
        - {target: "demo-s4-chaos", wraps: "python -m agentplat.chaos --workers $(WORKERS) --kill-pct $(KILL_PCT)"}
        - {target: "demo-s5", wraps: "python -m agentplat.run --trace"}
        - {target: "trace-view", wraps: "python -m agentplat.trace --view"}
        - {target: "gate-all", wraps: "python -m agentplat.gates --all"}
        - {target: "demo-s7a-attack", wraps: "python -m agentplat.attack --suite trust-boundary"}
        - {target: "demo-s7b-deputy", wraps: "python -m agentplat.attack --suite confused-deputy"}
        - {target: "demo-s8", wraps: "python -m agentplat.notion --task $(NOTION_TASK)"}
        - {target: "demo-s9", wraps: "python -m agentplat.adr --request $(REQUEST)"}
        - {target: "demo-ska-s0", wraps: "python -m agentplat.ska.retrieve --query $(QUERY) --tenant $(TENANT)"}
        - {target: "demo-ska-s1", wraps: "python -m agentplat.ska.answer"}
        - {target: "ska-metrics", wraps: "python -m agentplat.ska.metrics"}
        - {target: "demo-ska-s2-authz", wraps: "python -m agentplat.ska.authz --demo"}
        - {target: "demo-boa-s0", wraps: "python -m agentplat.boa.extract --url $(URL)"}
        - {target: "demo-boa-s1", wraps: "python -m agentplat.boa.outreach --prospect $(PROSPECT)"}
        - {target: "demo-boa-s2-memory", wraps: "python -m agentplat.boa.memory --account $(ACCOUNT)"}
    target_repository:
      rule: >-
        S0 AND EVERY LATER STAGE OPERATE AGAINST THE REPOSITORY NAMED IN THE TASK FILE'S
        `target_repo` FIELD, NEVER AGAINST THIS ONE. This repository holds prose, canon and seven
        checkers; it contains no application code for an agent to change, so a runner pointed at it
        has nothing to do and every diff it produced would be a diff against the plan.
      w01_default: "../agentplat-sandbox"
      w01_default_reason: >-
        A throwaway git repository the learner initialises beside this one before the first run.
        Sibling rather than nested, so a worktree the runner creates cannot land inside the
        programme repository; throwaway, because the first unattended run is expected to fail and
        `meta.no_git_commits` means nothing here may absorb that failure. Any repository with real
        code works from W02 onward — the field exists so the choice is written down per task rather
        than implied by whichever directory the command was typed in.
    task_file_schema:
      consumed_by: ["S0", "S2"]
      rule: >-
        A TASK FILE IS YAML FRONT MATTER FOLLOWED BY A MARKDOWN BODY. The front matter is the
        machine-readable contract; the body is what the agent reads. S0 (W01) and S2 (W04) consume
        the same shape, which is why it is defined here once rather than in either week.
      front_matter_fields:
        - {name: "id", type: "string", required: true, note: "Stable task identifier. Used as the worktree branch name and as the dedup natural key from S1b onward."}
        - {name: "target_repo", type: "path", required: true, note: "The repository the run operates against. See target_repository."}
        - {name: "files", type: "list of paths", required: true, note: "The declared file scope. EX-FAIL-10 (W08) partitions concurrent tasks on this list, so it is required from W01 even though nothing reads it until then."}
        - {name: "done_condition", type: "string", required: true, note: "One sentence a human can evaluate. Its ABSENCE is one of the three elements EX-FAIL-01's pre-dispatch score checks for."}
        - {name: "assertions", type: "list of strings", required: true, min_items: 1, note: "Each is a command or a predicate a machine can evaluate. At least one, or the specificity score fails."}
      body_rule: "Free markdown. Context, constraints and background — never the acceptance predicate, which lives in `assertions` where the scorer can find it."
      specificity_score: "EX-FAIL-01's pre-dispatch check reads exactly three things: `files` non-empty, `done_condition` present, `assertions` holding at least one entry. Each absent element is named in the refusal."
      example_files: ["tasks/example.md", "tasks/ambiguous.md"]
      example_files_note: >-
        TWO fixtures, because EX-FAIL-01's proving test needs both halves: `tasks/example.md` is
        valid and dispatches, `tasks/ambiguous.md` is missing `done_condition` and `assertions` and
        must be refused before any model call. One fixture would let a runner that refuses
        everything pass — the same control the checker fixtures apply to themselves.
    architectural_constraint_s0:
      id: "AC-S0-1"
      statement: >-
        THE HARNESS ADAPTER MUST SHELL OUT TO THE LITERAL `claude` CLI BINARY as a subprocess,
        in non-`--bare` `-p` mode. It MUST NOT import the Agent SDK library.
      reason: >-
        A `-p` session without `--bare` reuses whatever auth is already logged in, including OAuth
        from a subscription. Bare mode explicitly does not use subscription login and requires an
        API key. And the vendor's own legal and compliance page draws a hard line: developers
        building products or services that interact with Claude's capabilities, INCLUDING THOSE
        USING THE AGENT SDK, should use API-key authentication — while the same page states that
        it does not prevent an end user from signing in to the UNMODIFIED binary with their own
        subscription. That is exactly the pattern this build needs and it is affirmatively
        permitted, not merely tolerated. Importing the SDK library moves the entire program onto
        metered billing and destroys the zero-marginal-EUR premise. `codex exec` officially
        reuses saved CLI authentication and is the sanctioned Codex counterpart.
      soft_risk: >-
        Advertised usage limits for the relevant plans are stated to assume 'ordinary, individual
        usage'. Unattended multi-agent orchestration is not ordinary individual usage in spirit
        even when it is technically the same binary and the same login. Nothing in the published
        terms bans it outright — the explicit bans target reselling or intermediating subscription
        credentials for other people's traffic — but 'ordinary use' is undefined and enforceable
        at the vendor's discretion. Treat as a LIVE COMPLIANCE RISK TO MONITOR, not a blocker.
        Practical consequence: do not schedule so many concurrent unattended runs that the
        account's behaviour stops resembling one human developer's session pattern.
      unresolved: "The Codex ToS page returned HTTP 403 to direct fetch during research and was characterised only from secondary sources. DO NOT STATE CODEX ToS SPECIFICS AS VERIFIED. Flag for a primary re-check before the Codex adapter is finalised."
    stages:
      - {id: "S0", name: "single-task runner", week_or_month: "W01", entry: "A task file exists and a coding-agent CLI is logged in.", exit: "A task file becomes a captured diff inside a git worktree via an unattended subprocess with a versioned permission policy.", runnable_demo_command: "make demo-s0 TASK=tasks/example.md", capabilities_added: ["isolated worktrees", "agent permissions"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 40 runs"}
      - {id: "S1a", name: "durable task state machine and persistence", week_or_month: "W02", entry: "S0 exits.", exit: "Every step's completion is recorded durably before the next step starts; a restart resumes from the last recorded step.", runnable_demo_command: "make demo-s1a", capabilities_added: ["agent state", "persistence"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 25 runs"}
      - {id: "S1b", name: "idempotency, retries and resume (EXTENDS S1a)", week_or_month: "W03", entry: "S1a exits.", exit: "100 replays with injected kills produce exactly one state transition, one recorded PR-intent, one recorded Notion-intent and one dedup row per key -- all against a LOCAL RECORDING SINK, because S2 (real PR) is W04 and S8 (Notion) is M04.", runnable_demo_command: "make demo-s1b-replay N=100", external_effects_note: "STUBBED AT W03 (fixed at G8). S2 (GitHub PR) is W04 and S8 (Notion) is M04, so at W03 BOTH external effects go to a LOCAL RECORDING SINK, not to GitHub or Notion. The replay harness asserts at-most-once delivery to that sink. The 20 non-stubbed replays exercise the real outbox relay against the sink -- the delivery path is real, the destination is not. The audit found the earlier wording claimed a real PR and a real Notion page eight months and one week early, in the week canon itself calls the tightest in the programme.", capabilities_added: ["retries", "resume after failure"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 30 runs"}
      - {id: "S2", name: "verification gate, automated review, human approval, GitHub PR, CI", week_or_month: "W04", entry: "S1b exits and a GitHub repository is available.", exit: "A task becomes a merged-ready PR with zero manual steps other than approval; the approval payload renders the literal diff and the literal proposed call; CI reports back into the task record.", runnable_demo_command: "make demo-s2 TASK=tasks/example.md", capabilities_added: ["GitHub integration", "code review", "human approval", "CI integration", "automated PR generation"], capabilities_note: "skills REMOVED AT G5 (gap G5-01). S2 claimed it while weeks[04].stretch put SKILL.md packaging in the STRETCH goal, and stretch goals sit outside the 15h and vanish entirely at 8h -- so skipping the stretch, which canon explicitly permits, made this capability claim false. Skills now land in S9 (months 05-08), which the brief already pairs with agent roles. W04 keeps SKILL.md packaging as a genuine stretch: a first taste, not the capability claim.", cost_ceiling_eur: 0.0, quota_ceiling: "<= 45 runs"}
      - {id: "S2b", name: "multi-axis automated review", week_or_month: "M04", entry: "S2 exits.", exit: "A PR receives five INDEPENDENTLY SCORED, separately cited review outputs — one per axis — rather than one aggregate verdict.", runnable_demo_command: "make demo-s2b PR=<number>", capabilities_added: ["automated review (multi-axis)"], cost_ceiling_eur: 2.0, quota_ceiling: "<= 30 runs", note: "BR-148 resolution. See brief_requirement_resolutions.BR-148."}
      - {id: "S3", name: "Sentry diagnosis lane", week_or_month: "W07", entry: "S2 exits and a Sentry project with real historical issues is connected.", exit: "A real historical Sentry issue becomes a PR containing a regression test that fails on the parent commit and passes on the fix.", runnable_demo_command: "make demo-s3 ISSUE=<sentry-id>", capabilities_added: ["Sentry integration"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 70 runs"}
      - {id: "S4", name: "queue, concurrency, worktree isolation, locks", week_or_month: "W08", entry: "S1b exits.", exit: "N workers with at least 30% killed mid-task leave zero tasks stranded and zero duplicated effects; the dead-letter path is exercised.", runnable_demo_command: "make demo-s4-chaos WORKERS=4 KILL_PCT=30", capabilities_added: ["multiple concurrent tasks", "task queue"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 50 runs"}
      - {id: "S5", name: "observability and cost accounting", week_or_month: "W09", entry: "S4 exits.", exit: "One connected trace per run with correct nesting; token counts match provider-reported usage within rounding; the aggregate retry budget bounds spend under an induced failure storm.", runnable_demo_command: "make demo-s5 && make trace-view", capabilities_added: ["observability", "cost accounting"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 55 runs"}
      - {id: "S6", name: "evaluation harness and regression gates", week_or_month: "W10", entry: "S5 exits.", exit: "Three gate tiers run as separate checks; agent_regression runs N=5 per task with environment reset and reports a pass-rate distribution against a justified threshold.", runnable_demo_command: "make gate-all", capabilities_added: ["automated evals", "evals"], cost_ceiling_eur: 0.60, quota_ceiling: "100 agent executions per gate pass — THE BINDING CONSTRAINT"}
      - {id: "S7a", name: "trust boundaries, provenance and output validation", week_or_month: "W11", entry: "SKA-S1 and S6 exit.", exit: "Retrieved content is structurally untrusted; a turn that touched untrusted input cannot invoke an external-send tool, enforced in code and logged.", runnable_demo_command: "make demo-s7a-attack", capabilities_added: ["security boundaries"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 80 runs"}
      - {id: "S7b", name: "least privilege, sandboxing, approval gates, audit log (EXTENDS S7a)", week_or_month: "W12", entry: "S7a exits.", exit: "Every tool has a named profile; a call outside it is refused and logged; agent-executed code cannot reach the network; the audit log is append-only with provenance.", runnable_demo_command: "make demo-s7b-deputy", capabilities_added: ["security boundaries", "failure reporting"], cost_ceiling_eur: 0.0, quota_ceiling: "<= 45 runs"}
      - {id: "S8", name: "Notion ingestion, requirement extraction, ambiguity detection", week_or_month: "M04", entry: "S2 exits and a Notion workspace with an API token is connected.", exit: "A Notion task becomes a reviewed PR through the full 12-stage pipeline; ambiguity detection flags an underspecified task rather than guessing.", runnable_demo_command: "make demo-s8 NOTION_TASK=<id>", capabilities_added: ["Notion integration"], cost_ceiling_eur: 25.0, quota_ceiling: "<= 120 runs incl. the 40-run cross-harness comparison", note: "The cross-harness comparison lives here, which is what keeps W10 within its deliverable cap."}
      - {id: "S9", name: "architecture and ADR lane, agent roles and skills, failure reporting", week_or_month: "M05–M08", entry: "S8 exits.", exit: "An architecture request becomes an ADR through the 5-stage pipeline: request -> codebase research -> alternatives -> tradeoff analysis -> ADR.", runnable_demo_command: "make demo-s9 REQUEST=<path>", capabilities_added: ["different agent roles", "skills", "failure reporting"], cost_ceiling_eur: 20.0, quota_ceiling: "<= 100 runs"}
    flagship_capabilities:
      count: 20
      note: "The brief's 20 progressive capabilities, each mapped to the stage that first delivers it. Every one must be RUNNABLE at the stage that claims it."
      rows:
        - {capability: "GitHub integration", stage: "S2"}
