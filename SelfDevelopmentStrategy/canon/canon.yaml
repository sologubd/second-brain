# ---------------------------------------------------------------------------
# FUNNEL — CORRECTED. The plan's 2–15% x 40% model is SUPERSEDED.
# ---------------------------------------------------------------------------

funnel:
  supersedes: "Plan v5 C4.3: reply 2–15%, reply->booked-call 40%, expected 0.42–3.12 calls, 'planned as 2'."
  supersede_reason: >-
    R6 found the reply-rate band too generous as a CENTRAL expectation for a zero-case-study
    first-timer, and found the 40% reply->call figure to be the single weakest-evidenced number
    in the model — no source reports reply-to-meeting in isolation, and back-calculating from a
    3.43% platform-wide reply rate and a ~0.7% send-to-meeting rate implies about 20%, not 40%.
    The volumes are UNCHANGED (the user chose the derived numbers over the brief's illustrative
    targets). Only the conversion assumptions change.

  confidence_statement: >-
    Every conversion figure below derives from vendor-published cold-email marketing content.
    Those companies sell sending infrastructure, list-building or lead-gen services and each has
    a commercial incentive to publish numbers that make cold outreach look MORE winnable than it
    is for a first-timer. None of the aggregate benchmark posts disclose a methodology separating
    'solo operator, zero warm network, no case study, hand-written personalisation' — this
    program's actual starting condition — from 'established SDR team with intent data and a case
    study library sending at scale'. Treat every percentage as DIRECTIONAL, NOT PREDICTIVE, and
    expect the M2 recalibration to move it, plausibly by 2x IN EITHER DIRECTION.

  volumes:
    prospects_researched: 56
    prospects_manual: 24
    prospects_manual_breakdown: "W01 10 + W02 8 + W03 6, before BOA-S0 is usable"
    prospects_assisted: 32
    prospects_assisted_breakdown: "W04 10 + W06 22"
    sends: 52
    sends_hand_written: 15
    sends_hand_written_breakdown: "W02 4 + W03 5 + W04 6"
    sends_assisted: 37
    sends_assisted_breakdown: "W05 9 + W06 9 + W07 8 + W08 6 + W09 5"
    follow_ups: 104
    follow_ups_rule: "2 per prospect sent to. Validated by the follow-up multiplier, not assumed."
    workflow_documents: 2
    workflow_rehearsals: 1
    opportunities_scored: 2
    call_slots_budgeted_hours: 3.50
    call_slots_breakdown: "W04 1.50 (deliberately prep-light — the script is fresh from W03's rehearsal) + W05 1.75 (full all-in) + W08 0.25 (no-show/reschedule reserve, a distinct thing from call time)"
    volumes_vs_brief: >-
      The brief's illustrative monthly targets are 50 prospects researched / 30 personalized outreach /
      >=5 replies / >=3 discovery calls / >=5 documented workflows / >=3 automation
      opportunities scored / >=1 prototype opportunity PER MONTH — all seven. This program
      runs 56 / 52 / 2 workflow docs / 2 scored opportunities across TWELVE WEEKS. The brief's
      figures are illustrative and it explicitly permits better-researched targets; these are
      derived bottom-up from the 15h/week budget, and at the brief's volumes Track E alone would
      consume most of the week. The user chose the derived numbers. The gap is NAMED here rather
      than left to be discovered.

  reply_rate_band:
    low: 0.015
    high: 0.08
    midpoint: 0.0475
    basis: >-
      Vendor cross-convergence puts average B2B cold-email reply at 3.43% platform-wide, with a
      3–6% average band, 'good' at 5–10% and 'elite' above 10%. Small tightly-targeted lists of
      <=50 recipients are reported at ~5.8% against ~2.1% for large-list blasts, which favours
      this program's design but is a self-selected comparison inside one vendor's customer base.
    no_case_study_penalty:
      factor: "0.5–0.8x on the standard band"
      status: "EMBEDDED in the 1.5–8% band above, not applied separately. Applying 0.5–0.8x to a 3–8% standard band yields roughly 1.5–6.4%; the band's top is held at 8% for the best case where targeting and personalisation are unusually sharp and the list is very small, which the 52-send hand-picked design does resemble."
      confidence: "VERY LOW. The one directly relevant source is a single practitioner's anecdotal claim that contradicts the platform average by a factor of 5–7x. Honest read: expect a DISCOUNT versus the vendor average, not a premium, because case studies materially reduce buyer risk-perception and this sender is explicitly a first-timer."
    confidence: "MODERATE for the 3–6% average-campaign band; LOW for anything above 8% being achievable by a first-timer."
  reply_to_call_band:
    low: 0.15
    high: 0.35
    midpoint: 0.25
    confidence: "LOW — the weakest-evidenced number in the model."
    basis: >-
      No source reports a clean reply-to-meeting percentage. Vendors report meetings booked as a
      fraction of EMAILS SENT (commonly ~0.7–1%), which conflates the reply step with the
      reply->call step and cannot be cleanly decomposed. Back-calculating from 3.43% reply and
      ~0.7% send-to-meeting implies roughly 20%, but that arithmetic is fragile because 'reply'
      in the source datasets almost certainly includes bounces, auto-replies and gatekeeper
      messages that were filtered before the meeting figure was computed, so the two numbers may
      not share a denominator. Anything sustained above 35% is a genuinely good sign, not a
      baseline expectation.
  follow_up_multiplier:
    first_touch_share: 0.58
    follow_up_share: 0.42
    range: "42–65% of total replies come from follow-ups"
    confidence: "MODERATE-HIGH — the best-supported number in the whole market brief; several independently-run vendor datasets converge."
    consequence: "Two follow-ups per prospect is close to NECESSARY rather than optional, and sits inside the reported 2–3 follow-up sweet spot. The 104 follow-ups stay. Follow-ups must add new information; 'just checking in' is a touch that costs goodwill and buys nothing."
  lead_time:
    band_weeks: [1.5, 3.0]
    planning_assumption: "1 week (the FAST end), so a send made in week N matures by end of week N+1. Stated explicitly because every threshold below is sited against it. R6 considers 1.5–3 weeks the safer band; under the conservative read every row below fires ONE WEEK LATER than stated, and that shift is recorded rather than hidden."
    matured_sends_by_end_of_week: {W03: 4, W04: 9, W05: 15, W06: 24, W07: 33, W08: 41, W09: 47, W10: 52, W11: 52, W12: 52}

  expected_outcomes:
    # WORKING SHOWN. Poisson with lambda = matured_sends x reply_rate (x conversion for calls).
    #
    #   52 sends x [1.5%, 8%] reply = [0.78, 4.16] replies; midpoint 52 x 4.75% = 2.47 replies.
    #   52 x [1.5%,8%] x [15%,35%]  = [0.117, 1.456] calls; midpoint 52 x 4.75% x 25% = 0.6175.
    #
    expected_replies: "0.78 – 4.16 (midpoint 2.47)"
    expected_calls: "0.12 – 1.46 (midpoint 0.62)"
    stated_as: "0–1 calls expected, PLANNED AS 1."
    supersedes_stated_as: "Plan v5's '0–3 calls, planned as 2'. Two calls is not supportable under the corrected band: the midpoint expectation is 0.62 and even at the BAND CEILING the expectation is 1.46."
    expected_path_note: >-
      P(zero calls across the whole 52-send programme) = e^-0.6175 = 53.9% at the band midpoint,
      and 23.3% even at the band CEILING. ZERO CALLS IS THE MODAL OUTCOME. The direct consequence:
      the `fallback_deliverable` — consulting Stage 1, simulated — is the EXPECTED path for at
      least one of W07's workflow doc #1, W08's ROI calculation and W09's workflow doc #2, not the
      exception. W03's Stage-1 rehearsal is therefore LOAD-BEARING and must never be cut: it is
      where the fallback is practised rather than improvised.
    per_deliverable_rule: >-
      A business deliverable whose real-evidence precondition (a booked call) does not exist by
      its due week substitutes its `fallback_deliverable` for THAT WEEK ONLY, automatically, and
      tags the artifact evidence_source: simulated. This is INDEPENDENT of the branch-activation
      thresholds below, which govern the PROGRAM-level response. Substitution is partial — one
      deliverable at a time, never an all-or-nothing flip — because portfolio item #7 (the
      brief's 'at least one real external automation case study if possible') survives a weak
      funnel as long as ONE deliverable stays real.

  calls_expected_definition:
    field: "weeks[].funnel_targets.calls_expected and months[].funnel_targets.calls_expected"
    definition: "EXPECTED CALLS ATTRIBUTABLE TO SENDS MADE IN THIS PERIOD = period_sends x 0.0475 x 0.25, at the band midpoint."
    derivation:
      per_send_expectation: 0.011875
      weeks: {W04: 0.071, W05: 0.107}
      months: {M01: 0.178, M02: 0.380, M03: 0.059}
      months_reconcile: "15 + 32 + 5 = 52 sends. The UNROUNDED month values 0.178125 + 0.380000 + 0.059375 sum to exactly 0.6175, the programme-total midpoint expectation. The DISPLAYED three-decimal values sum to 0.617; the difference is display rounding, not a reconciliation gap. Stated this way because a rounding artefact presented as exact is the fitted-number failure this file criticises elsewhere."
    generator_rule: >-
      GEN-DERIVED SPECIAL CASE, STATED BECAUSE THE DEFAULT WOULD BE WRONG. Every other funnel key
      aggregates week -> month by SUMMING the constituent week rows, per the week-index mapping
      (month 01 = weeks 01-04, month 02 = 05-08, month 03 = 09-12). `calls_expected` MUST NOT be
      summed that way. Only W04 and W05 carry a week-level calls_expected, so summing gives
      M01 = 0.071 against the correct 0.178. The month value is RECOMPUTED from period_sends:
      month_calls_expected = (sends made in that month) x 0.011875. gen-derived implements this as
      an explicit exception and check-canon compares against the recomputed value, not a sum.
      The gate found this by noticing the sum disagreed with the published figure; the rule is
      written down here so the next reader does not have to rediscover it.
    corrected_at_g2: >-
      THE PUBLISHED VALUES WERE WRONG AND ARE CORRECTED. The first draft carried M01 0.29 /
      M02 0.24 / M03 0.09, which reconciled to no derivation, summed to 0.62 only by coincidence,
      and — as the gate observed — DECREASED from month 2 to month 3 while cumulative sends rose.
      That last oddity was the tell. Under the definition above the month-3 figure is genuinely
      the lowest of the three, because month 3 MAKES only five sends; the decrease is correct and
      the original numbers were simply miscomputed. Every other funnel field reconciled exactly,
      which is why this one standing apart mattered.
    attribution_note: "This field attributes a call to the period whose SENDS earned it, not to the period the call lands in. Calls land 1-3 weeks later; the maturation model in funnel.lead_time governs arrival, and the threshold rows are sited against arrival, not against attribution. The two views are deliberately separate and must not be summed together."
  thresholds:
    derivation_note: >-
      RE-DERIVED FROM THE CORRECTED BAND. The v5 thresholds were calibrated against 2–15% x 40%
      and are now wrong in exactly the way v3's were. A WATCH row must trip near the median of the
      NEW band (roughly 50–85% likely at the midpoint) and change nothing. An ACTIVATION row must
      sit GENUINELY BELOW the band (unlikely at the midpoint, materially likely only at or below
      the floor). Probabilities below are Poisson at the band midpoint unless stated.
    watch:
      purpose: "Expected to trip. Changes nothing. PRE-ANNOUNCED in phases/phase-01.md at week 1 as scheduled checkpoints WITH THEIR LIKELY OUTCOME, so tripping them reads as the plan working rather than failing."
      response: "Log to SCOREBOARD.md. Take no action."
      rows:
        - {id: "WATCH-1", condition: "0 replies after 9 matured sends (end of W04)", p_trip_at_midpoint: "65.2%", p_trip_at_band_floor: "87.4%"}
        - {id: "WATCH-2", condition: "0 booked calls by end of W05 (15 matured sends; expected calls 0.178)", p_trip_at_midpoint: "83.7%", p_trip_at_band_ceiling: "65.7%"}
        - {id: "WATCH-3", condition: "<=1 reply after 33 matured sends (end of W07)", p_trip_at_midpoint: "53.5%", p_trip_at_band_floor: "91.1%", note: "THE MEDIAN ROW. Replaces v5's '<=2 replies after 30 sends', which under the corrected band trips 79% of the time and would therefore be uninformative."}
        - {id: "WATCH-4", condition: "0 booked calls by end of W07 (33 matured sends; expected calls 0.392)", p_trip_at_midpoint: "67.6%", note: "DEMOTED from v5's activation set. Under the corrected band this is an expected outcome, not an anomaly."}
    branch_activation:
      purpose: "Genuinely below the corrected band."
      response: "The program-level response: re-pitch the funnel in an out-of-cycle canon delta, extend the Stage-1 simulated track for the remaining business deliverables, and draw any reclaimed hours from cut_list[]. Per-deliverable substitution has already been happening automatically under per_deliverable_rule; this row escalates it to a stated program position rather than a series of individual accommodations."
      rows:
        - {id: "ACT-1", condition: "0 replies after 41 matured sends (end of W08)", p_trip_at_midpoint: "14.3%", p_trip_at_band_floor: "54.1%", p_trip_at_band_ceiling: "3.8%"}
        - {id: "ACT-2", condition: "0 replies after 52 matured sends (end of W10 — all sends matured)", p_trip_at_midpoint: "8.5%", p_trip_at_band_floor: "45.8%", p_trip_at_band_ceiling: "1.6%"}
      deleted_rows:
        - row: "v5 activation row '0 booked calls by end of W07'"
          reason: "DEMOTED TO WATCH-4. Under the corrected band its midpoint trip probability is 67.6%."
        - row: "ANY call-count activation threshold, at any week"
          reason: >-
            STRUCTURALLY IMPOSSIBLE UNDER THE CORRECTED BAND, and this is the most important
            consequence of the correction. P(0 calls over all 52 sends) is 53.9% at the midpoint
            and 23.3% at the band CEILING. Zero calls is the modal outcome, so a zero-call event
            carries almost no information about whether performance is below band. Only
            REPLY-count rows can distinguish below-band performance, which is why both activation
            rows are reply-based. Canon states this rather than retaining a call-based row that
            would fire on the median and train the user to ignore it — the exact failure the two
            threshold classes exist to prevent.
        - row: "v5 activation row '<2% after 40 sends'"
          reason: "Already deleted in v5 as strictly implied by the zero-reply row. Stays deleted."
  evidence_discipline:
    rule: "SCOREBOARD.md carries `evidence_source: real | simulated` PER DELIVERABLE, so substitution is visible and can never inflate the funnel."
    checkpoint_rule: "The M3 checkpoint passes on PROCESS EXECUTED, not on calls booked. phases/phase-01-foundations.md states this at week 1."
    prohibition: "Inventing evidence is the failure the kill-criteria framework exists to prevent. A simulated artifact honestly tagged is a passing deliverable; a simulated artifact presented as real is a program failure."
  channel_note: "The program is EMAIL ONLY. LinkedIn outreach is repeatedly reported by LinkedIn-tool vendors to outperform cold email, with hard weekly volume caps, but every figure comes from sources with the same incentive problem and none is independently corroborated. The honest statement: this program is plausibly leaving reply-rate upside on the table, and that upside cannot be quantified at a citable standard. Do not put a number on it."

