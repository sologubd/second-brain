# FIXTURE (must fail): a two-week canon where W01's tasks sum to 14.5 and W02's
# to 15.5. The two errors cancel, so the TOTAL still reconciles, every activity
# bucket still agrees with its tasks, and the business <=> {E, F} identity still
# holds. Rules 2, 3, 4, 6 and 7 all pass on this file.
#
# That is the point. It proves rule 1 is SUBSTANTIVE and that the definitional
# rules cannot see an underpriced week — which is exactly the claim the
# `definitional` label in check-hours' output is making.

meta:
  version: "fixture"
  baseline_hours_per_week: 15.0
  theory_cap_hours_per_week: 3.5
  business_floor_hours_per_week: 2.5

tracks:
  A: {id: "A", name: "Track A — Agentic Engineering", home_file: "tracks/agentic-engineering.md", hours: 21.0}
  E: {id: "E", name: "Track E — Consulting", home_file: "tracks/consulting.md", hours: 9.0}
  P: {id: "P", name: "Track P — Program (pseudo-track, coverage-exempt)", hours: 0.0}

track_allocation:
  A: 21.0
  E: 9.0
  total: 30.0

weeks:
  "01":
    id: "W01"
    name: "Fixture week one — 0.5h short"
    hours: {theory: 3.0, building: 5.0, testing: 2.0, business: 4.5}
    tasks:
