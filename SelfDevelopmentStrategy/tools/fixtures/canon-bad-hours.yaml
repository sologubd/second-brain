      - {id: "T-w01-2", title: "Build the single-task runner", primary_track: "A", reinforces: [], activity_class: "building", hours: 5.0}
      - {id: "T-w01-3", title: "Prove the unattended invocation", primary_track: "A", reinforces: [], activity_class: "testing", hours: 2.0}
      - {id: "T-w01-4", title: "Research prospects by hand", primary_track: "E", reinforces: [], activity_class: "business", hours: 4.5}
  "02":
    id: "W02"
    name: "Fixture week two — 0.5h long"
    hours: {theory: 3.0, building: 6.0, testing: 2.0, business: 4.5}
    tasks:
      - {id: "T-w02-1", title: "Read the durable-execution chapter", primary_track: "A", reinforces: ["E"], activity_class: "theory", hours: 3.0}
